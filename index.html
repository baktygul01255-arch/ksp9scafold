дегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"28":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «На снимке видны кости, но не мышцы. Почему рентгену «видны» разные ткани по-разному?»","Задаёт три учебных вопроса:","- Где применяют рентген?","- Что такое радиоактивность?","- Почему рентгенолог уходит за защитную перегородку?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Станции: 1) таблица сравнения «рентген – УФ – видимый – гамма» (длина волны, энергия, проникающая способность, применение); 2) анализ рентгеновских снимков (изображения) – что видно и почему; 3) мини-исследование «Открытие Беккереля» по тексту; 4) правила безопасности: время – расстояние – экран.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: рентген – коротковолновое ЭМ излучение с большой проникающей способностью; радиоактивность – самопроизвольное излучение ядер."],["таблицы-сравнения, снимки, тексты, ноутбуки"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Рентген: λ ~ 10⁻¹⁰ м; E = hν = hc/λ; радиоактивность открыл А. Беккерель (1896).","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Суретте сүйектер көрінеді, ал бұлшықеттер көрінбейді. Рентген әртүрлі тіндерді неге әртүрлі «көреді»?»","Үш оқу сұрағын қояды:","- Рентген қайда қолданылады?","- Радиоактивтілік деген не?","- Рентгенолог қорғаныш қалқанының артына неге кетеді?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Станциялар: 1) «рентген – УК – көрінетін – гамма» салыстыру кестесі (толқын ұзындығы, энергия, өту қабілеті, қолданылуы); 2) рентген суреттерін талдау – не көрінеді және неге; 3) мәтін бойынша «Беккерель жаңалығы» шағын зерттеуі; 4) қауіпсіздік ережелері: уақыт – қашықтық – экран.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: рентген – өту қабілеті жоғары қысқа толқынды ЭМ сәуле; радиоактивтілік – ядролардың өздігінен сәуле шығаруы."],["салыстыру кестелері, суреттер, мәтіндер, ноутбуктер"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Рентген: λ ~ 10⁻¹⁰ м; E = hν = hc/λ; радиоактивтілікті А. Беккерель ашты (1896).","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"29":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Золотая фольга толщиной в несколько атомов «останавливает» лишь малую часть α-частиц. Что это говорит об атоме?»","Задаёт три учебных вопроса:","- Из каких частиц состоит атом?","- Что такое α-частица?","- Какие модели атома вы знаете?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Станция 1: PhET «Рассеяние Резерфорда» (Rutherford Scattering) – сравнение модели «пудинга с изюмом» и ядерной модели, наблюдение рассеяния. Станция 2: проникающая способность α, β, γ (ситуации: бумага – алюминий – свинец) в виде карточек-схем. Станция 3: PhET «Альфа-распад» – распад ядра.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: почти все α-частицы проходят, некоторые отклоняются на большие углы → в атоме есть малое массивное положительное ядро."],["ноутбуки/планшеты, PhET Rutherford Scattering, карточки-схемы"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: α – ядра гелия ⁴₂He; β – электроны (позитроны); γ – ЭМ излучение; планетарная модель Резерфорда: ядро + электроны.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А. Напоминает о предстоящем СОР №6."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Бірнеше атом қалыңдығындағы алтын фольга α-бөлшектердің аз ғана бөлігін «тоқтатады». Бұл атом туралы не айтады?»","Үш оқу сұрағын қояды:","- Атом қандай бөлшектерден тұрады?","- α-бөлшек деген не?","- Атомның қандай модельдерін білесіздер?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","1-станция: PhET «Резерфорд шашырауы» (Rutherford Scattering) – «мейізді бәліш» моделі мен ядролық модельді салыстыру, шашырауды бақылау. 2-станция: α, β, γ өту қабілеті (қағаз – алюминий – қорғасын) схема-карточкалар түрінде. 3-станция: PhET «Альфа-ыдырау» – ядроның ыдырауы.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: α-бөлшектердің дерлік барлығы өтіп кетеді, кейбіреулері үлкен бұрышқа ауытқиды → атомда кіші, массасы үлкен, оң зарядты ядро бар."],["ноутбуктер/планшеттер, PhET Rutherford Scattering, схема-карточкалар"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: α – гелий ядролары ⁴₂He; β – электрондар (позитрондар); γ – ЭМ сәуле; Резерфордтың планетарлық моделі: ядро + электрондар.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді. Алдағы БЖБ №6 туралы еске салады."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"30":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Протоны одинаково заряжены и отталкиваются, но в ядре держатся вместе. Что их удерживает?»","Задаёт три учебных вопроса:","- Из чего состоит атомное ядро?","- Чем отличаются изотопы одного элемента?","- Что значит запись ⁴₂He?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Группы получают таблицу масс (m_p, m_n, масса ядра) для дейтерия, гелия-4, кислорода-16. Вычисляют дефект масс Δm = Zm_p + Nm_n − M_я, энергию связи E = Δm·931,5 МэВ и энергию связи на нуклон; строят столбчатую диаграмму и находят, у каких ядер связь наиболее прочная.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: масса ядра меньше суммы масс нуклонов; ядерные силы – короткодействующие и очень мощные."],["таблицы масс, калькуляторы, ноутбуки"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Δm = Zm_p + Nm_n − M_я; E_св = Δm·c²; 1 а.е.м. = 931,5 МэВ.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Протондардың заряды бірдей, олар тебіседі, бірақ ядрода бірге ұсталады. Оларды не ұстап тұр?»","Үш оқу сұрағын қояды:","- Атом ядросы неден тұрады?","- Бір элемент изотоптары несімен ерекшеленеді?","- ⁴₂He жазуы нені білдіреді?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Топтар дейтерий, гелий-4, оттегі-16 үшін массалар кестесін (m_p, m_n, ядро массасы) алады. Масса ақауын Δm = Zm_p + Nm_n − M_я, байланыс энергиясын E = Δm·931,5 МэВ және бір нуклонға келетін байланыс энергиясын есептейді; бағанды диаграмма салып, қай ядролардың байланысы ең беріктігін анықтайды.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: ядро массасы нуклондар массаларының қосындысынан аз; ядролық күштер – қысқа әсерлі және өте күшті."],["массалар кестелері, калькуляторлар, ноутбуктер"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Δm = Zm_p + Nm_n − M_я; E_байл = Δm·c²; 1 а.м.б. = 931,5 МэВ.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"31":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Невозможно предсказать, когда распадётся конкретный атом, но можно точно сказать, когда распадётся половина. Как так?»","Задаёт три учебных вопроса:","- Что такое ядерная реакция?","- Что такое период полураспада?","- Что сохраняется в ядерных реакциях?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Модель распада: каждый «атом» – монета (по 64 на группу). Бросают монеты, «распавшиеся» (орёл) убирают; считают оставшихся по раундам, строят график N(t), находят «период полураспада». Затем решают уравнения ядерных реакций, подбирая недостающие Z и A. Дополнительно: PhET «Игра о радиоактивном датировании».","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: число нераспавшихся ядер убывает по закону с постоянным периодом: за каждый период остаётся половина; распад – вероятностный."],["монеты (по 64 на группу), карточки реакций, PhET Radioactive Dating Game"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: N = N₀·2^(−t/T); в реакциях сохраняются суммы Z и A.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Нақты атомның қашан ыдырайтынын болжау мүмкін емес, бірақ жартысының қашан ыдырайтынын дәл айтуға болады. Бұл қалай?»","Үш оқу сұрағын қояды:","- Ядролық реакция деген не?","- Жартылай ыдырау периоды деген не?","- Ядролық реакцияларда не сақталады?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Ыдырау моделі: әр «атом» – тиын (топқа 64-тен). Тиындарды лақтырып, «ыдыраған» (елтаңба) тиындарды алып тастайды; қалғандарды раундтар бойынша санап, N(t) графигін салып, «жартылай ыдырау периодын» табады. Содан кейін жетпейтін Z және A мәндерін таңдап, ядролық реакция теңдеулерін шешеді. Қосымша: PhET «Радиоактивті жас анықтау ойыны».","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: ыдырамаған ядролар саны тұрақты периодпен азаяды: әр периодта жартысы қалады; ыдырау – ықтималдық сипатты."],["тиындар (топқа 64-тен), реакция карточкалары, PhET Radioactive Dating Game"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: N = N₀·2^(−t/T); реакцияларда Z және A қосындылары сақталады.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"32":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Одна таблетка урана по энергии заменяет сотни килограммов угля. Откуда такая энергия?»","Задаёт три учебных вопроса:","- Что происходит с ядром урана-235 при поглощении нейтрона?","- Что такое цепная реакция?","- Что такое термоядерная реакция?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","В симуляции PhET «Ядерное деление» (Nuclear Fission) группы запускают нейтрон, наблюдают цепную реакцию и меняют число ядер, управляющие стержни. Затем составляют схему реактора (топливо, замедлитель, стержни, теплоноситель) и заполняют таблицу «Деление – синтез» (условия, энергия, пример, экология).","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: цепная реакция возможна, если каждый акт деления порождает хотя бы один нейтрон для следующего (k ≥ 1); стержни поглощают нейтроны и управляют реакцией."],["ноутбуки/планшеты, PhET Nuclear Fission, схема реактора"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: При делении ²³⁵U выделяется ≈ 200 МэВ; k ≥ 1 – цепная реакция; синтез лёгких ядер (термояд) – источник энергии Солнца.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Бір таблетка уран энергиясы жүздеген килограмм көмірдің орнын алмастырады. Бұл энергия қайдан келеді?»","Үш оқу сұрағын қояды:","- Уран-235 ядросы нейтронды жұтқанда не болады?","- Тізбекті реакция деген не?","- Термоядролық реакция деген не?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","PhET «Ядролық бөліну» (Nuclear Fission) симуляциясында топтар нейтронды жіберіп, тізбекті реакцияны бақылайды, ядролар санын, басқарушы өзектерді өзгертеді. Содан кейін реактор сызбасын (отын, баяулатқыш, өзектер, жылутасымалдағыш) жасап, «Бөліну – синтез» кестесін (шарттары, энергия, мысал, экология) толтырады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: тізбекті реакция әр бөліну актісі келесісі үшін кемінде бір нейтрон тудырғанда (k ≥ 1) мүмкін; өзектер нейтрондарды жұтып, реакцияны басқарады."],["ноутбуктер/планшеттер, PhET Nuclear Fission, реактор сызбасы"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: ²³⁵U бөлінгенде ≈ 200 МэВ бөлінеді; k ≥ 1 – тізбекті реакция; жеңіл ядролар синтезі (термоядро) – Күн энергиясының көзі.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"33":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Врач вводит пациенту радиоактивный препарат для диагностики. Почему это безопасно?»","Задаёт три учебных вопроса:","- Что такое изотопы?","- Чем опасно радиоактивное излучение?","- Какие элементарные частицы вы знаете?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Станция 1: карточки «Изотоп – область применения» (медицина, археология, промышленность, энергетика). Станция 2: «Защита от радиации» – расчёт и обсуждение: время, расстояние, экран. Станция 3: сортировка карточек частиц (электрон, нейтрино, протон, нейтрон, фотон, кварки) в таблицу «лептоны – адроны – переносчики».","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: защита: сократить время, увеличить расстояние, использовать экран; доза убывает как 1/r²; частицы делятся на лептоны, адроны и переносчики."],["карточки изотопов и частиц, таблицы, калькуляторы"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: N = N₀·2^(−t/T); доза от точечного источника ~ 1/r²; лептоны (e, ν) и адроны (p, n) – основные классы.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А. Напоминает о предстоящем СОР №7."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Дәрігер диагностика үшін науқасқа радиоактивті препарат енгізеді. Бұл неге қауіпсіз?»","Үш оқу сұрағын қояды:","- Изотоптар деген не?","- Радиоактивті сәулелену неліктен қауіпті?","- Қандай элементар бөлшектерді білесіздер?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","1-станция: «Изотоп – қолдану саласы» карточкалары (медицина, археология, өнеркәсіп, энергетика). 2-станция: «Радиациядан қорғану» – есептеу және талқылау: уақыт, қашықтық, экран. 3-станция: бөлшектер карточкаларын (электрон, нейтрино, протон, нейтрон, фотон, кварктар) «лептондар – адрондар – тасымалдаушылар» кестесіне сұрыптау.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: қорғану: уақытты қысқарту, қашықтықты арттыру, экран қолдану; доза 1/r² заңымен азаяды; бөлшектер лептондарға, адрондарға және тасымалдаушыларға бөлінеді."],["изотоптар мен бөлшектер карточкалары, кестелер, калькуляторлар"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: N = N₀·2^(−t/T); нүктелік көз дозасы ~ 1/r²; лептондар (e, ν) және адрондар (p, n) – негізгі кластар.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді. Алдағы БЖБ №7 туралы еске салады."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"34":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Какое открытие физики или астрономии изменило ваш взгляд на мир сильнее всего?»","Задаёт три учебных вопроса:","- Чем изменилось представление о мире от Птолемея до Коперника?","- Какие технологии вы используете каждый день?","- Как технологии влияют на природу?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Формат «Дебаты в группах»: каждая группа получает технологию (АЭС, солнечные панели, электромобили, ракетные запуски, 5G). Анализируют «пользу – риск – решение», готовят аргументы за 1 минуту, отвечают на вопросы оппонентов. Дополнительно: расчёт экономии энергии при замене лампы.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: каждая технология даёт пользу и несёт риски; решение должно учитывать природу и безопасность."],["карточки технологий, шаблон «польза – риск – решение», ноутбуки"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Физика и астрономия формируют научную картину мира; ответственное использование технологий – основа экологической культуры.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Физика немесе астрономияның қандай жаңалығы сіздің дүниеге көзқарасыңызды ең қатты өзгертті?»","Үш оқу сұрағын қояды:","- Птолемейден Коперникке дейін дүние туралы түсінік қалай өзгерді?","- Күн сайын қандай технологияларды пайдаланасыздар?","- Технологиялар табиғатқа қалай әсер етеді?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","«Топтық пікірсайыс» форматы: әр топ технология алады (АЭС, күн панельдері, электромобильдер, зымыран ұшыру, 5G). «Пайда – қауіп – шешім» бойынша талдап, 1 минутта дәлелдерін дайындайды, оппоненттердің сұрақтарына жауап береді. Қосымша: шамды ауыстырғандағы энергия үнемін есептеу.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: әр технология пайда әкеледі және қауіп тудырады; шешім табиғат пен қауіпсіздікті ескеруі тиіс."],["технология карточкалары, «пайда – қауіп – шешім» үлгісі, ноутбуктер"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Физика мен астрономия әлемнің ғылыми суретін қалыптастырады; технологияларды жауапты пайдалану – экологиялық мәдениеттің негізі.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]]},"ktp":{"ru":{"1":[["9.2.1.1","объяснять смысл понятий: материальная точка, система отсчета, относительность механического движения"],["9.2.1.2","производить сложение, вычитание векторов, умножение вектора на скаляр"],["9.2.1.3","находить проекцию вектора на координатную ось, раскладывать вектор на составляющие"]],"2":[["9.2.1.4","находить перемещение, скорость и ускорение из графиков зависимости этих величин от времени"],["9.2.1.5","применять формулы скорости и ускорения при равнопеременном прямолинейном движении в решении задач"],["9.2.1.6","применять уравнения координаты и перемещения при равнопеременном прямолинейном движении в решении задач"]],"3":[["9.2.1.7","экспериментально определять ускорение тела при равноускоренном движении"],["9.1.3.2","анализировать факторы, влияющие на результат эксперимента и предлагать методы улучшения эксперимента"],["9.2.1.8","строить и объяснять графики зависимости перемещения и скорости от времени при равноускоренном движении"]],"4":[["9.2.1.9","использовать кинематические уравнения равнопеременного движения для описания свободного падения"],["9.2.1.10","описывать движение тела, брошенного горизонтально, используя кинематические уравнения равнопеременного и равномерного движения"],["9.2.1.11","определять скорость движения тела, брошенного горизонтально"],["9.2.1.12","строить траекторию движения тела, брошенного горизонтально"]],"5":[["9.2.1.13","описывать равномерное движение тела по окружности, используя понятия линейных и угловых величин"],["9.2.1.14","применять формулу взаимосвязи линейной и угловой скорости при решении задач"],["9.2.1.15","применять формулы центростремительного ускорения при решении задач"]],"6":[["9.7.2.1","различать абсолютную и видимую звездные величины"],["9.7.2.2","называть факторы, влияющие на светимость звезд"]],"7":[["9.7.2.3","называть основные элементы небес const isDark=()=>{const t=document.documentElement.getAttribute('data-theme');if(t)return t==='dark';try{return matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}};

function toggleFull(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}}
