н тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"20":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «У маятниковых часов длина маятника подбирается очень точно. Почему именно длина?»","Задаёт три учебных вопроса:","- Что заставляет маятник вернуться в положение равновесия?","- Зависит ли период от массы груза?","- Как период связан с длиной нити?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","В симуляции PhET «Лаборатория маятника» (Pendulum Lab) и «Масса и пружины» группы по очереди меняют один параметр (l, m, амплитуду, k) и измеряют период. Результаты сводят в таблицу «Что меняем – как меняется T» и делают вывод.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: T математического маятника зависит от l и g, не зависит от m и малой амплитуды; T пружинного – от m и k."],["ноутбуки/планшеты, PhET Pendulum Lab, секундомеры, нити и грузы"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: T = 2π√(l/g); T = 2π√(m/k).","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Маятникті сағаттардың маятнигінің ұзындығы өте дәл таңдалады. Неге дәл ұзындық?»","Үш оқу сұрағын қояды:","- Маятникті тепе-теңдік қалпына не қайтарады?","- Период жүк массасына тәуелді ме?","- Период жіп ұзындығымен қалай байланысты?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","PhET «Маятник зертханасы» (Pendulum Lab) және «Массалар мен серіппелер» симуляцияларында топтар кезекпен бір параметрді (l, m, амплитуда, k) өзгертіп, периодты өлшейді. Нәтижені «Нені өзгертеміз – T қалай өзгереді» кестесіне жинап, қорытынды жасайды.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: Математикалық маятник T-сы l мен g-ге тәуелді, m мен шағын амплитудаға тәуелсіз; серіппелі маятниктікі – m және k-ға тәуелді."],["ноутбуктер/планшеттер, PhET Pendulum Lab, секундомерлер, жіптер мен жүктер"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: T = 2π√(l/g); T = 2π√(m/k).","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"21":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Можно ли «взвесить» притяжение Земли с помощью нитки и грузика?»","Задаёт три учебных вопроса:","- От каких величин зависит период математического маятника?","- Как уменьшить погрешность измерения периода?","- Почему измеряют время нескольких колебаний?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Выполнение лабораторной работы / исследование**","(20 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Роли: экспериментатор, хронометрист, регистратор, аналитик. Группа делает маятник с l = 0,4; 0,6; 0,8; 1,0 м, измеряет время 20 колебаний, вычисляет T, T² и g, строит график T²(l) и находит g по наклону k = 4π²/g. Педагог показывает первый замер («Я делаю»).","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: график T²(l) – прямая; g ≈ 9,8 м/с²; период не зависит от массы."],["штатив, нить, груз, линейка, секундомер, миллиметровая бумага"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: T = t/N; g = 4π²l/T²; наклон графика T²(l) равен 4π²/g.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(7 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Жіп пен жүк көмегімен Жердің тартылысын «өлшеуге» бола ма?»","Үш оқу сұрағын қояды:","- Математикалық маятниктің периоды қандай шамаларға тәуелді?","- Периодты өлшеу қателігін қалай азайтуға болады?","- Неге бірнеше тербеліс уақытын өлшейді?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зертханалық жұмысты орындау / зерттеу**","(20 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Рөлдер: тәжірибеші, хронометршы, тіркеуші, талдаушы. Топ l = 0,4; 0,6; 0,8; 1,0 м маятник жасап, 20 тербеліс уақытын өлшейді, T, T² және g есептейді, T²(l) графигін салып, көлбеуі k = 4π²/g арқылы g табады. Педагог бірінші өлшемді көрсетеді («Мен істеймін»).","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: T²(l) графигі – түзу; g ≈ 9,8 м/с²; период массаға тәуелсіз."],["штатив, жіп, жүк, сызғыш, секундомер, миллиметрлік қағаз"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: T = t/N; g = 4π²l/T²; T²(l) графигінің көлбеуі 4π²/g-ға тең.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(7 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"22":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Солдатам запрещают идти «в ногу» по мосту. Почему? И почему струна рояля «звенит» от голоса певца?»","Задаёт три учебных вопроса:","- Чем свободные колебания отличаются от вынужденных?","- Что такое собственная частота?","- Как правильно раскачивать качели?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Опыт с маятниками, подвешенными на одной нити (разные длины): раскачивают один – откликается тот, у кого совпадает длина. Затем в симуляции PhET «Резонанс» (Resonance) меняют частоту вынуждающей силы и строят график A(ν), находят максимум.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: амплитуда максимальна, когда частота вынуждающей силы равна собственной частоте системы."],["подвесные маятники, ноутбуки, PhET Resonance, камертоны"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Резонанс: ν_вын = ν₀ → амплитуда резко возрастает; полезен в музыкальных инструментах, вреден для мостов и зданий.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Сарбаздарға көпірден «қадамын түзеп» жүруге тыйым салынады. Неге? Әншінің даусынан рояль шегі неге «шыңылдайды»?»","Үш оқу сұрағын қояды:","- Еркін тербеліс еріксіз тербелістен несімен ерекшеленеді?","- Меншікті жиілік деген не?","- Әткеншекті дұрыс қалай тербетеді?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Бір жіпке ілінген (әртүрлі ұзындықтағы) маятниктермен тәжірибе: біреуін тербетеді – ұзындығы сәйкес келетіні жауап береді. Содан кейін PhET «Резонанс» (Resonance) симуляциясында мәжбүр етуші күш жиілігін өзгертіп, A(ν) графигін салып, максимумды табады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: амплитуда мәжбүр етуші күш жиілігі жүйенің меншікті жиілігіне тең болғанда максимал."],["ілме маятниктер, ноутбуктер, PhET Resonance, камертондар"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Резонанс: ν_мәж = ν₀ → амплитуда күрт өседі; музыкалық аспаптарда пайдалы, көпірлер мен ғимараттар үшін зиянды.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"23":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Радиоприёмник «настраивается» на волну. Что внутри него колеблется?»","Задаёт три учебных вопроса:","- Что такое конденсатор и катушка индуктивности?","- Что происходит с энергией в пружинном маятнике?","- Что может «колебаться» кроме тел?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Анимация/симуляция колебательного контура (Vascak, Opiq, симулятор цепей): группы пошагово фиксируют 4 фазы в течение периода – где заряд конденсатора максимален, где ток максимален, где энергия электрического/магнитного поля. Строят аналогию «контур – пружинный маятник».","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: энергия периодически переходит из электрического поля конденсатора в магнитное поле катушки и обратно; при отсутствии потерь колебания не затухают."],["ноутбуки/планшеты, анимация колебательного контура, таблица аналогий"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Колебательный контур = L + C; формула Томсона T = 2π√(LC).","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Радиоқабылдағыш толқынға «келтіріледі». Оның ішінде не тербеледі?»","Үш оқу сұрағын қояды:","- Конденсатор мен индуктивтілік катушкасы деген не?","- Серіппелі маятникте энергияға не болады?","- Денелерден басқа нені «тербелтуге» болады?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Тербелмелі контурдың анимациясы/симуляциясы (Vascak, Opiq, тізбек симуляторы): топтар период ішіндегі 4 фазаны бірте-бірте тіркейді – конденсатор заряды қай кезде максимал, ток қай кезде максимал, электр/магнит өрісі энергиясы қайда. «Контур – серіппелі маятник» ұқсастығын құрады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: энергия конденсатордың электр өрісінен катушканың магнит өрісіне және кері кезең-кезеңімен өтеді; шығын болмаса, тербеліс сөнбейді."],["ноутбуктер/планшеттер, тербелмелі контур анимациясы, ұқсастықтар кестесі"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Тербелмелі контур = L + C; Томсон формуласы T = 2π√(LC).","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"24":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Брошенный в воду камень порождает круги. Движется ли вода вместе с кругами?»","Задаёт три учебных вопроса:","- Что переносит волна – вещество или энергию?","- Чем отличаются продольные и поперечные волны?","- Что такое длина волны?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Выполнение лабораторной работы / исследование**","(20 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Группы наблюдают волны в кювете с водой (или в симуляции PhET «Волна на струне» / «Интерференция волн»): измеряют длину λ по расстоянию между гребнями, частоту ν (число колебаний поплавка за время), вычисляют v = λν; сравнивают с результатом v = s/t при движении гребня по линейке.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: волна переносит энергию, а не вещество; v = λν; скорость зависит от среды."],["кювета с водой, поплавок, линейка, секундомер, PhET «Волна на струне»"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: v = λν = λ/T; в продольных волнах колебания вдоль распространения, в поперечных – перпендикулярно.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(7 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Суға тасталған тас шеңберлер тудырады. Су шеңберлермен бірге қозғала ма?»","Үш оқу сұрағын қояды:","- Толқын нені тасымалдайды – затты ма, энергияны ма?","- Бойлық және көлденең толқындар несімен ерекшеленеді?","- Толқын ұзындығы деген не?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зертханалық жұмысты орындау / зерттеу**","(20 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Топтар су құйылған кюветтегі (немесе PhET «Жіптегі толқын» / «Толқындар интерференциясы» симуляциясындағы) толқындарды бақылайды: ұзындықты λ толқын төбелері аралығы бойынша, жиілікті ν (поплавок тербелістерінің уақытқа қатынасы) өлшеп, v = λν есептейді; нәтижені толқын төбесі сызғышпен жүрген кездегі v = s/t мәнімен салыстырады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: толқын энергияны тасымалдайды, затты емес; v = λν; жылдамдық ортаға тәуелді."],["суы бар кювета, поплавок, сызғыш, секундомер, PhET «Жіптегі толқын»"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: v = λν = λ/T; бойлық толқында тербеліс таралу бағытымен, көлденең толқында – перпендикуляр.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(7 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"25":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Ноты «ля» у скрипки и у рояля одной высоты, но звучат по-разному. Почему?»","Задаёт три учебных вопроса:","- Что такое звук и как он возникает?","- Распространяется ли звук в вакууме?","- Что такое эхо?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Станции: 1) камертоны и осциллограф (приложение на смартфоне) – связь высоты тона с частотой, громкости с амплитудой; 2) акустический резонанс двух камертонов на резонаторных ящиках; 3) PhET «Звуковые волны» (Sound Waves) – распространение звука в воздухе и в разных средах; 4) расчёт эха для школьного двора/зала.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: высота тона определяется частотой, громкость – амплитудой, тембр – набором гармоник; звуку нужна упругая среда."],["камертоны, смартфон-осциллограф, PhET Sound Waves, рулетка"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Звук – механические волны 16 Гц – 20 кГц; v в воздухе ≈ 340 м/с; эхо: s = vt/2; ультразвук > 20 кГц, инфразвук < 16 Гц.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А. Напоминает о предстоящем СОР №3 (по КТП)."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Скрипка мен роялдың «ля» нотасы бірдей биіктікте, бірақ әртүрлі естіледі. Неге?»","Үш оқу сұрағын қояды:","- Дыбыс деген не және ол қалай пайда болады?","- Дыбыс вакуумда таралады ма?","- Жаңғырық деген не?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Станциялар: 1) камертондар мен осциллограф (смартфондағы қосымша) – тон биіктігінің жиілікпен, қаттылықтың амплитудамен байланысы; 2) резонатор жәшіктеріндегі екі камертонның акустикалық резонансы; 3) PhET «Дыбыс толқындары» (Sound Waves) – дыбыстың ауада және әртүрлі ортада таралуы; 4) мектеп ауласы/залы үшін жаңғырықты есептеу.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: тон биіктігі жиілікпен, қаттылық амплитудамен, тембр гармоникалар жиынымен анықталады; дыбысқа серпімді орта қажет."],["камертондар, смартфон-осциллограф, PhET Sound Waves, рулетка"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Дыбыс – 16 Гц – 20 кГц механикалық толқындар; ауада v ≈ 340 м/с; жаңғырық: s = vt/2; ультрадыбыс > 20 кГц, инфрадыбыс < 16 Гц.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді. Алдағы БЖБ №3 (по КТП) туралы еске салады."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"26":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Радио, Wi-Fi, свет, рентген – всё это одна природа. Чем они отличаются?»","Задаёт три учебных вопроса:","- Что такое электромагнитная волна?","- Может ли свет распространяться в вакууме?","- Какие приборы дома используют радиоволны?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Станция 1: сортировка карточек диапазонов (радио, СВЧ, инфракрасное, видимое, ультрафиолет, рентген, гамма) по длине волны и частоте, с применением. Станция 2: призма или компакт-диск – наблюдение дисперсии, запись порядка цветов. Станция 3: PhET «Радиоволны и электромагнитные поля» (Radio Waves) – сравнение с механическими волнами.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: с ростом частоты длина волны уменьшается, энергия фотона растёт; белый свет раскладывается в спектр."],["карточки диапазонов, призма/CD, PhET Radio Waves"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: c = λν = 3·10⁸ м/с; ЭМ волны поперечны, распространяются в вакууме; дисперсия – зависимость показателя преломления от частоты.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Радио, Wi-Fi, жарық, рентген – барлығы бір табиғатты. Олар несімен ерекшеленеді?»","Үш оқу сұрағын қояды:","- Электромагниттік толқын деген не?","- Жарық вакуумда тарала ала ма?","- Үйде қандай құралдар радиотолқындарды қолданады?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","1-станция: диапазон карточкаларын (радио, аса жоғары жиілік, инфрақызыл, көрінетін, ультракүлгін, рентген, гамма) толқын ұзындығы мен жиілігі бойынша қолданылуымен бірге сұрыптау. 2-станция: призма немесе компакт-диск – дисперсияны бақылау, түстер реті. 3-станция: PhET «Радиотолқындар және электромагниттік өрістер» (Radio Waves) – механикалық толқындармен салыстыру.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: жиілік артқан сайын толқын ұзындығы азаяды, фотон энергиясы өседі; ақ жарық спектрге жіктеледі."],["диапазон карточкалары, призма/CD, PhET Radio Waves"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: c = λν = 3·10⁸ м/с; ЭМ толқындар көлденең, вакуумда таралады; дисперсия – сыну көрсеткішінің жиілікке тәуелділігі.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"27":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Раскалённая кочерга сначала красная, потом оранжевая, потом белая. Что «говорит» цвет о температуре?»","Задаёт три учебных вопроса:","- Что такое тепловое излучение?","- Как меняется цвет тела при нагревании?","- Что такое фотон?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","В симуляции PhET «Спектр абсолютно чёрного тела» (Blackbody Spectrum) группы меняют температуру и наблюдают смещение максимума излучения. В симуляции PhET «Фотоэффект» (Photoelectric Effect) меняют длину волны и интенсивность света, материал катода; находят красную границу и зависимость E_к от частоты.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: с ростом температуры максимум излучения смещается к коротким волнам; фотоэффект есть только при ν ≥ ν_min; E_к зависит от частоты, а не от интенсивности."],["ноутбуки/планшеты, PhET Blackbody Spectrum, PhET Photoelectric Effect"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: E = hν, h = 6,63·10⁻³⁴ Дж·с; hν = A + E_к; ν_min = A/h.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Қызған от шоқпарының түсі алдымен қызыл, содан кейін қызғылт сары, сосын ақ болады. Түс температура туралы не «айтады»?»","Үш оқу сұрағын қояды:","- Жылулық сәуле шығару деген не?","- Қыздырғанда дененің түсі қалай өзгереді?","- Фотон деген не?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","PhET «Абсолют қара дененің спектрі» (Blackbody Spectrum) симуляциясында топтар температураны өзгертіп, сәуле шығару максимумының ығысуын бақылайды. PhET «Фотоэффект» (Photoelectric Effect) симуляциясында жарық толқын ұзындығын, қарқындылығын, катод материалын өзгертіп, қызыл шекараны және E_к-ның жиілікке тәуелділігін табады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: температура өскен сайын сәуле шығару максимумы қысқа толқындарға ығысады; фотоэффект тек ν ≥ ν_min болғанда болады; E_к жиілікке тәуелді, қарқындылыққа емес."],["ноутбуктер/планшеттер, PhET Blackbody Spectrum, PhET Photoelectric Effect"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: E = hν, h = 6,63·10⁻³⁴ Дж·с; hν = A + E_к; ν_min = A/h.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгей
