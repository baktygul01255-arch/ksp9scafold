    const g=el('div','grid2');UI.refl[LANG].forEach(r=>g.append(el('div','card',esc(r))));b.append(g);b.append(el('div','meta',`<br>${U('hw')}`))}
}
function tabsBar(names,cb){const r=el('div','tabs');r.style.margin='0 0 .5em';names.forEach((n,i)=>{const b=el('button','',esc(n));b.setAttribute('aria-pressed',i===0);b.onclick=()=>{[...r.children].forEach((c,j)=>c.setAttribute('aria-pressed',j===i));cb(i)};r.append(b)});return r}

/* ===== teacher notes ===== */
function renderNotes(){const n=$('#notes'),x=cur(),s=ST.stage,R=rows()[s];n.innerHTML='';n.scrollTop=0;
  const stg=Array.isArray(R[0])?R[0].map(t=>md(t)).join(' · '):md(R[0]);
  n.append(el('h3','',U('steps')+' '+(s+1)));n.append(el('div','tm',`${stageName(s)} <span class="pill">${stageMin(s)} ${U('min')}</span>`));
  n.append(el('h3','',U('tPed')));n.append(el('div','',cell(R[1])));
  n.append(el('h3','',U('tPup')));n.append(el('div','',cell(R[2])));
  n.append(el('h3','',U('tAss')));n.append(el('div','',cell(R[3])));
  n.append(el('h3','',U('tRes')));n.append(el('div','',cell(R[4])));
  if(s===3){n.append(el('h3','',U('tExp')));n.append(el('div','ans',md(x.find[LANG])))}
  if(s===2){n.append(el('h3','',U('tScaf')));n.append(el('div','',cell(LANG?['- **Мен істеймін:** бірінші қадамды көрсетемін','- **Біз істейміз:** тірек картасы, жетелеуші сұрақтар','- **Сіз істейсіз:** А → Б → В, қолдау біртіндеп алынады']:['- **Я делаю:** показываю первый шаг','- **Мы делаем:** карта-подсказка, наводящие вопросы','- **Вы делаете:** А → Б → В, опора постепенно снимается'])))}
  if(s===4){n.append(el('h3','',U('tKey')));x.tasks.forEach((t,i)=>{const d=el('details','nt');d.innerHTML=`<summary>${UI.lv[LANG][i]}</summary>${cell(['**'+U('hint')+':** '+t.h[LANG],'**'+U('ans')+':** '+t.a[LANG]])}`;n.append(d)})}
  const d=el('details','nt');d.innerHTML=`<summary>${U('tPass')}</summary>${cell(['**'+U('comp')+':** '+x.comp.map(k=>k+' '+UI.comps[k][LANG]).join('; '),'**'+U('meth')+':** '+x.meth.map(k=>UI.meths[k][LANG]).join('; '),'**'+U('res')+':** '+x.res[LANG],'**'+U('life')+':** '+x.life[LANG]].concat(x.sop?['**СОР/БЖБ:** '+x.sop]:[]))}`;n.append(d);
  const k=lessonKTP();if(k.length){const d2=el('details','nt');d2.innerHTML=`<summary>${U('obj')}</summary>`+cell(k.map(([a,t])=>'- **'+a+'** '+t));n.append(d2)}
}

/* ===== dock & panels ===== */
let panel=null,panelKind='';
function closePanel(){if(panel){panel.remove();panel=null;panelKind=''}dockSync()}
function openPanel(kind,build,wide){if(panelKind===kind){closePanel();return}closePanel();panelKind=kind;panel=el('div','panel'+(wide?' wide':''));const h=el('h2','',`<span>${kind==='draw'?U('draw'):kind==='light'?U('light'):kind==='timer'?U('timer'):kind==='crit'?U('crit'):U('sims')}</span>`);const x=el('button','btn sm',U('close'));x.onclick=closePanel;h.append(x);panel.append(h);build(panel);app.append(panel);dockSync()}
const DOCK=[['pen','pen','pen'],['draw','dice','draw'],['light','light','light'],['timer','timer','timer'],['crit','crit','crit'],['sims','sim','sims']];
function buildDock(){const d=$('#dock');d.innerHTML='';
  DOCK.forEach(([k,ic,lab])=>{if(k==='timer')return;const b=el('button','',ico(IC[ic])+`<span>${U(lab)}</span>`);b.dataset.k=k;b.onclick=()=>tool(k);d.append(b)});
  const tm=el('button','timer','--:--');tm.id='tm';tm.onclick=()=>tool('timer');d.insertBefore(tm,d.children[3]);resetTimer(true)}
function dockSync(){document.querySelectorAll('#dock [data-k]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===panelKind||(b.dataset.k==='pen'&&penOn)))}
function tool(k){if(k==='pen'){togglePen();return}
  if(k==='draw')openPanel('draw',buildDraw);else if(k==='light')openPanel('light',buildLight);else if(k==='timer')openPanel('timer',buildTimer);else if(k==='crit')openPanel('crit',buildCrit,false);else if(k==='sims')openPanel('sims',buildSims,true)}

/* pen */
let penOn=false,strokes=[],penCol='#E5484D',penW=4,eraser=false;const cv=$('#pen'),cx=cv.getContext('2d');
function sizePen(){const r=window.devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';redrawPen()}
function redrawPen(){const r=window.devicePixelRatio||1;cx.setTransform(r,0,0,r,0,0);cx.clearRect(0,0,innerWidth,innerHeight);strokes.forEach(drawStroke)}
function drawStroke(s){cx.save();cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=s.w;cx.strokeStyle=s.c;cx.globalCompositeOperation=s.e?'destination-out':'source-over';cx.beginPath();s.p.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));if(s.p.length===1)cx.lineTo(s.p[0][0]+.1,s.p[0][1]);cx.stroke();cx.restore()}
let cs=null;
cv.addEventListener('pointerdown',e=>{if(!penOn)return;cv.setPointerCapture(e.pointerId);cs={p:[[e.clientX,e.clientY]],c:penCol,w:eraser?28:penW,e:eraser};strokes.push(cs);e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!cs)return;cs.p.push([e.clientX,e.clientY]);redrawPen()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{cs=null}));
addEventListener('resize',sizePen);
let penBar=null;
function togglePen(){penOn=!penOn;cv.classList.toggle('on',penOn);if(penOn)showPenBar();else if(penBar){penBar.remove();penBar=null}dockSync()}
function showPenBar(){if(penBar)penBar.remove();penBar=el('div','pentools');
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000';
  [ink,'#E5484D','#2F7BEA','#F2C14E','#3CB371'].forEach(c=>{const b=el('button','sw');b.style.background=c;b.setAttribute('aria-label',c);b.setAttribute('aria-pressed',!eraser&&c===penCol);b.onclick=()=>{penCol=c;eraser=false;showPenBar()};penBar.append(b)});
  const w=el('input');w.type='range';w.min=2;w.max=14;w.value=penW;w.style.width='90px';w.oninput=()=>penW=+w.value;
  const er=el('button','btn sm',eraser?'⌫ ✓':'⌫');er.onclick=()=>{eraser=!eraser;showPenBar()};
  const un=el('button','btn sm','↶');un.title=U('undo');un.onclick=()=>{strokes.pop();redrawPen()};
  const cl=el('button','btn sm',U('clear'));cl.onclick=()=>{strokes=[];redrawPen()};
  const off=el('button','btn sm pri','✕');off.onclick=togglePen;penBar.append(w,er,un,cl,off);app.append(penBar)}

/* draw lots */
let picked=[];
function names(){return ST.names.split('\n').map(s=>s.trim()).filter(Boolean)}
function buildDraw(p){
  const ta=el('textarea');ta.value=ST.names;ta.placeholder=U('names');ta.oninput=()=>{ST.names=ta.value;save()};
  p.append(el('div','meta',U('names')),ta);
  const out=el('div','pick','?');const bar=el('div','chips');bar.style.margin='10px 0';
  const nr=el('label','chip','<input type="checkbox" checked> '+U('noRepeat'));
  const b1=el('button','btn pri',U('pick'));
  b1.onclick=()=>{let pool=names();if(!pool.length)pool=Array.from({length:30},(_,i)=>String(i+1));if(nr.querySelector('input').checked){const f=pool.filter(n=>!picked.includes(n));if(!f.length){picked=[];}pool=f.length?f:pool}
    let i=0;const iv=setInterval(()=>{out.textContent=pool[Math.floor(Math.random()*pool.length)];if(++i>16){clearInterval(iv);const w=pool[Math.floor(Math.random()*pool.length)];out.textContent=w;picked.push(w)}},60)};
  const rs=el('button','btn',U('reset'));rs.onclick=()=>{picked=[];out.textContent='?'};
  const coin=el('button','btn',U('coin'));coin.onclick=()=>out.textContent=Math.random()<.5?(LANG?'Бүркіт':'Орёл'):(LANG?'Тура':'Решка');
  const dice=el('button','btn',U('dice'));dice.onclick=()=>out.textContent=1+Math.floor(Math.random()*6);
  bar.append(b1,rs,coin,dice,nr);p.append(bar,out);
  const gs=el('div','chips');gs.style.marginTop='10px';const sz=el('select','sel');sz.style.flex='0 0 auto';[2,3,4,5].forEach(v=>{const o=el('option','',v+' '+U('gsz'));o.value=v;if(v===4)o.selected=true;sz.append(o)});
  const gb=el('button','btn',U('groups')+' →');const gr=el('div','groups');
  gb.onclick=()=>{let pool=names();if(!pool.length)pool=Array.from({length:28},(_,i)=>String(i+1));for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const n=+sz.value;gr.innerHTML='';const roles=UI.roles[LANG];for(let i=0;i<pool.length;i+=n){const g=pool.slice(i,i+n);gr.append(el('div','',`<b>${Math.floor(i/n)+1}</b><br>`+g.map((m,k)=>`${esc(m)}<span class="meta"> · ${esc(roles[k%4])}</span>`).join('<br>')))}};
  gs.append(gb,sz);p.append(gs,gr)}

/* traffic light */
function buildLight(p){const mk=(which,title)=>{const w=el('div');w.append(el('h3','',title));const t=el('div','tally');[['l-g','green'],['l-y','yellow'],['l-r','red']].forEach(([c,k],i)=>{const d=el('div',c,`${TALLY[which][i]}<div class="meta" style="color:inherit;font:600 12px var(--f-b)">${U(k)}</div>`);d.onclick=()=>{TALLY[which][i]++;buildL()};d.oncontextmenu=e=>{e.preventDefault();TALLY[which][i]=Math.max(0,TALLY[which][i]-1);buildL()};t.append(d)});w.append(t);return w};
  const buildL=()=>{[...p.children].slice(1).forEach(c=>c.remove());p.append(mk('start',U('start')),mk('end',U('end')));const r=el('button','btn sm',U('reset'));r.style.marginTop='10px';r.onclick=()=>{TALLY={start:[0,0,0],end:[0,0,0]};buildL();renderBoard()};p.append(r,el('div','meta',LANG?'Басу = +1, оң жақ батырма = −1':'Нажатие = +1, правая кнопка = −1'))};buildL()}

/* timer */
let tmLeft=300,tmRun=false,tmIv=null;
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function tmShow(){const t=$('#tm');if(t){t.textContent=fmtT(tmLeft);t.classList.toggle('low',tmLeft<=30&&tmLeft>0)}const o=document.getElementById('tmBig');if(o)o.textContent=fmtT(tmLeft)}
function resetTimer(stage){tmRun=false;clearInterval(tmIv);if(stage)tmLeft=stageMin(ST.stage)*60;tmShow()}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g).connect(a.destination);o.start();setTimeout(()=>o.stop(),600)}catch(e){}}
function tmToggle(){if(tmRun){tmRun=false;clearInterval(tmIv)}else{if(tmLeft<=0)return;tmRun=true;tmIv=setInterval(()=>{tmLeft--;tmShow();if(tmLeft<=0){clearInterval(tmIv);tmRun=false;beep()}},1000)}}
function buildTimer(p){const big=el('div','pick','');big.id='tmBig';p.append(big);tmShow();const pr=el('div','chips');pr.style.margin='10px 0';
  [1,2,3,5,10].forEach(m=>{const b=el('button','btn',m+' '+U('min'));b.onclick=()=>{tmLeft=m*60;tmShow()};pr.append(b)});const sb=el('button','btn',`${stageName(ST.stage)}: ${stageMin(ST.stage)} ${U('min')}`);sb.onclick=()=>{tmLeft=stageMin(ST.stage)*60;tmShow()};pr.append(sb);
  const go=el('button','btn pri',tmRun?U('pause'):U('go'));go.onclick=()=>{tmToggle();go.textContent=tmRun?U('pause'):U('go')};const rs=el('button','btn',U('reset'));rs.onclick=()=>{resetTimer(true);go.textContent=U('go')};
  p.append(pr,el('div','chips')).lastChild.append(go,rs)}

/* criteria */
function rubric(x){const L=LANG;const t=(a,b)=>L?b:a;return [
 [0,1,t('Отвечает на учебные вопросы и выдвигает гипотезу (прогноз) по теме урока','Оқу сұрақтарына жауап береді және тақырып бойынша гипотеза (болжам) айтады')],
 [2,1,t('Выполняет свою роль в группе (экспериментатор, регистратор, аналитик, спикер)','Топтағы өз рөлін орындайды (тәжірибеші, тіркеуші, талдаушы, спикер)')],
 [2,1,t('Фиксирует данные (наблюдения) полно и точно','Деректерді (бақылауларды) толық әрі дәл тіркейді')],
 [2,1,t('Формулирует вывод исследования: ','Зерттеу қорытындысын жасайды: ')+x.find[L]],
 [3,1,t('Формулирует главную идею урока: ','Сабақтың басты ойын тұжырымдайды: ')+x.key[L]],
 [3,1,t('Даёт сверстнику обратную связь «две звезды и одно пожелание»','Құрдасқа «екі жұлдыз және бір тілек» кері байланысын береді')],
 [4,1,t('Верно записывает условие и выбирает формулу (тезис)','Шартты дұрыс жазады, формуланы (тезисті) таңдайды')],
 [4,1,t('Выполняет вычисления (рассуждение) без ошибок','Есептеуді (пайымдауды) қатесіз орындайды')],
 [4,1,t('Записывает ответ с единицей измерения (выводом) и проверяет по ключу','Жауабын өлшем бірлігімен (қорытындымен) жазады, кілт бойынша тексереді')],
 [5,1,t('Заполняет лист самоанализа: что получилось, что улучшить, следующий шаг','Өзін-өзі талдау парағын толтырады: не шықты, нені жақсарту, келесі қадам')]]}
function grade(v){return v>=9?'5':v>=7?'4':v>=5?'3':'2'}
function buildCrit(p){const R=rows()[ST.stage],x=cur();
  p.append(el('div','',`<div class="meta" style="margin-bottom:4px">${U('ts')} · ${stageName(ST.stage)}</div>`+cell(R[3])));
  p.append(el('div','',`<div class="meta" style="margin:10px 0 4px">${U('succ')}</div>`+cell(x.goals[LANG].map(g=>'- '+g))));
  const k=lessonKTP();if(k.length)p.append(el('div','',`<div class="meta" style="margin:10px 0 4px">${U('obj')}</div>`+cell(k.map(([a,t])=>'- **'+a+'** '+t))));
  p.append(el('h3','',U('scale')));
  const nm=names(),sel=el('select','sel');sel.style.cssText='width:100%;margin-bottom:8px';const o0=el('option','',U('all'));o0.value='';sel.append(o0);nm.forEach(n=>{const o=el('option','',esc(n));o.value=n;sel.append(o)});
  p.append(sel);const box=el('div');p.append(box);
  const key=()=>x.n+'|'+sel.value;
  const draw=()=>{const r=rubric(x),sc=ST.scores[key()]||[];box.innerHTML='';let last=-1,sum=0;
    r.forEach(([st,pt,tx],i)=>{if(st!==last){last=st;box.append(el('div','meta',`<br>${st+1}. ${stageName(st)}`))}
      const lb=el('label','',`<input type="checkbox" ${sc[i]?'checked':''}> <b>${pt} ${U('pt')}</b> ${md(tx)}`);lb.style.cssText='display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--line)';
      lb.firstChild.onchange=e=>{const a=ST.scores[key()]||(ST.scores[key()]=Array(10).fill(0));a[i]=e.target.checked?1:0;save();draw()};box.append(lb);sum+=sc[i]?pt:0});
    const t=el('div','tally');t.style.marginTop='12px';t.innerHTML=`<div class="l-g" style="font-size:30px">${sum}/10<div class="meta" style="color:inherit;font:600 12px var(--f-b)">${U('total')}</div></div><div class="l-y" style="font-size:30px">«${grade(sum)}»<div class="meta" style="color:inherit;font:600 12px var(--f-b)">${U('gr')}</div></div><div class="l-r" style="font-size:16px"><button class="btn sm" id="clrSc">${U('cl')}</button></div>`;box.append(t,el('div','meta',U('scNote')));
    box.querySelector('#clrSc').onclick=()=>{delete ST.scores[key()];save();draw()}};
  sel.onchange=draw;draw()}

/* simulators */
function buildSims(p){const x=cur(),key='n'+x.n;const body=el('div');p.append(body);
  const list=el('div','simlist');const fr=el('div');const own=ST.links[key]||[];
  const row=(t,u,del)=>{const a=el('a','',`<span><b>${esc(t)}</b><br><small>${esc(u)}</small></span>`);a.href=u;a.target='_blank';a.rel='noopener';const r=el('div','chips');const eb=el('button','btn sm',U('emb'));eb.onclick=ev=>{ev.preventDefault();show(u)};r.append(eb);if(del){const db=el('button','btn sm','✕');db.onclick=ev=>{ev.preventDefault();ST.links[key].splice(del-1,1);save();p.innerHTML='';p.remove();panel=null;panelKind='';openPanel('sims',buildSims,true)};r.append(db)}a.append(r);return a};
  function show(u){fr.innerHTML='';const f=el('iframe','sim');f.src=u;f.setAttribute('allowfullscreen','');f.setAttribute('referrerpolicy','no-referrer');fr.append(f,el('div','meta',U('embNote')+' '+`<a href="${esc(u)}" target="_blank" rel="noopener">${U('open')}</a>`))}
  body.append(el('h3','',U('std')));simsFor(x.n).forEach(s=>list.append(row(s.t,s.u)));body.append(list);
  body.append(el('h3','',`<br>${U('own')}`));const ol=el('div','simlist');own.forEach((o,i)=>ol.append(row(o.t,o.u,i+1)));body.append(ol);
  const f=el('div','chips');f.style.margin='10px 0';const nm=el('input');nm.placeholder=U('nm');nm.style.cssText='flex:1 1 140px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)';const ur=el('input');ur.placeholder=U('addPh');ur.style.cssText='flex:3 1 240px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)';
  const ad=el('button','btn pri',U('add'));ad.onclick=()=>{let u=ur.value.trim();const m=u.match(/src=["']([^"']+)["']/);if(m)u=m[1];if(!/^https?:\/\//.test(u))return;(ST.links[key]=ST.links[key]||[]).push({t:nm.value.trim()||u.replace(/^https?:\/\//,'').slice(0,40),u});save();panel.remove();panel=null;panelKind='';openPanel('sims',buildSims,true)};
  f.append(nm,ur,ad);body.append(f,fr);
  const first=simsFor(x.n)[0];if(first)show(first.u)}

/* ===== render ===== */
function render(){buildRail();renderBoard();renderNotes();document.title=U('brand')}
function stageChanged(){save();strokes=[];redrawPen();resetTimer(true);if(panelKind==='crit'){const k=panelKind;closePanel();openPanel('crit',buildCrit)}render()}
function lessonChanged(){TALLY={start:[0,0,0],end:[0,0,0]};picked=[];closePanel();buildBar();stageChanged()}
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||'')))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){if(ST.stage<5){ST.stage++;stageChanged()}else if(ST.n<34){ST.n++;ST.stage=0;lessonChanged()}}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){if(ST.stage>0){ST.stage--;stageChanged()}else if(ST.n>1){ST.n--;ST.stage=5;lessonChanged()}}
  else if(e.key==='Escape')closePanel()});
applyTheme();buildDock();sizePen();apply();

</script>
