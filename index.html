та көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"12":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Конькобежцы толкают друг друга и разъезжаются в разные стороны. Почему «отъезжает» и тот, кто толкал?»","Задаёт три учебных вопроса:","- Что такое взаимодействие тел?","- Приложены ли силы взаимодействия к одному телу?","- Почему при ударе ногой по мячу больно и ноге?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Пары динамометров: два динамометра сцепляют крючками, один тянут, второй держат (затем оба движутся); записывают показания. Тележки с пружиной-«стреляющей»: сравнивают пути разъезда при разных массах. Вывод записывают в таблице «Что одинаково / что различно» для сил F₁₂ и F₂₁.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: силы равны по модулю, противоположны по направлению, одной природы и приложены к разным телам."],["динамометры, тележки, пружины, таблицы для записи"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: F₁₂ = −F₂₁; силы действия и противодействия не уравновешивают друг друга, так как приложены к разным телам.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А. Напоминает о предстоящем СОР №3."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Сырғанақшылар бірін-бірі итеріп, әртүрлі жаққа кетеді. Итерген адам да неге кері кетеді?»","Үш оқу сұрағын қояды:","- Денелердің әрекеттесуі деген не?","- Әрекеттесу күштері бір денеге түсірілген бе?","- Допты теуіп қалғанда аяқ неге ауырады?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Динамометр жұптары: екі динамометрді ілмектерімен ілестіреді, біреуін тартып, екіншісін ұстайды (сонан соң екеуі де қозғалады); көрсеткіштерді жазады. «Атылатын» серіппелі арбалар: әртүрлі массада алшақтау жолдарын салыстырады. Қорытындыны F₁₂ және F₂₁ күштері үшін «Не бірдей / не әртүрлі» кестесіне жазады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: күштер модулі бойынша тең, бағыты қарама-қарсы, табиғаты бірдей және әртүрлі денелерге түсірілген."],["динамометрлер, арбалар, серіппелер, жазу кестелері"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: F₁₂ = −F₂₁; әрекет және қарсы әрекет күштері әртүрлі денелерге түсірілгендіктен бірін-бірі теңестірмейді.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді. Алдағы БЖБ №3 туралы еске салады."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"13":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Почему Луна не падает на Землю и не улетает в космос?»","Задаёт три учебных вопроса:","- Какая сила удерживает Луну на орбите?","- Зависит ли сила тяжести от массы планеты?","- Одинаково ли вы весите на Земле и на Луне?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","В симуляции PhET «Гравитационная сила» (Gravity Force Lab) группы меняют m₁, m₂ и расстояние r, записывают F: сначала при удвоении одной массы, затем при удвоении расстояния. Находят, как меняется F, и записывают вывод.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: F пропорциональна m₁m₂ и обратно пропорциональна r²."],["ноутбуки/планшеты, PhET Gravity Force Lab, карты-подсказки"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: F = G·m₁m₂/r²; G = 6,67·10⁻¹¹ Н·м²/кг²; g = GM/R².","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Ай неге Жерге құламайды және ғарышқа ұшып кетпейді?»","Үш оқу сұрағын қояды:","- Айды орбитада қандай күш ұстап тұр?","- Ауырлық күші планета массасына тәуелді ме?","- Жерде және Айда салмағыңыз бірдей ме?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","PhET «Тартылыс күші» (Gravity Force Lab) симуляциясында топтар m₁, m₂ және r қашықтығын өзгертіп, F мәнін жазады: алдымен бір массаны екі есе арттырғанда, содан кейін қашықтықты екі есе арттырғанда. F қалай өзгеретінін табады және қорытынды жазады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: F m₁m₂-ге пропорционал және r²-қа кері пропорционал."],["ноутбуктер/планшеттер, PhET Gravity Force Lab, тірек карталары"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: F = G·m₁m₂/r²; G = 6,67·10⁻¹¹ Н·м²/кг²; g = GM/R².","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"14":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «В лифте, который резко поехал вверх, вы чувствуете себя «тяжелее», а при спуске – «легче». Что изменилось: масса или вес?»","Задаёт три учебных вопроса:","- Чем вес отличается от силы тяжести?","- К чему приложен вес тела?","- Почему космонавты на орбите «парят»?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Модель лифта: груз на динамометре (или смартфон с датчиком) поднимают и опускают сначала равномерно, затем с ускорением вверх и вниз; записывают показания и сравнивают с mg. Видео невесомости на МКС и «падающий» стаканчик с отверстием, из которого перестаёт течь вода.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: вес больше mg при ускорении вверх, меньше mg при ускорении вниз; при a = g вес равен нулю."],["динамометры, грузы, смартфоны, видео, стаканчик с отверстием"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: P = m(g + a) при ускорении вверх; P = m(g − a) при ускорении вниз; при свободном падении P = 0 (невесомость).","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Лифт күрт жоғары көтерілгенде өзіңізді «ауыр», төмен түскенде «жеңіл» сезінесіз. Не өзгерді: масса ма, салмақ па?»","Үш оқу сұрағын қояды:","- Салмақтың ауырлық күшінен айырмашылығы неде?","- Дене салмағы неге түсірілген?","- Ғарышкерлер орбитада неге «қалқиды»?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Лифт моделі: динамометрдегі жүкті (немесе датчигі бар смартфонды) алдымен бірқалыпты, содан кейін жоғары және төмен үдеумен көтеріп-түсіреді; көрсеткіштерді жазып, mg-мен салыстырады. ХҒС-тағы салмақсыздық бейнесі және су ағуын тоқтататын тесігі бар «құлайтын» стақанша.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: жоғары үдеу кезінде салмақ mg-дан көп, төмен үдеу кезінде mg-дан аз; a = g болғанда салмақ нөлге тең."],["динамометрлер, жүктер, смартфондар, бейне, тесігі бар стақанша"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: P = m(g + a) жоғары үдеу кезінде; P = m(g − a) төмен үдеу кезінде; еркін түсу кезінде P = 0 (салмақсыздық).","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"15":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Мяч подбросили вверх. В верхней точке скорость равна нулю – значит, и ускорение нулевое?»","Задаёт три учебных вопроса:","- С каким ускорением движется тело, брошенное вверх?","- Что происходит со скоростью на подъёме и при спуске?","- От чего зависит дальность полёта?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","В симуляции PhET «Движение снаряда» группы запускают тело вертикально и под углом, фиксируют время подъёма, максимальную высоту и дальность при разных v₀ и углах. Сравнивают с расчётом по формулам и находят, при каком угле дальность максимальна (без сопротивления воздуха).","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: ускорение всегда g и направлено вниз; время подъёма равно времени спуска; наибольшая дальность – при угле 45°."],["ноутбуки/планшеты, PhET «Движение снаряда», линейки"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Вверх: v = v₀ − gt; h_max = v₀²/2g; t_полёта = 2v₀/g. Горизонтально: l = v₀t, h = gt²/2.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А. Напоминает о предстоящем СОР №4."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Допты жоғары лақтырды. Жоғарғы нүктеде жылдамдық нөлге тең – демек, үдеу де нөл ме?»","Үш оқу сұрағын қояды:","- Жоғары лақтырылған дене қандай үдеумен қозғалады?","- Көтерілгенде және түскенде жылдамдық қалай өзгереді?","- Ұшу қашықтығы неге тәуелді?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","PhET «Снаряд қозғалысы» симуляциясында топтар денені тік және бұрыш жасай жібереді, әртүрлі v₀ мен бұрыштарда көтерілу уақытын, ең үлкен биіктік пен қашықтықты тіркейді. Формулалармен есептеуді салыстырып, қай бұрышта қашықтық ең үлкен болатынын анықтайды (ауа кедергісінсіз).","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: үдеу әрқашан g және төмен бағытталған; көтерілу уақыты түсу уақытына тең; ең үлкен қашықтық – 45° бұрышта."],["ноутбуктер/планшеттер, PhET «Снаряд қозғалысы», сызғыштар"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Жоғары: v = v₀ − gt; h_max = v₀²/2g; t_ұшу = 2v₀/g. Горизонталь: l = v₀t, h = gt²/2.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді. Алдағы БЖБ №4 туралы еске салады."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"16":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Космодром Байконур – старт к МКС. Почему спутник не падает на Землю, хотя на него действует тяготение?»","Задаёт три учебных вопроса:","- Что такое искусственный спутник Земли?","- Какая сила сообщает спутнику центростремительное ускорение?","- Чем геостационарная орбита отличается от низкой?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","В симуляции PhET «Гравитация и орбиты» (Gravity and Orbits) группы меняют начальную скорость спутника и наблюдают: падение, эллипс, круговая орбита, уход в космос. Находят скорость круговой орбиты, сравнивают с расчётом v₁ = √(gR), заполняют таблицу «Низкая / геостационарная орбита» (высота, период, применение).","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: при v₁ ≈ 7,9 км/с орбита круговая; при большей скорости – эллипс; период геостационарного спутника равен 24 ч."],["ноутбуки/планшеты, PhET Gravity and Orbits, таблица орбит"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: v₁ = √(gR) = √(GM/R) ≈ 7,9 км/с; при движении по круговой орбите сила тяготения создаёт центростремительное ускорение.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Байқоңыр ғарыш айлағы – ХҒС-қа ұшу басталатын орын. Серікке тартылыс күші әсер етсе де, ол неге Жерге құламайды?»","Үш оқу сұрағын қояды:","- Жердің жасанды серігі деген не?","- Серікке центрге тартқыш үдеуді қандай күш береді?","- Геотұрақты орбита төмен орбитадан немен ерекшеленеді?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","PhET «Гравитация және орбиталар» (Gravity and Orbits) симуляциясында топтар серіктің бастапқы жылдамдығын өзгертіп, құлауды, эллипсті, дөңгелек орбитаны, ғарышқа кетуді бақылайды. Дөңгелек орбита жылдамдығын тауып, v₁ = √(gR) есебімен салыстырады, «Төмен / геотұрақты орбита» кестесін (биіктік, период, қолданылуы) толтырады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: v₁ ≈ 7,9 км/с болғанда орбита дөңгелек; жылдамдық үлкен болса – эллипс; геотұрақты серіктің периоды 24 сағатқа тең."],["ноутбуктер/планшеттер, PhET Gravity and Orbits, орбиталар кестесі"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: v₁ = √(gR) = √(GM/R) ≈ 7,9 км/с; дөңгелек орбитада тартылыс күші центрге тартқыш үдеуді тудырады.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"17":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Надутый шарик, отпущенный из рук, носится по комнате. Что его «толкает»?»","Задаёт три учебных вопроса:","- Что такое замкнутая система?","- Что произойдёт с лодкой, если с неё прыгнуть на берег?","- Как работает ракета в безвоздушном пространстве?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","В симуляции PhET «Лаборатория столкновений» (Collision Lab) группы задают массы и скорости двух шаров, фиксируют импульсы до и после соударения (упругого и неупругого) и сравнивают суммарный импульс. Дополнительно: опыт с воздушным шариком и «реактивной» тележкой.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: суммарный импульс замкнутой системы сохраняется в упругом и неупругом ударе."],["ноутбуки/планшеты, PhET Collision Lab, воздушные шарики, тележки"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: p = mv; импульс силы FΔt = Δp; m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Қолдан жіберілген үрленген шар бөлмені аралап ұшады. Оны не «итереді»?»","Үш оқу сұрағын қояды:","- Тұйық жүйе деген не?","- Қайықтан жағаға секірсе, қайық не болады?","- Зымыран ауасыз кеңістікте қалай жұмыс істейді?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","PhET «Соқтығысу зертханасы» (Collision Lab) симуляциясында топтар екі шардың массалары мен жылдамдықтарын беріп, соқтығысқа дейінгі және кейінгі импульстарды (серпімді және серпімсіз) тіркеп, қосынды импульсті салыстырады. Қосымша: ауа шарымен және «реактивті» арбамен тәжірибе.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: тұйық жүйенің қосынды импульсі серпімді және серпімсіз соққыда сақталады."],["ноутбуктер/планшеттер, PhET Collision Lab, ауа шарлары, арбалар"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: p = mv; күш импульсі FΔt = Δp; m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"18":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Альпинист поднимает рюкзак, а затем стоит с ним на месте. В какой момент он совершает работу?»","Задаёт три учебных вопроса:","- Что такое механическая работа?","- Какие виды механической энергии вы знаете?","- Куда «исчезает» потенциальная энергия падающего тела?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","В симуляции PhET «Энергия в скейт-парке» (Energy Skate Park) группы строят график кинетической, потенциальной и полной энергии при движении скейтбордиста; находят, как меняется E при отсутствии и наличии трения. Дополнительно: по графику F(s) на карточке вычисляют работу как площадь.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: без трения E_к + E_п = const; работа силы равна изменению энергии; работа на графике – площадь под F(s)."],["ноутбуки/планшеты, PhET Energy Skate Park, карточки с графиками F(s)"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: A = Fs·cosα; E_к = mv²/2; E_п = mgh; E_к + E_п = const; A = ΔE.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Альпинист рюкзакты көтереді, содан кейін онымен тұрады. Қай сәтте ол жұмыс жасайды?»","Үш оқу сұрағын қояды:","- Механикалық жұмыс деген не?","- Механикалық энергияның қандай түрлерін білесіздер?","- Құлап келе жатқан дененің потенциалдық энергиясы қайда «кетеді»?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","PhET «Скейт-парктегі энергия» (Energy Skate Park) симуляциясында топтар скейтбордшы қозғалысы кезіндегі кинетикалық, потенциалдық және толық энергия графигін салып, үйкеліс болмағанда және болғанда E қалай өзгеретінін анықтайды. Қосымша: карточкадағы F(s) графигі бойынша жұмысты аудан ретінде есептейді.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: үйкеліссіз E_к + E_п = const; күш жұмысы энергияның өзгерісіне тең; графикте жұмыс – F(s) астындағы аудан."],["ноутбуктер/планшеттер, PhET Energy Skate Park, F(s) графиктері бар карточкалар"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: A = Fs·cosα; E_к = mv²/2; E_п = mgh; E_к + E_п = const; A = ΔE.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"19":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Качели, струна гитары, поршень двигателя – всё это колеблется. Что у них общего?»","Задаёт три учебных вопроса:","- Что такое колебательное движение?","- Как измерить период колебаний?","- Где в природе и технике встречаются колебания?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","В симуляции PhET «Масса и пружины» (Masses & Springs) группы измеряют амплитуду, период и частоту (по 10 колебаний), наблюдают превращение кинетической и потенциальной энергии в графиках. Затем по предложенному графику x(t) определяют A, T, ω и записывают уравнение.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: T не зависит от амплитуды малых колебаний; энергия переходит из потенциальной в кинетическую и обратно."],["ноутбуки/планшеты, PhET Masses & Springs, секундомеры, графики x(t)"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: T = t/N; ν = 1/T; ω = 2πν; x = A·cos(ωt); полная энергия остаётся постоянной.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Әткеншек, гитара шегі, қозғалтқыш поршені – бәрі тербеледі. Олардың ортақ белгісі не?»","Үш оқу сұрағын қояды:","- Тербелмелі қозғалыс деген не?","- Тербеліс периодын қалай өлшейді?","- Табиғатта және техникада тербелістер қайда кездеседі?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","PhET «Массалар мен серіппелер» (Masses & Springs) симуляциясында топтар амплитуданы, периодты және жиілікті (10 тербеліс бойынша) өлшеп, графиктерден кинетикалық және потенциалдық энергияның түрленуін бақылайды. Содан кейін берілген x(t) графигі бойынша A, T, ω анықтап, теңдеуді жазады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: T шағын тербелістер амплитудасына тәуелсіз; энергия потенциалдықтан кинетикалыққа және кері өтеді."],["ноутбуктер/планшеттер, PhET Masses & Springs, секундомерлер, x(t) графиктері"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: T = t/N; ν = 1/T; ω = 2πν; x = A·cos(ωt); толық энергия тұрақты болып қалады.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпе
