дения?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Выполнение лабораторной работы / исследование**","(20 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Группы запускают шарик по желобу со стола (высота h), измеряют дальность l падения на лист копировальной бумаги, вычисляют время падения t = √(2h/g) и начальную скорость v₀ = l/t. Строят траекторию по точкам (или проверяют в симуляции PhET «Движение снаряда»).","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: время падения не зависит от v₀; по горизонтали движение равномерное, по вертикали – равноускоренное."],["желоб, шарик, копировальная бумага, линейка, PhET «Движение снаряда»"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: h = gt²/2; l = v₀t; v = √(v₀² + (gt)²); траектория – парабола.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(7 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Бір мезгілде бір добты тастап, екіншісін горизонталь лақтырамыз. Қайсысы бұрын түседі?»","Үш оқу сұрағын қояды:","- Еркін түсу кезінде денелердің үдеуі қандай?","- Горизонталь лақтыру қандай екі қозғалыстан құралады?","- Түсу уақыты неге тәуелді?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зертханалық жұмысты орындау / зерттеу**","(20 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Топтар шарикті үстел жиегінен науамен жібереді (биіктік h), көшірме қағазға түсу қашықтығын l өлшейді, түсу уақытын t = √(2h/g) және бастапқы жылдамдықты v₀ = l/t есептейді. Траекторияны нүктелер бойынша салады (немесе PhET «Снаряд қозғалысы» симуляциясында тексереді).","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: түсу уақыты v₀-ге тәуелсіз; горизонталь бойынша қозғалыс бірқалыпты, вертикаль бойынша – теңүдемелі."],["науа, шарик, көшірме қағаз, сызғыш, PhET «Снаряд қозғалысы»"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: h = gt²/2; l = v₀t; v = √(v₀² + (gt)²); траектория – парабола.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(7 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"5":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Точки на краю и у центра пластинки (или диска) вращаются с одним периодом. Одинаково ли они «быстро» движутся?»","Задаёт три учебных вопроса:","- Что такое период и частота вращения?","- Куда направлена скорость тела при движении по окружности?","- Почему при повороте автомобиля пассажира «заносит» в сторону?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Станции: вращающийся диск (или вертушка) с метками на разных расстояниях r от оси. Группы измеряют период по секундомеру (10 оборотов), вычисляют ω = 2π/T, v = ωr и a = v²/r для двух точек; сравнивают результаты.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: ω одинакова для всех точек, v растёт с радиусом; ускорение направлено к центру."],["вращающийся диск, секундомер, линейки, стикеры"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: T = 1/ν; ω = 2π/T; v = ωr; a_ц = v²/r = ω²r.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А. Напоминает о предстоящем СОР №1."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Пластинканың (немесе дискінің) шетіндегі және ортасындағы нүктелер бір периодпен айналады. Олар бірдей «жылдам» қозғала ма?»","Үш оқу сұрағын қояды:","- Айналу периоды мен жиілігі деген не?","- Шеңбер бойымен қозғалғанда жылдамдық қайда бағытталған?","- Көлік бұрылғанда жолаушыны неге бүйірге «лақтырады»?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Станциялар: оське дейінгі әртүрлі r қашықтықта белгілері бар айналатын диск (немесе үйірме). Топтар секундомермен периодты өлшейді (10 айналым), екі нүкте үшін ω = 2π/T, v = ωr және a = v²/r есептеп, нәтижелерді салыстырады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: ω барлық нүктелер үшін бірдей, v радиуспен өседі; үдеу центрге қарай бағытталған."],["айналатын диск, секундомер, сызғыштар, стикерлер"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: T = 1/ν; ω = 2π/T; v = ωr; a_ц = v²/r = ω²r.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді. Алдағы БЖБ №1 туралы еске салады."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"6":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Сириус кажется ярче Полярной звезды, хотя Полярная – сверхгигант. Почему так?»","Задаёт три учебных вопроса:","- Какие звёзды и созвездия вы знаете?","- Что такое созвездие?","- Почему звёзды «движутся» по небу за ночь?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Станции: 1) карточки звёзд с видимой величиной m и расстоянием – группа упорядочивает по видимой яркости и по светимости; 2) подвижная карта звёздного неба (или программа Stellarium) – находят Полярную звезду, созвездие Большая Медведица; 3) схема небесной сферы – подписывают полюс мира, зенит, небесный экватор, горизонт.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: видимая яркость зависит от светимости и расстояния; чем меньше m, тем ярче звезда."],["карточки звёзд, подвижная карта неба, Stellarium, схема небесной сферы"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Видимая звёздная величина m – блеск для земного наблюдателя; абсолютная M – блеск на расстоянии 10 пк; разница в 5 величин = 100 раз по блеску.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Сириус Темірқазық жұлдызынан жарық көрінеді, ал Темірқазық – алып жұлдыз. Неге олай?»","Үш оқу сұрағын қояды:","- Қандай жұлдыздар мен шоқжұлдыздарды білесіздер?","- Шоқжұлдыз деген не?","- Түн ішінде жұлдыздар неге аспанда «қозғалады»?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Станциялар: 1) көрінерлік шамасы m және қашықтығы көрсетілген жұлдыз карталары – топ жұлдыздарды көрінерлік жарықтығы және жарқырауы бойынша ретке келтіреді; 2) жұлдызды аспанның жылжымалы картасы (немесе Stellarium бағдарламасы) – Темірқазықты, Ұлы Аю шоқжұлдызын табады; 3) аспан сферасының сызбасы – әлем полюсін, зенитті, аспан экваторын, көкжиекті белгілейді.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: көрінерлік жарықтық жарқырауға және қашықтыққа тәуелді; m неғұрлым аз болса, жұлдыз соғұрлым жарық."],["жұлдыз карталары, аспанның жылжымалы картасы, Stellarium, аспан сферасының сызбасы"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Көрінерлік жұлдыздық шама m – жер бақылаушысы үшін жарықтық; абсолюттік M – 10 пк қашықтағы жарықтық; 5 шама айырмасы = жарықтықтағы 100 есе.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"7":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «В Астане 12:00, а в Нью-Йорке – ночь. Как договориться о времени звонка?»","Задаёт три учебных вопроса:","- Что такое горизонт, зенит, полюс мира?","- Почему Полярная звезда почти не меняет положение?","- Что такое часовой пояс?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Группы работают с подвижной картой неба и глобусом: находят высоту полюса мира над горизонтом для Павлодара (φ ≈ 52°), вычисляют высоту кульминации звезды h = 90° − φ + δ, затем по таблице часовых поясов сопоставляют местное, поясное и всемирное время для трёх городов.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: высота полюса мира равна широте места; время зависит от долготы."],["подвижная карта неба, глобус, таблица часовых поясов, Stellarium"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: h_полюса = φ; h = 90° − φ + δ; местное время отличается от всемирного на λ/15 ч.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Астанада сағат 12:00, ал Нью-Йоркте түн. Қоңырау уақытын қалай келісуге болады?»","Үш оқу сұрағын қояды:","- Көкжиек, зенит, әлем полюсі деген не?","- Темірқазық жұлдызы неге орнын дерлік өзгертпейді?","- Белдеулік уақыт деген не?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Топтар аспанның жылжымалы картасымен және глобуспен жұмыс істейді: Павлодар үшін (φ ≈ 52°) әлем полюсінің көкжиектен биіктігін табады, жұлдыздың шарықтау биіктігін h = 90° − φ + δ есептейді, содан кейін уақыт белдеулері кестесі бойынша үш қала үшін жергілікті, белдеулік және бүкіләлемдік уақытты сәйкестендіреді.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: әлем полюсінің биіктігі орынның ендігіне тең; уақыт бойлыққа тәуелді."],["аспанның жылжымалы картасы, глобус, уақыт белдеулері кестесі, Stellarium"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Әлем полюсінің биіктігі = φ; h = 90° − φ + δ; жергілікті уақыт бүкіләлемдіктен λ/15 сағатқа ерекшеленеді.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"8":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Вытяните руку и закройте один глаз, затем другой: палец «прыгает» на фоне стены. Как это помогает измерять расстояния до звёзд?»","Задаёт три учебных вопроса:","- Какую форму имеет орбита Земли?","- Когда Земля движется быстрее – зимой или летом?","- Что такое астрономическая единица?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Практикум 1: группы рисуют эллипс с помощью нити и двух кнопок (фокусы) и находят большую полуось. Практикум 2: по таблице данных (a, T) планет проверяют, что T²/a³ одинаково. Практикум 3: измеряют сдвиг пальца на фоне стены двумя глазами и по базе вычисляют расстояние (модель параллакса).","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: орбиты – эллипсы; T²/a³ одинаково для всех планет; параллакс обратно пропорционален расстоянию."],["нить, кнопки, картон, таблица данных планет, линейки"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: I закон – эллипс, Солнце в фокусе; II – равные площади за равные времена; III – T₁²/T₂² = a₁³/a₂³; d (пк) = 1/p (″).","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А. Напоминает о предстоящем СОР №2."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Қолыңызды созып, алдымен бір көзді, содан кейін екіншісін жұмыңыз: саусақ қабырға аясында «секіреді». Бұл жұлдыздарға дейінгі қашықтықты өлшеуге қалай көмектеседі?»","Үш оқу сұрағын қояды:","- Жердің орбитасы қандай пішінді?","- Жер қашан жылдам қозғалады – қыста ма, жазда ма?","- Астрономиялық бірлік деген не?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","1-практикум: топтар жіп пен екі түймешік (фокустар) көмегімен эллипс сызып, үлкен жарты өсін табады. 2-практикум: ғаламшарлардың (a, T) деректер кестесі бойынша T²/a³ қатынасының бірдей екенін тексереді. 3-практикум: қабырға аясында саусақтың екі көзбен ығысуын өлшеп, база бойынша қашықтықты есептейді (параллакс моделі).","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: орбиталар – эллипс; T²/a³ барлық ғаламшар үшін бірдей; параллакс қашықтыққа кері пропорционал."],["жіп, түймешіктер, картон, ғаламшарлар деректер кестесі, сызғыштар"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: I заң – эллипс, Күн фокуста; II – тең уақытта тең аудан; III – T₁²/T₂² = a₁³/a₂³; d (пк) = 1/p (″).","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді. Алдағы БЖБ №2 туралы еске салады."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"9":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Автобус резко тормозит – пассажиры наклоняются вперёд. Кто их «толкнул»?»","Задаёт три учебных вопроса:","- Что такое сила и в каких единицах она измеряется?","- Что происходит с телом, если на него не действуют силы?","- Почему монета падает в стакан, если резко выдернуть карточку?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Станции опытов: 1) монета на карточке над стаканом – резкий щелчок; 2) тележка с грузом и без груза на столе, резкий и плавный рывок нити; 3) шарик на столе в движущейся тележке (симуляция/видео). Группы фиксируют наблюдения и формулируют, при каких условиях скорость тела не меняется.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: при отсутствии внешних воздействий (или их компенсации) скорость тела не меняется; чем больше масса, тем сильнее инертность."],["карточки, монеты, стаканы, тележки, грузы, видеоролик"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Существуют системы отсчёта (инерциальные), в которых тело сохраняет покой или равномерное прямолинейное движение, если действия других тел скомпенсированы.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Автобус күрт тежеледі – жолаушылар алға қарай ауытқиды. Оларды кім «итерді»?»","Үш оқу сұрағын қояды:","- Күш деген не және ол қандай бірлікпен өлшенеді?","- Денеге күш әсер етпесе, дене қалай қозғалады?","- Карточканы күрт суырғанда теңге неге стақанға түседі?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Тәжірибе станциялары: 1) стақан үстіндегі карточкадағы теңге – күрт шертпе; 2) үстелдегі жүгі бар және жүгі жоқ арба, жіпті күрт және баяу тарту; 3) қозғалыстағы арбадағы шарик (симуляция/бейне). Топтар бақылауларды жазып, дене жылдамдығы қандай жағдайда өзгермейтінін тұжырымдайды.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: сыртқы әсер болмағанда (немесе олар теңестірілгенде) дене жылдамдығы өзгермейді; масса неғұрлым үлкен болса, инерттілік соғұрлым күшті."],["карточкалар, теңгелер, стақандар, арбалар, жүктер, бейнеролик"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Басқа денелердің әсері теңестірілсе, дене тыныштықта немесе түзусызықты бірқалыпты қозғалыста болатын санақ жүйелері (инерциялық) бар.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"10":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Почему гвоздь трудно вытащить из доски, а лыжи скользят легко? О каких силах идёт речь?»","Задаёт три учебных вопроса:","- Какие виды сил вы знаете?","- Что общего у силы упругости и силы трения?","- В чём отличие массы от силы тяжести?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Станции: 1) пружина и грузы – измеряют удлинение x при разных F и находят жёсткость k; 2) брусок на динамометре – определяют силу трения скольжения на разных поверхностях и при разной массе; 3) груз на динамометре – сравнивают mg и показание. Результаты фиксируют в таблице, строят график F(x).","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: F_упр пропорциональна удлинению; F_тр пропорциональна силе нормальной реакции; F_т пропорциональна массе."],["пружины, динамометры, бруски, набор грузов, линейки"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: F_т = mg; F_упр = kx (закон Гука); F_тр = μN.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Шегені тақтайдан неге қиын суырады, ал шаңғы неге оңай сырғиды? Бұл қандай күштер?»","Үш оқу сұрағын қояды:","- Қандай күш түрлерін білесіздер?","- Серпімділік күші мен үйкеліс күшінің ортақтығы неде?","- Массаның ауырлық күшінен айырмашылығы неде?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Станциялар: 1) серіппе мен жүктер – әртүрлі F кезінде ұзаруды x өлшеп, қатаңдықты k табады; 2) динамометрдегі білеуше – әртүрлі беттер мен массада сырғанау үйкеліс күшін анықтайды; 3) динамометрдегі жүк – mg пен көрсеткішті салыстырады. Нәтижені кестеге жазып, F(x) графигін салады.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: F_серп ұзаруға пропорционал; F_үйк нормаль реакция күшіне пропорционал; F_ауыр массаға пропорционал."],["серіппелер, динамометрлер, білеушелер, жүктер жиынтығы, сызғыштар"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: F_ауыр = mg; F_серп = kx (Гук заңы); F_үйк = μN.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"11":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Грузчики двигают рояль и несут скрипку. Одну и ту же силу прикладываем к лёгкому и тяжёлому предмету. Что изменится?»","Задаёт три учебных вопроса:","- Что такое инерция и чем измеряется инертность тела?","- Как, по-вашему, изменится ускорение, если силу увеличить вдвое?","- Почему гружёную тележку разогнать труднее, чем пустую?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Роли: экспериментатор (управляет симуляцией), регистратор, аналитик, спикер. Симуляция PhET «Силы и движение: основы» (трение отключено). Опыт 1: m = const, F = 50; 100; 150; 200 Н – измеряют a. Опыт 2: F = const, масса меняется – измеряют a. Вычисляют F/a и a·m. Педагог показывает первое измерение («Я делаю»).","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: a пропорционально F и обратно пропорционально m."],["ноутбуки/планшеты, PhET «Силы и движение: основы», карты-подсказки А/Б/В"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Ускорение тела прямо пропорционально равнодействующей сил и обратно пропорционально массе: a = ΣF/m; 1 Н = 1 кг·м/с²; направление a совпадает с направлением ΣF.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Жүк тасушылар роялді жылжытып, скрипканы көтеріп барады. Жеңіл және ауыр затқа бірдей күш түсіреміз. Не өзгереді?»","Үш оқу сұрағын қояды:","- Инерция деген не және дененің инерттілігі немен өлшенеді?","- Күшті екі есе арттырсақ, үдеу қалай өзгереді деп ойлайсыз?","- Жүк тиелген арбаны босқа қарағанда үдету неге қиын?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Рөлдер: тәжірибеші (симуляцияны басқарады), тіркеуші, талдаушы, спикер. PhET «Күштер мен қозғалыс: негіздер» симуляциясы (үйкеліс өшірілген). 1-тәжірибе: m = const, F = 50; 100; 150; 200 Н – a өлшейді. 2-тәжірибе: F = const, масса өзгереді – a өлшейді. F/a және a·m есептейді. Педагог бірінші өлшемді көрсетеді («Мен істеймін»).","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: a F-ке тура пропорционал және m-ге кері пропорционал."],["ноутбуктер/планшеттер, PhET «Күштер мен қозғалыс: негіздер», А/Б/В тірек карталары"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Дененің үдеуі тең әсерлі күшке тура пропорционал, массаға кері пропорционал: a = ΣF/m; 1 Н = 1 кг·м/с²; a бағыты ΣF бағытымен бағыттас.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қай
