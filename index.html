<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Физика 9: урок на доске</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@500&display=swap">
<style>
/* Concept: a classroom board. Teacher screen = board preview + notes; student screen = full-screen board with large type.
   Palette: chalk-paper neutral with blue-slate ink, one teal accent, amber/rose/violet for chart series, traffic colors for the светофор. */
:root{
  --bg:#F3F5F4; --panel:#FFFFFF; --card:#FFFFFF; --ink:#14232B; --ink2:#3C4F59; --ink3:#6B7C85; --line:#D5DDDB;
  --acc:#0B7C86; --acc-ink:#FFFFFF; --acc-soft:#D9EEF0;
  --c1:#0B7C86; --c2:#C97A00; --c3:#C2375B; --c4:#5A4FCF;
  --good:#2E9B57; --warn:#E3A008; --bad:#D6453D;
  --shadow:0 1px 2px rgba(20,35,43,.08),0 6px 18px rgba(20,35,43,.08);
  --f-d:'Montserrat','Noto Sans',system-ui,sans-serif; --f-b:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-m:'Noto Sans Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E181E; --panel:#15242C; --card:#1A2B34; --ink:#EAF1F2; --ink2:#B9C8CD; --ink3:#8599A1; --line:#2B3E48;
  --acc:#3CC4CF; --acc-ink:#07242A; --acc-soft:#17383E;
  --c1:#3CC4CF; --c2:#F0B24A; --c3:#F2708F; --c4:#9C93FF;
  --good:#4CC47A; --warn:#F2C14E; --bad:#F2706A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181E; --panel:#15242C; --card:#1A2B34; --ink:#EAF1F2; --ink2:#B9C8CD; --ink3:#8599A1; --line:#2B3E48;
  --acc:#3CC4CF; --acc-ink:#07242A; --acc-soft:#17383E;
  --c1:#3CC4CF; --c2:#F0B24A; --c3:#F2708F; --c4:#9C93FF;
  --good:#4CC47A; --warn:#F2C14E; --bad:#F2706A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-d);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font:600 10px var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.sel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:min(520px,100%);flex:1 1 260px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.ico{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.spacer{flex:1}
/* stage rail */
.rail{display:flex;gap:8px;padding:8px max(16px,env(safe-area-inset-left,0px));overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line)}
.step{flex:1 0 auto;min-width:130px;display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px}
.step b{font:700 13px var(--f-d)}
.step span{font-size:12px;color:var(--ink3)}
.step[aria-current=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.step[aria-current=true] span{color:inherit;opacity:.85}
.step.done{border-style:dashed}
/* main */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:14px;padding:14px max(16px,env(safe-area-inset-left,0px)) 86px}
.mode-board .main{grid-template-columns:minmax(0,1fr)}
.mode-board .notes{display:none}
.board,.notes{min-height:0;overflow:auto;border-radius:14px}
.board{background:var(--panel);border:1px solid var(--line);padding:20px 24px;--fs:clamp(15px,1.25vw,20px);font-size:var(--fs);position:relative}
.mode-board .board{--fs:clamp(20px,2.3vw,38px);padding:26px 34px}
.notes{background:var(--panel);border:1px solid var(--line);padding:16px 18px;font-size:14px}
@media(max-width:900px){.main{grid-template-columns:1fr;overflow:auto}.board,.notes{overflow:visible}}
/* board typography */
.board h1{font:800 1.9em/1.15 var(--f-d);margin:0 0 .4em;letter-spacing:-.02em;text-wrap:balance}
.board h2{font:700 1.1em var(--f-d);margin:0 0 .5em;color:var(--ink2)}
.kick{font:700 .62em var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:.4em;display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22em),1fr));gap:1em;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.8em 1em}
.hook{font:600 1.35em/1.35 var(--f-d);padding:.9em 1.1em;border-radius:14px;background:var(--acc-soft);border:1px solid var(--line);text-wrap:pretty}
.q{display:flex;gap:.7em;align-items:flex-start;padding:.55em 0;border-bottom:1px solid var(--line)}
.q i{font:800 1em var(--f-d);font-style:normal;flex:0 0 1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink)}
.goal{display:flex;gap:.7em;padding:.5em 0}
.goal:before{content:"";flex:0 0 .7em;height:.7em;margin-top:.5em;border-radius:50%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:.5em}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.25em .85em;font-weight:600}
.chip.acc{background:var(--acc-soft);border-color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:.45em .9em;font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.sm{font-size:13px;padding:.3em .7em}
.key{font:700 1.5em/1.35 var(--f-d);padding:.9em 1.1em;border-left:.35em solid var(--acc);background:var(--acc-soft);border-radius:0 12px 12px 0}
.key-f{font:700 1.3em var(--f-m);margin-top:.6em}
.lv{display:flex;gap:.5em;margin:.3em 0 .8em}
.lv button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.5em;font:800 1.1em var(--f-d)}
.lv button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.task{font-size:1.2em;line-height:1.5;padding:.9em 1.1em;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.reveal{margin-top:.7em;padding:.7em 1em;border-radius:10px;background:var(--card);border:1px dashed var(--ink3)}
.lights{display:flex;gap:1em;justify-content:center;margin:.8em 0}
.light{width:5.2em;height:5.2em;border-radius:50%;border:.25em solid var(--line);opacity:.4;transition:opacity .15s,transform .15s}
.light[aria-pressed=true]{opacity:1;transform:scale(1.1);border-color:var(--ink)}
.l-g{background:var(--good)}.l-y{background:var(--warn)}.l-r{background:var(--bad)}
table.dt{border-collapse:collapse;width:100%;font-size:.9em}
table.dt th,table.dt td{border:1px solid var(--line);padding:.35em .5em;text-align:center;min-width:3.2em}
table.dt th{background:var(--acc-soft);font-weight:700}
[contenteditable]{outline:none}[contenteditable]:focus{background:var(--acc-soft)}
.ph{color:var(--ink3)}
.meta{font-size:.62em;color:var(--ink3)}
/* notes */
.notes h3{font:700 12px var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin:16px 0 6px}
.notes h3:first-child{margin-top:0}
.notes ul{margin:0;padding-left:18px}.notes li{margin:3px 0}
.notes .tm{font:800 22px var(--f-d)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--acc-soft);color:var(--ink)}
.ans{font-family:var(--f-m);font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin:3px 0}
details.nt{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px;background:var(--card)}
details.nt summary{cursor:pointer;font-weight:700}
/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);z-index:40;max-width:calc(100% - 16px);overflow-x:auto}
.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:6px 8px;border:0;background:transparent;border-radius:10px;font-size:11px;font-weight:600;color:var(--ink2)}
.dock button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-pressed=true],.dock button:hover{background:var(--acc-soft);color:var(--ink)}
.timer{font:800 18px var(--f-d);font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);min-width:80px;text-align:center}
.timer.low{color:var(--bad)}
/* modal panels */
.panel{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:84px;width:min(520px,calc(100% - 24px));max-height:calc(100% - 150px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:45;padding:16px 18px}
.panel.wide{width:min(1100px,calc(100% - 24px));left:50%;right:auto;transform:translateX(-50%);height:calc(100% - 150px)}
.panel h2{font:800 18px var(--f-d);margin:0 0 10px;display:flex;justify-content:space-between;gap:10px}
.panel textarea{width:100%;min-height:90px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.pick{font:800 clamp(40px,8vw,84px)/1.1 var(--f-d);text-align:center;padding:.3em .1em;border-radius:14px;background:var(--acc-soft);min-height:1.4em;word-break:break-word}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.groups div{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card);font-weight:600}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tally div{border-radius:12px;padding:12px;text-align:center;color:#fff;font:800 38px var(--f-d)}
.tally .l-y{color:#222}
iframe.sim{width:100%;height:calc(100% - 100px);border:1px solid var(--line);border-radius:10px;background:#fff}
.simlist{display:grid;gap:8px}
.simlist a{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--card);font-weight:600}
.simlist a small{color:var(--ink3);font-weight:500;overflow-wrap:anywhere}
/* pen */
#pen{position:fixed;inset:0;z-index:35;touch-action:none;pointer-events:none}
#pen.on{pointer-events:auto;cursor:crosshair}
.pentools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 74px);z-index:46;display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center;max-width:calc(100% - 16px)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--line)}
.sw[aria-pressed=true]{border-color:var(--ink)}
/* viz */
.viz{display:grid;gap:.7em}
.vz-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20em),1fr));gap:1em;align-items:start}
.svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px}
.svg text{fill:var(--ink);font-family:var(--f-b);font-size:13px}
.svg .t2{fill:var(--ink2)}.svg .t3{fill:var(--ink3)}
.ax{stroke:var(--ink3);fill:none;stroke-width:1.3}.gr{stroke:var(--line);stroke-width:1;fill:none}
.s1{stroke:var(--c1);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.s2{stroke:var(--c2);fill:none;stroke-width:2.6;stroke-linecap:round}.s3{stroke:var(--c3);fill:none;stroke-width:2.6;stroke-linecap:round}.s4{stroke:var(--c4);fill:none;stroke-width:2.6;stroke-linecap:round}
.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}.fi{fill:var(--ink)}.fc{fill:var(--card)}.fl{fill:var(--line)}
.a1{fill:var(--c1);opacity:.2}.a2{fill:var(--c2);opacity:.22}.a3{fill:var(--c3);opacity:.2}
.dash{stroke-dasharray:6 5}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:.5em 1em}
.ctl label{display:grid;gap:2px;font-size:.78em;font-weight:600;color:var(--ink2)}
.ctl output{font:700 1em var(--f-m);color:var(--ink)}
.ctl input[type=range]{width:100%;accent-color:var(--acc);height:1.6em}
.out{display:flex;flex-wrap:wrap;gap:.5em}
.out span{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.25em .7em;font:600 .85em var(--f-m)}
.out b{color:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.25em .8em;font-weight:600;font-size:.8em}
.tabs button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.scroll-x{overflow-x:auto}
.coin{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.coin i{aspect-ratio:1;border-radius:50%;background:var(--c1)}.coin i.x{background:transparent;border:1px dashed var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<style>
.mode-board .panel{font-size:18px}.mode-board .bar{padding-top:6px;padding-bottom:6px}
.board .viz{font-size:15px}.mode-board .board .viz{font-size:20px}
.notes p{margin:3px 0}.board .tabs{margin:.3em 0}
.panel h3{font:700 12px var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin:12px 0 6px}
.mode-board .board{--fs:clamp(18px,1.9vw,32px)}
.ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.light{cursor:pointer}
.st2{display:grid;grid-template-columns:minmax(0,1fr);gap:1em}.st2 .card{font-size:.8em}.st2 .chip{font-size:.8em}
@media(min-width:1100px){.st2{grid-template-columns:minmax(0,.72fr) minmax(0,1.5fr)}}
.dock button.timer{flex-direction:row;font:800 19px var(--f-d);min-width:88px;align-self:center;color:var(--ink)}.tally div{cursor:pointer;user-select:none}
.simlist a{flex-wrap:wrap}
</style>
<div class="app" id="app"><div class="bar" id="bar"></div><div class="rail" id="rail"></div><div class="main"><div class="board" id="board"></div><div class="notes" id="notes"></div></div><div class="dock" id="dock"></div></div><canvas id="pen"></canvas>
<script>
/* ===== helpers ===== */
const D2R=Math.PI/180;
const fmt=(x,d=2)=>{const n=Number(x);if(!isFinite(n))return '–';return n.toFixed(d).replace('.',',')};
const sci=(x,d=1)=>{if(x===0)return '0';const e=Math.floor(Math.log10(Math.abs(x)));const m=x/Math.pow(10,e);return fmt(m,d)+'·10'+String(e).replace(/-/g,'⁻').replace(/\d/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c])};
const S=(w,h,inner)=>`<svg class="svg" viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`;
const mk=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
function arrow(x1,y1,x2,y2,cls,w){w=w||2.6;const a=Math.atan2(y2-y1,x2-x1),h=9+w;const p=[[x2,y2],[x2-h*Math.cos(a-.4),y2-h*Math.sin(a-.4)],[x2-h*Math.cos(a+.4),y2-h*Math.sin(a+.4)]].map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  return `<line x1="${x1}" y1="${y1}" x2="${x2-(h*.6)*Math.cos(a)}" y2="${y2-(h*.6)*Math.sin(a)}" class="${cls}" style="stroke-width:${w}"/><polygon points="${p}" class="${cls.replace('s','f')}"/>`}
function ctls(defs,cb){const root=mk('div','ctl'),v={};
  defs.forEach(d=>{v[d.k]=d.val;const lab=mk('label','',`<span>${d.n[LANG]}: <output></output> ${d.u||''}</span><input type="range" min="${d.min}" max="${d.max}" step="${d.step||1}" value="${d.val}">`);
    const inp=lab.querySelector('input'),out=lab.querySelector('output');const dec=d.dec!=null?d.dec:((String(d.step||1).split('.')[1]||'').length);
    const show=()=>{out.textContent=fmt(+inp.value,dec)};show();
    inp.addEventListener('input',()=>{v[d.k]=+inp.value;show();cb&&cb(v)});root.append(lab)});
  return {el:root,v}}
function loop(host,fn){let last=performance.now();const f=t=>{if(!host.isConnected)return;const dt=Math.max(0,Math.min(.05,(t-last)/1000));last=t;fn(dt,t/1000);requestAnimationFrame(f)};requestAnimationFrame(f)}
function tabs(items,cb,start){const r=mk('div','tabs');let cur=start||0;const bs=items.map((n,i)=>{const b=mk('button','',n[LANG]||n);b.setAttribute('aria-pressed',i===cur);b.onclick=()=>{cur=i;bs.forEach((x,j)=>x.setAttribute('aria-pressed',j===i));cb(i)};r.append(b);return b});return r}
const L2=(a,b)=>LANG===0?a:b;
const VIZ={};
const GRIDX=(x0,x1,y0,y1,n,m)=>{let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;s+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" class="gr"/>`}for(let j=0;j<=m;j++){const y=y0+(y1-y0)*j/m;s+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" class="gr"/>`}return s};
const nice=m=>{if(m<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(m))),f=m/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e};

/* ===== 1 vectors ===== */
VIZ.vec=host=>{const W=640,H=380,u=17,ox=320,oy=190;
  const sv=mk('div'),out=mk('div','out');
  const c=ctls([{k:'a',n:['|a|','|a|'],min:1,max:8,step:.5,val:5},{k:'pa',n:['угол a','a бұрышы'],min:0,max:360,step:5,val:30,u:'°'},{k:'b',n:['|b|','|b|'],min:1,max:8,step:.5,val:4},{k:'pb',n:['угол b','b бұрышы'],min:0,max:360,step:5,val:110,u:'°'}],draw);
  host.append(sv,c.el,out);
  function draw(){const v=c.v,ax=v.a*Math.cos(v.pa*D2R),ay=v.a*Math.sin(v.pa*D2R),bx=v.b*Math.cos(v.pb*D2R),by=v.b*Math.sin(v.pb*D2R),rx=ax+bx,ry=ay+by;
    const X=x=>ox+u*x,Y=y=>oy-u*y;
    let s=GRIDX(ox-18*u,ox+18*u,oy-11*u,oy+11*u,36,22).replace(/class="gr"/g,'class="gr" opacity=".6"');
    s+=`<line x1="10" y1="${oy}" x2="${W-10}" y2="${oy}" class="ax"/><line x1="${ox}" y1="8" x2="${ox}" y2="${H-8}" class="ax"/><text x="${W-22}" y="${oy-6}" class="t2">X</text><text x="${ox+6}" y="20" class="t2">Y</text>`;
    s+=`<line x1="${X(rx)}" y1="${Y(ry)}" x2="${X(rx)}" y2="${oy}" class="s3 dash" style="stroke-width:1.5"/><line x1="${X(rx)}" y1="${Y(ry)}" x2="${ox}" y2="${Y(ry)}" class="s3 dash" style="stroke-width:1.5"/>`;
    s+=arrow(X(0),Y(0),X(ax),Y(ay),'s1')+arrow(X(ax),Y(ay),X(rx),Y(ry),'s2')+arrow(X(0),Y(0),X(rx),Y(ry),'s3',3.4);
    s+=`<text x="${X(ax/2)-14}" y="${Y(ay/2)-8}" class="f1" style="font-weight:700">a</text><text x="${X(ax+bx/2)+6}" y="${Y(ay+by/2)-6}" class="f2" style="font-weight:700">b</text><text x="${X(rx/2)+8}" y="${Y(ry/2)+16}" class="f3" style="font-weight:700">a+b</text>`;
    s+=`<text x="${X(rx)+6}" y="${oy+16}" class="t2">Rx</text><text x="${ox+6}" y="${Y(ry)-5}" class="t2">Ry</text>`;
    sv.innerHTML=S(W,H,s);out.innerHTML=`<span>|a+b| = <b>${fmt(Math.hypot(rx,ry))}</b></span><span>Rx = <b>${fmt(rx)}</b></span><span>Ry = <b>${fmt(ry)}</b></span><span>a: (${fmt(ax,1)}; ${fmt(ay,1)})</span><span>b: (${fmt(bx,1)}; ${fmt(by,1)})</span>`}
  draw()};

/* ===== 2 v-t graph ===== */
VIZ.vt=host=>{const W=640,H=340,x0=56,x1=620,y0=20,y1=300;
  const sv=mk('div'),out=mk('div','out');
  const c=ctls([{k:'v0',n:['v₀','v₀'],min:0,max:20,step:1,val:4,u:L2('м/с','м/с')},{k:'a',n:['a','a'],min:-4,max:4,step:.5,val:2,u:'м/с²'},{k:'t',n:['t','t'],min:1,max:10,step:.5,val:6,u:'с'}],draw);
  host.append(sv,c.el,out);
  function draw(){const {v0,a,t}=c.v,v=v0+a*t;const vmax=Math.max(10,v0,v,0)*1.1,vmin=Math.min(0,v0,v)*1.2;
    const X=x=>x0+(x1-x0)*x/10,Y=y=>y1-(y1-y0)*(y-vmin)/(vmax-vmin);let s='';
    for(let i=0;i<=10;i++)s+=`<line x1="${X(i)}" y1="${y0}" x2="${X(i)}" y2="${y1}" class="gr"/><text x="${X(i)}" y="${y1+16}" text-anchor="middle" class="t3">${i}</text>`;
    const st=nice((vmax-vmin)/5);for(let k=Math.ceil(vmin/st);k*st<=vmax;k++){const y=Y(k*st);s+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" class="gr"/><text x="${x0-8}" y="${y+4}" text-anchor="end" class="t3">${k*st}</text>`}
    s+=`<line x1="${x0}" y1="${Y(0)}" x2="${x1}" y2="${Y(0)}" class="ax"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" class="ax"/><text x="${x1-8}" y="${Y(0)-6}" class="t2" text-anchor="end">t, ${L2('с','с')}</text><text x="${x0+6}" y="${y0+10}" class="t2">v, ${L2('м/с','м/с')}</text>`;
    s+=`<polygon points="${X(0)},${Y(0)} ${X(0)},${Y(v0)} ${X(t)},${Y(v)} ${X(t)},${Y(0)}" class="a1"/><polyline points="${X(0)},${Y(v0)} ${X(10)},${Y(v0+10*a)}" class="s1"/><line x1="${X(t)}" y1="${Y(0)}" x2="${X(t)}" y2="${Y(v)}" class="s2 dash" style="stroke-width:1.5"/><circle cx="${X(t)}" cy="${Y(v)}" r="6" class="f2"/>`;
    s+=`<text x="${X(t/2)}" y="${Y(Math.max(0,(v0+v)/4))}" text-anchor="middle" class="t2" style="font-weight:700">s</text>`;
    sv.innerHTML=S(W,H,s);out.innerHTML=`<span>v = v₀ + at = <b>${fmt(v,1)}</b></span><span>s = v₀t + at²/2 = <b>${fmt(v0*t+a*t*t/2,1)}</b></span><span>a = Δv/t = <b>${fmt(a,1)}</b></span>`}
  draw()};

/* ===== generic data lab: scene + table + fit graph ===== */
function datalab(host,cfg){const row=mk('div','vz-row'),left=mk('div'),right=mk('div');row.append(left,right);host.append(row);
  const sc=mk('div');left.append(sc);const upd=cfg.scene(sc);
  let tab=0;const rows=[];
  const c=ctls(cfg.sliders,()=>{});left.append(c.el);
  const bar=mk('div','tabs');const add=mk('button','',L2('Записать измерение','Өлшемді жазу')),clr=mk('button','',L2('Очистить','Тазалау'));bar.append(add,clr);
  const tbl=mk('div','scroll-x'),gr=mk('div'),out=mk('div','out');
  if(cfg.tabs){left.prepend(tabs(cfg.tabs,i=>{tab=i;rows.length=0;redraw();},0))}
  right.append(bar,tbl,gr,out);
  add.onclick=()=>{const [x,y]=cfg.sample(c.v,tab);const nz=1+(Math.random()-.5)*(cfg.noise||.06);rows.push({x:x,y:y*nz,v:{...c.v}});if(rows.length>8)rows.shift();redraw()};
  clr.onclick=()=>{rows.length=0;redraw()};
  function redraw(){const cols=cfg.cols(tab);tbl.innerHTML=`<table class="dt"><tr>${cols.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cfg.cells(r.v,r.x,r.y,tab).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="ph">${L2('нажмите «Записать измерение»','«Өлшемді жазу» батырмасын басыңыз')}</td></tr>`}</table>`;
    const W=420,H=300,x0=54,x1=400,y0=18,y1=258;const mx=Math.max(1e-9,...rows.map(r=>r.x))*1.15||1,my=Math.max(1e-9,...rows.map(r=>r.y))*1.15||1;const xm=rows.length?mx:1,ym=rows.length?my:1;
    const X=x=>x0+(x1-x0)*x/xm,Y=y=>y1-(y1-y0)*y/ym;let s=GRIDX(x0,x1,y0,y1,5,5)+`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" class="ax"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" class="ax"/>`;
    for(let i=0;i<=5;i+=1){s+=`<text x="${X(xm*i/5)}" y="${y1+16}" text-anchor="middle" class="t3">${fmt(xm*i/5,xm<5?2:0)}</text><text x="${x0-6}" y="${Y(ym*i/5)+4}" text-anchor="end" class="t3">${fmt(ym*i/5,ym<5?2:0)}</text>`}
    s+=`<text x="${x1}" y="${y1+34}" text-anchor="end" class="t2">${cfg.xl(tab)}</text><text x="${x0+4}" y="${y0-4}" class="t2">${cfg.yl(tab)}</text>`;
    let sl=null;if(rows.length>=2||rows.length===1){const sxy=rows.reduce((a,r)=>a+r.x*r.y,0),sxx=rows.reduce((a,r)=>a+r.x*r.x,0);sl=sxy/sxx;s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(xm)}" y2="${Y(Math.min(ym,sl*xm))}" class="s1 dash"/>`}
    rows.forEach(r=>{s+=`<circle cx="${X(r.x)}" cy="${Y(r.y)}" r="6" class="f2"/>`});
    gr.innerHTML=S(W,H,s);out.innerHTML=sl!=null?`<span>${cfg.fit(sl,tab)}</span>`:''}
  redraw();
  loop(host,(dt,t)=>upd(c.v,t,tab))}

/* ===== 3 incline ===== */
VIZ.incline=host=>{datalab(host,{
  sliders:[{k:'al',n:['угол α','α бұрышы'],min:5,max:40,step:1,val:20,u:'°'},{k:'s',n:['путь s','жол s'],min:.4,max:2,step:.1,val:1.2,u:L2('м','м')}],
  scene:sc=>{sc.innerHTML=S(560,270,`<path id="rmp" class="fl"/><line x1="20" y1="250" x2="540" y2="250" class="ax"/><line id="fin" class="s3" style="stroke-width:3"/><circle id="ball" r="11" class="f2"/><text id="inf" x="24" y="24" class="t2"></text>`);
    const L=330,sx=500,sy=250;let ph=0;return (v,t)=>{const al=v.al*D2R,a=5/7*9.81*Math.sin(al),tt=Math.sqrt(2*v.s/a),per=tt+1.2,tm=t%per;const d=Math.min(v.s,.5*a*Math.min(tm,tt)**2);
      const Tx=sx-L*Math.cos(al),Ty=sy-L*Math.sin(al),k=L/2.3,dx=Math.cos(al),dy=Math.sin(al),nx=Math.sin(al),ny=-Math.cos(al);
      sc.querySelector('#rmp').setAttribute('d',`M${Tx},${Ty} L${sx},${sy} L${Tx},${sy} Z`);
      const px=Tx+dx*d*k+nx*11,py=Ty+dy*d*k+ny*11;const b=sc.querySelector('#ball');b.setAttribute('cx',px);b.setAttribute('cy',py);
      const fx=Tx+dx*v.s*k,fy=Ty+dy*v.s*k,f=sc.querySelector('#fin');f.setAttribute('x1',fx);f.setAttribute('y1',fy);f.setAttribute('x2',fx+nx*26);f.setAttribute('y2',fy+ny*26);
      sc.querySelector('#inf').textContent=`a ≈ ${fmt(a)} ${L2('м/с²','м/с²')}  ·  t ≈ ${fmt(tt)} ${L2('с','с')}`}},
  sample:v=>{const a=5/7*9.81*Math.sin(v.al*D2R),t=Math.sqrt(2*v.s/a);return [t*t,v.s]},
  cols:()=>['s, '+L2('м','м'),'t, '+L2('с','с'),'t², '+L2('с²','с²'),'a = 2s/t²'],
  cells:(v,x,y)=>{const s=y,t2=x,t=Math.sqrt(x);return [fmt(s,2),fmt(t,2),fmt(t2,2),fmt(2*s/t2,2)]},
  xl:()=>'t², '+L2('с²','с²'),yl:()=>'s, '+L2('м','м'),fit:sl=>`a = 2·${L2('наклон','көлбеу')} = <b>${fmt(2*sl)}</b> ${L2('м/с²','м/с²')}`,noise:.08})};

/* ===== 10 Hooke ===== */
VIZ.hooke=host=>{datalab(host,{
  sliders:[{k:'m',n:['масса груза','жүк массасы'],min:.1,max:1,step:.1,val:.4,u:L2('кг','кг')}],
  scene:sc=>{sc.innerHTML=S(560,300,`<line x1="200" y1="14" x2="360" y2="14" class="ax" style="stroke-width:5"/><polyline id="spr" class="s1"/><rect id="blk" x="250" width="60" height="38" rx="5" class="f2"/><text id="inf" x="380" y="40" class="t2"></text><line x1="170" y1="52" x2="170" y2="52" id="ruler" class="s3"/><text x="40" y="52" class="t3">x</text>`);
    return v=>{const k=40,F=v.m*9.81,x=F/k,len=46+x*300;let pts='280,14';const n=12,top=14,bot=top+len;for(let i=1;i<=n;i++){pts+=` ${i%2?262:298},${top+(bot-top)*i/(n+1)}`}pts+=` 280,${bot}`;
      sc.querySelector('#spr').setAttribute('points',pts);const b=sc.querySelector('#blk');b.setAttribute('y',bot);const r=sc.querySelector('#ruler');r.setAttribute('x1',170);r.setAttribute('x2',170);r.setAttribute('y1',14+46);r.setAttribute('y2',bot);
      sc.querySelector('#inf').textContent=`F = mg = ${fmt(F)} ${L2('Н','Н')}  ·  x = ${fmt(x*100,1)} ${L2('см','см')}`}},
  sample:v=>{const F=v.m*9.81;return [F/40,F]},
  cols:()=>['F, '+L2('Н','Н'),'x, '+L2('см','см'),'k = F/x'],
  cells:(v,x,y)=>[fmt(y,2),fmt(x*100,1),fmt(y/x,0)],
  xl:()=>'x, '+L2('м','м'),yl:()=>'F, '+L2('Н','Н'),fit:sl=>`k = <b>${fmt(sl,0)}</b> ${L2('Н/м','Н/м')}`,noise:.06})};

/* ===== 11 Newton II ===== */
VIZ.newton2=host=>{datalab(host,{
  tabs:[['Опыт 1: m = const','1-тәжірибе: m = const'],['Опыт 2: F = const','2-тәжірибе: F = const']],
  sliders:[{k:'F',n:['сила F','күш F'],min:50,max:300,step:50,val:100,u:L2('Н','Н')},{k:'m',n:['масса m','масса m'],min:10,max:100,step:10,val:50,u:L2('кг','кг')}],
  scene:sc=>{sc.innerHTML=S(560,230,`<line x1="10" y1="170" x2="550" y2="170" class="ax"/><rect id="blk" y="110" height="60" rx="6" class="f2"/><g id="fa"></g><text id="inf" x="20" y="28" class="t2"></text><text id="lbl" y="148" text-anchor="middle" style="font-weight:700" fill="#000">m</text>`);
    return (v,t)=>{const a=v.F/v.m,w=40+v.m*.7,per=Math.sqrt(2*420/(a*14))+.8,tm=t%per,x=20+.5*a*14*Math.min(tm,per-.8)**2;
      const b=sc.querySelector('#blk');b.setAttribute('x',x);b.setAttribute('width',w);sc.querySelector('#lbl').setAttribute('x',x+w/2);sc.querySelector('#lbl').textContent=v.m+' '+L2('кг','кг');
      sc.querySelector('#fa').innerHTML=arrow(x-v.F*.3-4,140,x-4,140,'s3',3);
      sc.querySelector('#inf').textContent=`F = ${v.F} ${L2('Н','Н')}, m = ${v.m} ${L2('кг','кг')} → a = F/m = ${fmt(a)} ${L2('м/с²','м/с²')}`}},
  sample:(v,tab)=>tab===0?[v.F,v.F/v.m]:[1/v.m,v.F/v.m],
  cols:tab=>tab===0?['F, '+L2('Н','Н'),'a, '+L2('м/с²','м/с²'),'F/a, '+L2('кг','кг')]:['m, '+L2('кг','кг'),'a, '+L2('м/с²','м/с²'),'a·m, '+L2('Н','Н')],
  cells:(v,x,y,tab)=>tab===0?[fmt(v.F,0),fmt(y,2),fmt(v.F/y,0)]:[fmt(v.m,0),fmt(y,2),fmt(y*v.m,0)],
  xl:tab=>tab===0?'F, '+L2('Н','Н'):'1/m, '+L2('кг⁻¹','кг⁻¹'),yl:()=>'a, '+L2('м/с²','м/с²'),
  fit:(sl,tab)=>tab===0?`a ~ F: ${L2('наклон','көлбеу')} = 1/m ≈ <b>${fmt(sl,3)}</b> → m ≈ ${fmt(1/sl,0)} ${L2('кг','кг')}`:`a ~ 1/m: ${L2('наклон','көлбеу')} = F ≈ <b>${fmt(sl,0)}</b> ${L2('Н','Н')}`,noise:.05})};

/* ===== 21 pendulum lab ===== */
VIZ.pendlab=host=>{datalab(host,{
  sliders:[{k:'l',n:['длина l','ұзындық l'],min:.3,max:1.2,step:.1,val:.6,u:L2('м','м')}],
  scene:sc=>{sc.innerHTML=S(560,300,`<line x1="200" y1="12" x2="360" y2="12" class="ax" style="stroke-width:5"/><line id="th" x1="280" y1="12" class="s1"/><circle id="bob" r="16" class="f2"/><text id="inf" x="380" y="40" class="t2"></text><path id="arc" class="gr"/>`);
    return (v,t)=>{const T=2*Math.PI*Math.sqrt(v.l/9.81),th=.2*Math.cos(2*Math.PI*t/T),L=v.l*220,x=280+L*Math.sin(th),y=12+L*Math.cos(th);const l=sc.querySelector('#th');l.setAttribute('x2',x);l.setAttribute('y2',y);const b=sc.querySelector('#bob');b.setAttribute('cx',x);b.setAttribute('cy',y);sc.querySelector('#inf').textContent=`T ≈ ${fmt(T)} ${L2('с','с')}`}},
  sample:v=>[v.l,4*Math.PI*Math.PI*v.l/9.81],
  cols:()=>['l, '+L2('м','м'),'t₂₀, '+L2('с','с'),'T, '+L2('с','с'),'T², '+L2('с²','с²'),'g'],
  cells:(v,x,y)=>{const T=Math.sqrt(y);return [fmt(v.l,1),fmt(20*T,1),fmt(T,2),fmt(y,2),fmt(4*Math.PI*Math.PI*v.l/y,2)]},
  xl:()=>'l, '+L2('м','м'),yl:()=>'T², '+L2('с²','с²'),fit:sl=>`g = 4π²/${L2('наклон','көлбеу')} = <b>${fmt(4*Math.PI*Math.PI/sl)}</b> ${L2('м/с²','м/с²')}`,noise:.06})};

/* ===== 4/15 projectile ===== */
VIZ.proj=(host,mode)=>{const W=640,H=340,x0=46,x1=620,y0=16,y1=300;const sv=mk('div'),out=mk('div','out');
  const defs=mode==='h'?[{k:'v0',n:['v₀','v₀'],min:2,max:30,step:1,val:10,u:L2('м/с','м/с')},{k:'h',n:['высота h','биіктік h'],min:5,max:60,step:5,val:45,u:L2('м','м')}]:[{k:'v0',n:['v₀','v₀'],min:5,max:40,step:1,val:25,u:L2('м/с','м/с')},{k:'ang',n:['угол','бұрыш'],min:10,max:90,step:5,val:45,u:'°'},{k:'h',n:['высота h','биіктік h'],min:0,max:30,step:5,val:0,u:L2('м','м')}];
  const c=ctls(defs,()=>{});host.append(sv,c.el,out);const g=10;
  sv.innerHTML=S(W,H,'<g id="st"></g><circle id="b1" r="9" class="f2"/><circle id="b2" r="8" class="f3"/>');const st=sv.querySelector('#st'),b1=sv.querySelector('#b1'),b2=sv.querySelector('#b2');let key='';
  function calc(){const v=c.v,an=(mode==='h'?0:v.ang)*D2R,vx=v.v0*Math.cos(an),vy=v.v0*Math.sin(an),h=v.h,tf=(vy+Math.sqrt(vy*vy+2*g*h))/g;return {vx,vy,h,tf,R:vx*tf,Hm:h+vy*vy/(2*g),vi:Math.hypot(vx,vy-g*tf)}}
  function draw(r){const wx=Math.max(10,r.R*1.1),wy=Math.max(10,r.Hm*1.15),k=Math.min((x1-x0)/wx,(y1-y0)/wy),X=x=>x0+k*x,Y=y=>y1-k*y;let s=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" class="ax"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" class="ax"/>`;
    const sx=nice(wx/6),sy=nice(wy/5);for(let x=0;x<=wx;x+=sx)s+=`<line x1="${X(x)}" y1="${y0}" x2="${X(x)}" y2="${y1}" class="gr"/><text x="${X(x)}" y="${y1+16}" text-anchor="middle" class="t3">${x}</text>`;for(let y=0;y<=wy;y+=sy)s+=`<line x1="${x0}" y1="${Y(y)}" x2="${x1}" y2="${Y(y)}" class="gr"/><text x="${x0-6}" y="${Y(y)+4}" text-anchor="end" class="t3">${y}</text>`;
    let pts='';for(let i=0;i<=60;i++){const t=r.tf*i/60;pts+=`${X(r.vx*t).toFixed(1)},${Y(r.h+r.vy*t-g*t*t/2).toFixed(1)} `}s+=`<polyline points="${pts}" class="s1"/>`;
    for(let t=0.5;t<r.tf;t+=.5){const px=X(r.vx*t),py=Y(r.h+r.vy*t-g*t*t/2);s+=`<circle cx="${px}" cy="${py}" r="3.5" class="fi"/>`;if(mode==='h'){const qy=Y(r.h-g*t*t/2);s+=`<circle cx="${X(0)}" cy="${qy}" r="3.5" class="f3"/><line x1="${X(0)}" y1="${qy}" x2="${px}" y2="${py}" class="gr dash"/>`}}
    s+=`<text x="${x1}" y="${y1+34}" text-anchor="end" class="t2">x, ${L2('м','м')}</text><text x="${x0+4}" y="${y0-2}" class="t2">y, ${L2('м','м')}</text>`;st.innerHTML=s;return {X,Y}}
  loop(host,(dt,t)=>{const r=calc(),kk=JSON.stringify(c.v);let sc;if(kk!==key){key=kk;sc=draw(r);host._sc=sc}sc=host._sc;const tm=t%(r.tf+1),tt=Math.min(tm,r.tf);b1.setAttribute('cx',sc.X(r.vx*tt));b1.setAttribute('cy',sc.Y(r.h+r.vy*tt-g*tt*tt/2));if(mode==='h'){b2.style.display='';b2.setAttribute('cx',sc.X(0));b2.setAttribute('cy',sc.Y(r.h-g*tt*tt/2))}else b2.style.display='none';
    out.innerHTML=`<span>t = <b>${fmt(r.tf)}</b> ${L2('с','с')}</span><span>l = <b>${fmt(r.R,1)}</b> ${L2('м','м')}</span><span>h<sub>max</sub> = <b>${fmt(r.Hm,1)}</b> ${L2('м','м')}</span><span>v<sub>${L2('падения','түсу')}</sub> = <b>${fmt(r.vi,1)}</b> ${L2('м/с','м/с')}</span>`+(mode==='h'?`<span>${L2('красный шар падает вертикально: высота та же','қызыл шар тік түседі: биіктік сол')}</span>`:'')});};

/* ===== 5 circular ===== */
VIZ.circ=host=>{const W=560,H=340,cx=200,cy=170,sv=mk('div'),out=mk('div','out');
  const c=ctls([{k:'r',n:['радиус r','радиус r'],min:1,max:5,step:.5,val:3,u:L2('м','м')},{k:'T',n:['период T','период T'],min:1,max:10,step:.5,val:4,u:L2('с','с')}],()=>{});host.append(sv,c.el,out);
  sv.innerHTML=S(W,H,`<circle id="orb" cx="${cx}" cy="${cy}" class="s4 dash" style="stroke-width:1.6;fill:none"/><circle cx="${cx}" cy="${cy}" r="4" class="fi"/><g id="g"></g><text x="360" y="60" class="t2">v = ωr</text><text x="360" y="90" class="t2">a<tspan dy="4" font-size="10">ц</tspan><tspan dy="-4"> = v²/r</tspan></text>`);
  const g=sv.querySelector('#g'),orb=sv.querySelector('#orb');
  loop(host,(dt,t)=>{const R=c.v.r*30,w=2*Math.PI/c.v.T,v=w*c.v.r,ac=w*w*c.v.r,ph=w*t;orb.setAttribute('r',R);const x=cx+R*Math.cos(ph),y=cy-R*Math.sin(ph);
    const vs=Math.min(70,v*10+14),as=Math.min(80,ac*4+14);g.innerHTML=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="gr"/>`+arrow(x,y,x-vs*Math.sin(ph),y-vs*Math.cos(ph),'s1',3)+arrow(x,y,x-as*Math.cos(ph),y+as*Math.sin(ph),'s3',3)+`<circle cx="${x}" cy="${y}" r="9" class="f2"/>`;
    out.innerHTML=`<span>ω = 2π/T = <b>${fmt(w)}</b> ${L2('рад/с','рад/с')}</span><span>v = <b>${fmt(v)}</b> ${L2('м/с','м/с')}</span><span>a<sub>ц</sub> = <b>${fmt(ac)}</b> ${L2('м/с²','м/с²')}</span><span>ν = <b>${fmt(1/c.v.T)}</b> ${L2('Гц','Гц')}</span><span style="color:var(--c1)">${L2('синяя – скорость v','көк – жылдамдық v')}</span><span style="color:var(--c3)">${L2('красная – ускорение a','қызыл – үдеу a')}</span>`})};

/* ===== 6 magnitudes ===== */
VIZ.mag=host=>{const sv=mk('div'),out=mk('div','out');const c=ctls([{k:'m1',n:['звезда A: m','A жұлдызы: m'],min:-2,max:10,step:.5,val:-1.5},{k:'m2',n:['звезда B: m','B жұлдызы: m'],min:-2,max:10,step:.5,val:2}],draw);
  const stars=[['Сириус','Сириус',-1.46],['Вега','Вега',0.03],['Полярная','Темірқазық',1.98],['Бетельгейзе','Бетельгейзе',0.5],['Проксима Центавра','Проксима Центавра',11.1]];
  const tb=mk('div','scroll-x',`<table class="dt"><tr><th>${L2('Звезда','Жұлдыз')}</th><th>m</th></tr>${stars.map(s=>`<tr><td>${s[LANG]}</td><td>${fmt(s[2],2)}</td></tr>`).join('')}</table>`);
  host.append(sv,c.el,out,tb);
  function draw(){const v=c.v,ratio=Math.pow(10,.4*(v.m2-v.m1)),rad=m=>Math.max(5,26*Math.pow(10,-.08*m));
    sv.innerHTML=S(560,170,`<circle cx="150" cy="85" r="${rad(v.m1)}" class="f2"/><circle cx="410" cy="85" r="${rad(v.m2)}" class="f1"/><text x="150" y="160" text-anchor="middle">A  (m = ${fmt(v.m1,1)})</text><text x="410" y="160" text-anchor="middle">B  (m = ${fmt(v.m2,1)})</text><text x="280" y="90" text-anchor="middle" class="t2" style="font-size:16px">${v.m1<v.m2?L2('A ярче в','A жарығырақ'):v.m1>v.m2?L2('B ярче в','B жарығырақ'):'='} ${v.m1===v.m2?'':fmt(Math.max(ratio,1/ratio),1)+(LANG===0?' раз':' есе')}</text>`);
    out.innerHTML=`<span>${L2('1 звёздная величина ≈','1 жұлдыздық шама ≈')} <b>2,5</b> ${L2('раза','есе')}</span><span>${L2('5 величин','5 шама')} = <b>100</b> ${L2('раз','есе')}</span><span>I<sub>B</sub>/I<sub>A</sub> = 10<sup>0,4(m<sub>A</sub>−m<sub>B</sub>)</sup> = <b>${fmt(Math.pow(10,.4*(v.m1-v.m2)),3)}</b></span>`}
  draw()};

/* ===== 6/7 celestial sphere ===== */
VIZ.sphere=(host,tz)=>{const W=560,H=360,cx=280,cy=210,R=140,sv=mk('div'),out=mk('div','out');
  const c=ctls([{k:'phi',n:['широта φ','ендік φ'],min:0,max:90,step:1,val:52,u:'°'},{k:'dl',n:['склонение δ','δ ауытқуы'],min:-60,max:90,step:1,val:20,u:'°'}],draw);host.append(sv,c.el,out);
  let tzb;if(tz){tzb=mk('div');const c2=ctls([{k:'lon',n:['долгота λ (в.д.)','бойлық λ (ш.б.)'],min:0,max:180,step:5,val:77,u:'°'},{k:'utc',n:['всемирное время UTC','бүкіләлемдік уақыт UTC'],min:0,max:23,step:1,val:12,u:L2('ч','сағ')}],drawT);tzb.append(c2.el,mk('div','out'));host.append(tzb);window._c2=c2;drawT()}
  function drawT(){const c2=window._c2,v=c2.v,loc=(v.utc+v.lon/15),h=Math.floor(loc%24),m=Math.round((loc%1)*60);const z=Math.round(v.lon/15);tzb.querySelector('.out').innerHTML=`<span>${L2('местное время','жергілікті уақыт')} = UTC + λ/15 = <b>${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}</b></span><span>${L2('поясное','белдеулік')} (UTC+${z}) = <b>${String((v.utc+z)%24).padStart(2,'0')}:00</b></span>`}
  function draw(){const v=c.v,P=v.phi*D2R,th=(90+v.phi-v.dl)*D2R;let s=`<circle cx="${cx}" cy="${cy}" r="${R}" class="gr" style="stroke:var(--ink3)"/>`;
    s+=`<line x1="${cx-R-30}" y1="${cy}" x2="${cx+R+30}" y2="${cy}" class="ax"/><text x="${cx-R-28}" y="${cy+16}" class="t3">${L2('Ю','О')}</text><text x="${cx+R+8}" y="${cy+16}" class="t3">${L2('С','С')}</text><text x="${cx+4}" y="${cy-R-8}" class="t2">${L2('зенит','зенит')}</text>`;
    s+=`<line x1="${cx}" y1="${cy+R*0}" x2="${cx}" y2="${cy-R-4}" class="gr dash"/>`;
    const pxp=cx+R*1.15*Math.cos(P),pyp=cy-R*1.15*Math.sin(P);s+=`<line x1="${cx-pxp+cx}" y1="${cy*2-pyp}" x2="${pxp}" y2="${pyp}" class="s4 dash" style="stroke-width:1.6"/>`+arrow(cx,cy,pxp,pyp,'s4',2.4)+`<text x="${pxp+6}" y="${pyp-4}" class="f4" style="font-weight:700">${L2('полюс мира','әлем полюсі')}</text>`;
    const ex=Math.cos((90+v.phi)*D2R),ey=Math.sin((90+v.phi)*D2R);s+=`<line x1="${cx-ex*R*1.15}" y1="${cy+ey*R*1.15}" x2="${cx+ex*R*1.15}" y2="${cy-ey*R*1.15}" class="s2" style="stroke-width:1.6"/><text x="${cx+ex*R*1.15-4}" y="${cy-ey*R*1.15-8}" class="f2" style="font-weight:700">${L2('экватор','экватор')}</text>`;
    const sx=cx+R*Math.cos(th),sy=cy-R*Math.sin(th);s+=`<line x1="${cx}" y1="${cy}" x2="${sx}" y2="${sy}" class="s3"/><circle cx="${sx}" cy="${sy}" r="8" class="f3"/>`;
    const h=90-v.phi+v.dl;const a0=Math.PI,a1=Math.PI-h*D2R;s+=`<path d="M${cx-60},${cy} A60,60 0 0 ${h>0?1:0} ${cx-60*Math.cos(h*D2R)},${cy-60*Math.sin(h*D2R)}" class="s3" style="stroke-width:1.6"/><text x="${cx-100}" y="${cy-18}" class="f3" style="font-weight:700">h = ${fmt(h,0)}°</text>`;
    s+=`<text x="12" y="22" class="t2">${L2('Меридиональное сечение небесной сферы','Аспан сферасының меридиандық қимасы')}</text><text x="${cx+R+34}" y="${cy-12}" text-anchor="end" class="t3">${L2('горизонт','көкжиек')}</text>`;
    sv.innerHTML=S(W,H,s);out.innerHTML=`<span>${L2('высота полюса мира','әлем полюсінің биіктігі')} = φ = <b>${v.phi}°</b></span><span>h = 90° − φ + δ = <b>${fmt(h,0)}°</b></span>`}
  draw()};

/* ===== 8 Kepler + parallax ===== */
VIZ.kepler=host=>{const W=560,H=340,cx=280,cy=170,sv=mk('div'),out=mk('div','out');
  const c=ctls([{k:'a',n:['большая полуось a','үлкен жарты ось a'],min:.5,max:4,step:.1,val:1.5,u:L2('а.е.','а.б.')},{k:'e',n:['эксцентриситет e','эксцентриситет e'],min:0,max:.8,step:.05,val:.5}],()=>{});
  const par=mk('div'),c2=ctls([{k:'p',n:['параллакс p','параллакс p'],min:.05,max:1,step:.05,val:.25,u:'″'}],dp);host.append(sv,c.el,out,mk('h2','',L2('Метод параллакса','Параллакс әдісі')),par,c2.el,mk('div','out'));
  sv.innerHTML=S(W,H,'<g id="g"></g>');const g=sv.querySelector('#g');let M=0;
  loop(host,(dt)=>{const {a,e}=c.v,T=Math.pow(a,1.5),k=Math.min(240/(a*(1+e)),70);M+=2*Math.PI/T*dt*1.2;let E=M;for(let i=0;i<6;i++)E=M+e*Math.sin(E);const x=a*(Math.cos(E)-e),y=a*Math.sqrt(1-e*e)*Math.sin(E);
    const sx=cx+k*0,pts=[];for(let i=0;i<=80;i++){const q=2*Math.PI*i/80;pts.push((cx+k*(a*(Math.cos(q)-e))).toFixed(1)+','+(cy-k*a*Math.sqrt(1-e*e)*Math.sin(q)).toFixed(1))}
    g.innerHTML=`<polyline points="${pts.join(' ')}" class="s4" style="stroke-width:1.6"/><circle cx="${cx}" cy="${cy}" r="12" class="f2"/><circle cx="${cx+k*x}" cy="${cy-k*y}" r="8" class="f1"/><text x="16" y="24" class="t2">${L2('I закон: Солнце в фокусе эллипса','I заң: Күн эллипс фокусында')}</text><text x="16" y="44" class="t3">${L2('Планета быстрее вблизи Солнца (II закон)','Планета Күнге жақын жерде жылдамырақ (II заң)')}</text>`;
    out.innerHTML=`<span>T² = a³ → T = <b>${fmt(T,2)}</b> ${L2('лет','жыл')}</span><span>r<sub>min</sub> = <b>${fmt(a*(1-e))}</b></span><span>r<sub>max</sub> = <b>${fmt(a*(1+e))}</b> ${L2('а.е.','а.б.')}</span>`});
  function dp(){const p=c2.v.p,d=1/p;par.innerHTML=S(560,200,`<circle cx="120" cy="150" r="46" class="s4 dash" style="stroke-width:1.2"/><circle cx="120" cy="150" r="10" class="f2"/><circle cx="74" cy="150" r="5" class="f1"/><circle cx="166" cy="150" r="5" class="f1"/><line x1="74" y1="150" x2="500" y2="40" class="gr"/><line x1="166" y1="150" x2="500" y2="40" class="gr"/><circle cx="500" cy="40" r="8" class="f3"/><text x="500" y="26" text-anchor="middle" class="t2">${L2('звезда','жұлдыз')}</text><text x="120" y="205" text-anchor="middle" class="t3">${L2('орбита Земли, 1 а.е.','Жер орбитасы, 1 а.б.')}</text><text x="250" y="130" class="t2">p</text>`);c2.el.parentElement.querySelectorAll('.out')[1].innerHTML=`<span>d = 1/p = <b>${fmt(d,1)}</b> ${L2('пк','пк')}</span><span>≈ <b>${fmt(d*3.26,1)}</b> ${L2('св. лет','жарық жылы')}</span>`}
  dp()};

/* ===== 9 inertia ===== */
VIZ.inertia=host=>{const sv=mk('div'),bar=mk('div','tabs'),out=mk('div','out');let mode=0,t0=0;
  const names=[['Резкий рывок','Күрт тарту'],['Резкое торможение','Күрт тежеу'],['Равномерно','Бірқалыпты']];
  host.append(sv,bar,out);names.forEach((n,i)=>{const b=mk('button','',n[LANG]);b.setAttribute('aria-pressed',i===0);b.onclick=()=>{mode=i;t0=performance.now()/1000;[...bar.children].forEach((x,j)=>x.setAttribute('aria-pressed',j===i))};bar.append(b)});
  sv.innerHTML=S(560,220,`<line x1="10" y1="190" x2="550" y2="190" class="ax"/><g id="cart"><rect x="0" y="140" width="130" height="34" rx="5" class="f4"/><circle cx="24" cy="180" r="10" class="fi"/><circle cx="106" cy="180" r="10" class="fi"/><g id="blk"><rect x="45" y="84" width="40" height="56" rx="4" class="f2"/></g></g><g id="f"></g>`);
  const cart=sv.querySelector('#cart'),blk=sv.querySelector('#blk'),f=sv.querySelector('#f');
  loop(host,(dt,tt)=>{const t=Math.min(1.6,tt-t0);let x=40,lag=0,arrowS='',txt='';
    if(mode===0){const a=Math.min(1,t/.5);x=40+Math.min(1,t/1.4)*200*Math.min(1,t/.5+0);lag=-28*Math.sin(Math.min(1,t/.6)*Math.PI)*(t<1.2?1:0);txt=L2('Тележка резко уехала вперёд, брусок по инерции остался на месте (отстал назад).','Арба алға күрт жылжыды, білеуше инерциямен орнында қалды (артқа қалды).');arrowS=arrow(20,120,20+60,120,'s3',4)}
    else if(mode===1){x=240+Math.min(1,t/.7)*60;lag=30*Math.sin(Math.min(1,t/.7)*Math.PI)*(t<1.2?1:0);txt=L2('Тележка резко остановилась, брусок по инерции продолжает движение вперёд.','Арба күрт тоқтады, білеуше инерциямен алға қозғалысын жалғастырады.');arrowS=arrow(250,120,250-50,120,'s3',4)}
    else{x=40+((tt*50)%320);txt=L2('Скорость постоянна – внешние воздействия скомпенсированы, брусок покоится относительно тележки.','Жылдамдық тұрақты – сыртқы әсерлер теңестірілген, білеуше арбаға қатысты тыныш.')}
    cart.setAttribute('transform',`translate(${x},0)`);blk.setAttribute('transform',`translate(${lag},0)`);f.innerHTML=arrowS;out.innerHTML=`<span>${txt}</span>`})};

/* ===== 12 Newton III ===== */
VIZ.newton3=host=>{const sv=mk('div'),out=mk('div','out');const c=ctls([{k:'m1',n:['m₁','m₁'],min:20,max:100,step:10,val:50,u:L2('кг','кг')},{k:'m2',n:['m₂','m₂'],min:20,max:100,step:10,val:80,u:L2('кг','кг')},{k:'F',n:['сила толчка F','итеру күші F'],min:20,max:200,step:10,val:70,u:L2('Н','Н')}],()=>{});host.append(sv,c.el,out);
  sv.innerHTML=S(560,240,`<line x1="10" y1="190" x2="550" y2="190" class="ax"/><g id="g"></g>`);const g=sv.querySelector('#g');
  loop(host,(dt,t)=>{const {m1,m2,F}=c.v,a1=F/m1,a2=F/m2,per=3,tm=(t%per),ph=tm<1?0:Math.min(2,tm-1);const d1=ph*ph*a1*7,d2=ph*ph*a2*7;const x1=210-d1-20,x2=350+d2-20;
    g.innerHTML=`<rect x="${x1-m1*.5}" y="130" width="${40+m1*.5}" height="56" rx="6" class="f1"/><rect x="${x2}" y="130" width="${40+m2*.5}" height="56" rx="6" class="f2"/><text x="${x1-m1*.5+20+m1*.25}" y="164" text-anchor="middle" fill="#fff" style="font-weight:700">${m1} ${L2('кг','кг')}</text><text x="${x2+20+m2*.25}" y="164" text-anchor="middle" fill="#000" style="font-weight:700">${m2} ${L2('кг','кг')}</text>`+arrow(x1+20+0,100,x1+20-F*.5,100,'s3',3.4)+arrow(x2+20,100,x2+20+F*.5,100,'s4',3.4)+`<text x="${x1-F*.25+20}" y="86" text-anchor="middle" class="f3" style="font-weight:700">F₂₁</text><text x="${x2+20+F*.25}" y="86" text-anchor="middle" class="f4" style="font-weight:700">F₁₂</text><text x="280" y="30" text-anchor="middle" class="t2">F₁₂ = −F₂₁</text>`;
    out.innerHTML=`<span>|F₁₂| = |F₂₁| = <b>${F}</b> ${L2('Н','Н')}</span><span>a₁ = F/m₁ = <b>${fmt(a1)}</b></span><span>a₂ = F/m₂ = <b>${fmt(a2)}</b> ${L2('м/с²','м/с²')}</span><span>a₁/a₂ = m₂/m₁ = <b>${fmt(m2/m1)}</b></span>`})};

/* ===== 13 gravity ===== */
VIZ.gravity=host=>{const sv=mk('div'),out=mk('div','out');const c=ctls([{k:'m1',n:['m₁','m₁'],min:10,max:1000,step:10,val:100,u:L2('кг','кг')},{k:'m2',n:['m₂','m₂'],min:10,max:1000,step:10,val:100,u:L2('кг','кг')},{k:'r',n:['расстояние r','қашықтық r'],min:1,max:10,step:.5,val:2,u:L2('м','м')}],draw);host.append(sv,c.el,out);
  function draw(){const v=c.v,G=6.674e-11,F=G*v.m1*v.m2/(v.r*v.r),F0=G*100*100/4;const W=620,H=250,x0=50,x1=600,y0=14,y1=200;const rr=r=>x0+(x1-x0)*(r-1)/9,Fm=G*1000*1000/1;
    let s=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" class="ax"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" class="ax"/>`;
    const Fmax=Math.max(F*1.4,G*v.m1*v.m2/1);let pts='';for(let i=0;i<=60;i++){const r=1+9*i/60;pts+=`${rr(r).toFixed(1)},${(y1-(y1-y0)*(G*v.m1*v.m2/(r*r))/Fmax).toFixed(1)} `}
    s+=`<polyline points="${pts}" class="s1"/><circle cx="${rr(v.r)}" cy="${y1-(y1-y0)*F/Fmax}" r="7" class="f2"/>`;for(let r=1;r<=10;r+=1)s+=`<text x="${rr(r)}" y="${y1+16}" text-anchor="middle" class="t3">${r}</text>`;
    s+=`<text x="${x1}" y="${y1+34}" text-anchor="end" class="t2">r, ${L2('м','м')}</text><text x="${x0+6}" y="${y0+8}" class="t2">F(r)</text>`;
    const ra=8+Math.cbrt(v.m1)*2.2,rb=8+Math.cbrt(v.m2)*2.2;s+=`<circle cx="${100}" cy="232" r="${Math.min(ra,16)}" class="f1" transform="translate(0,-6)"/><circle cx="${100+v.r*45}" cy="226" r="${Math.min(rb,16)}" class="f2"/>`;
    sv.innerHTML=S(W,H+22,s);out.innerHTML=`<span>F = G·m₁m₂/r² = <b>${sci(F)}</b> ${L2('Н','Н')}</span><span>G = 6,67·10⁻¹¹ ${L2('Н·м²/кг²','Н·м²/кг²')}</span><span>${L2('r×2 → F÷4','r×2 → F÷4')}</span>`}
  draw()};

/* ===== 14 weight ===== */
VIZ.weight=host=>{const sv=mk('div'),out=mk('div','out');const c=ctls([{k:'a',n:['ускорение лифта a (↑ +, ↓ −)','лифт үдеуі a (↑ +, ↓ −)'],min:-10,max:6,step:.5,val:2,u:L2('м/с²','м/с²')},{k:'m',n:['масса человека','адам массасы'],min:30,max:90,step:5,val:60,u:L2('кг','кг')}],draw);host.append(sv,c.el,out);
  function draw(){const {a,m}=c.v,g=10,P=m*(g+a),mg=m*g,free=Math.abs(g+a)<.01,dy=free?-30:0,k=.07;
    let s=`<rect x="40" y="20" width="200" height="250" rx="6" class="gr" style="stroke:var(--ink3);stroke-width:2"/><rect x="60" y="238" width="160" height="12" class="fl"/>`;
    s+=`<circle cx="140" cy="${130+dy}" r="22" class="f2"/><rect x="118" y="${154+dy}" width="44" height="76" rx="8" class="f2"/>`;
    s+=arrow(100,200,100,200+mg*k,'s3',3)+`<text x="64" y="${214+mg*k}" class="t2">mg</text>`;
    if(!free)s+=arrow(190,250,190,250+P*k,'s1',3)+`<text x="198" y="${262+P*k*.5}" class="t2">P</text>`;
    if(Math.abs(a)>.01)s+=arrow(260,150,260,150-a*7,'s2',3)+`<text x="270" y="${150-a*3.5}" class="t3">a</text>`;
    s+=`<text x="300" y="60" class="t2">${L2('Показание весов, Н','Таразы көрсеткіші, Н')}</text><rect x="300" y="72" width="250" height="26" rx="6" class="fl"/><rect x="300" y="72" width="${Math.max(0,Math.min(250,P/1500*250))}" height="26" rx="6" class="f1"/><line x1="${300+mg/1500*250}" y1="64" x2="${300+mg/1500*250}" y2="106" class="s3 dash"/><text x="${300+mg/1500*250-14}" y="122" class="t3">mg</text>`;
    s+=`<text x="300" y="160" style="font-size:24px;font-weight:700">P = ${fmt(P,0)} ${L2('Н','Н')}</text>`;
    const msg=free?L2('НЕВЕСОМОСТЬ: a = g, P = 0','САЛМАҚСЫЗДЫҚ: a = g, P = 0'):a>0?L2('Перегрузка: P > mg','Артық жүктеме: P > mg'):a<0?L2('Вес уменьшился: P < mg','Салмақ азайды: P < mg'):'P = mg';
    s+=`<text x="300" y="200" style="font-size:18px;font-weight:700" fill="var(--c3)">${msg}</text>`;
    sv.innerHTML=S(580,300,s);out.innerHTML=`<span>P = m(g + a) = ${fmt(m,0)}·(10 ${a>=0?'+':'−'} ${fmt(Math.abs(a),1)}) = <b>${fmt(P,0)} ${L2('Н','Н')}</b></span><span>P/mg = <b>${fmt(P/mg,2)}</b></span>`}
  draw()};

const AX=(x0,x1,y0,y1)=>`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" class="ax"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" class="ax"/>`;
const pl=(pts,cls)=>`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" class="${cls}"/>`;
const bars=(x,y,w,h,items)=>items.map((it,i)=>{const bw=w/items.length*.7,gx=x+i*w/items.length+w/items.length*.15;const hh=Math.max(0,Math.min(1,it.v))*h;return `<rect x="${gx}" y="${y+h}" width="${bw}" height="${h}" class="fl" opacity="0"/><rect x="${gx}" y="${y+h-hh}" width="${bw}" height="${hh}" class="${it.c}"/><text x="${gx+bw/2}" y="${y+h+16}" text-anchor="middle" class="t2">${it.l}</text>`}).join('')+`<line x1="${x}" y1="${y+h}" x2="${x+w}" y2="${y+h}" class="ax"/>`;
const SYM={92:'U',91:'Pa',90:'Th',89:'Ac',88:'Ra',87:'Fr',86:'Rn',85:'At',84:'Po',83:'Bi',82:'Pb',81:'Tl',80:'Hg'};
const sup=n=>String(n).replace(/\d/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]),sub=n=>String(n).replace(/\d/g,c=>'₀₁₂₃₄₅₆₇₈₉'[c]);

/* ===== 16 satellites / Newton's cannon ===== */
VIZ.orbit=host=>{const sv=mk('div'),out=mk('div','out');
  const c=ctls([{k:'v',n:['скорость запуска v₀','ұшыру жылдамдығы v₀'],min:4,max:12,step:.1,val:7.6,u:L2('км/с','км/с')},{k:'h',n:['высота запуска h','ұшыру биіктігі h'],min:0,max:3000,step:100,val:500,u:L2('км','км')}],draw);host.append(sv,c.el,out);
  let pts=[],k=0;const cx=280,cy=190,R=62;
  function draw(){const {v,h}=c.v,r0=1+h/6371,vc=7.905/Math.sqrt(r0);let x=0,y=r0,vx=v/7.905,vy=0,dt=.004;pts=[[x,y]];let hit=false,esc=false;
    const acc=(x,y)=>{const r=Math.hypot(x,y),a=-1/(r*r*r);return [a*x,a*y]};let [ax,ay]=acc(x,y);
    for(let i=0;i<2600;i++){vx+=ax*dt/2;vy+=ay*dt/2;x+=vx*dt;y+=vy*dt;[ax,ay]=acc(x,y);vx+=ax*dt/2;vy+=ay*dt/2;const r=Math.hypot(x,y);pts.push([x,y]);if(r<1){hit=true;break}if(r>7){esc=true;break}}
    k=0;const T=2*Math.PI*Math.pow(r0,1.5)*806/60;
    const reg=hit?L2('падение на Землю','Жерге құлайды'):(v>=vc*1.414-.02)?L2('уход от Земли (v ≥ v₂)','Жерден кетеді (v ≥ v₂)'):Math.abs(v-vc)<.06?L2('круговая орбита','дөңгелек орбита'):L2('эллиптическая орбита','эллипс орбита');
    out.innerHTML=`<span>v₁(h) = <b>${fmt(vc,2)}</b> ${L2('км/с','км/с')}</span><span>v₂ = √2·v₁ = <b>${fmt(vc*1.414,2)}</b></span><span>T<sub>кр</sub> = <b>${fmt(T,0)}</b> ${L2('мин','мин')}</span><span><b>${reg}</b></span>`;
    let s=`<circle cx="${cx}" cy="${cy}" r="${R}" class="f1" opacity=".9"/><circle cx="${cx}" cy="${cy}" r="${R*r0}" class="gr dash"/>`;
    s+=pl(pts.filter((_,i)=>i%4===0).map(p=>[cx+p[0]*R,cy-p[1]*R]),'s3');
    s+=`<text x="12" y="22" class="t2">${L2('Пушка Ньютона: чем больше v₀, тем дальше падает снаряд','Ньютон зеңбірегі: v₀ артқан сайын снаряд алысқа құлайды')}</text><text x="${cx}" y="${cy+4}" text-anchor="middle" style="font-weight:700" fill="#fff">${L2('Земля','Жер')}</text><circle id="sat" r="7" class="f2"/>`;
    sv.innerHTML=S(560,380,s)}
  loop(host,dt=>{const e=sv.querySelector('#sat');if(!e||!pts.length)return;k=(k+dt*420)%pts.length;const p=pts[Math.floor(k)];e.setAttribute('cx',cx+p[0]*R);e.setAttribute('cy',cy-p[1]*R)});
  draw()};

/* ===== 17 collisions ===== */
VIZ.collision=host=>{const sv=mk('div'),out=mk('div','out');let mode=0;
  const c=ctls([{k:'m1',n:['m₁','m₁'],min:1,max:5,step:1,val:2,u:L2('кг','кг')},{k:'m2',n:['m₂','m₂'],min:1,max:5,step:1,val:3,u:L2('кг','кг')},{k:'v1',n:['v₁','v₁'],min:1,max:5,step:.5,val:3,u:L2('м/с','м/с')},{k:'v2',n:['v₂','v₂'],min:-3,max:1,step:.5,val:-1,u:L2('м/с','м/с')}],()=>{reset();info()});
  host.append(tabs([['Упругий удар','Серпімді соққы'],['Неупругий (слипание)','Серпімсіз (жабысу)']],i=>{mode=i;reset();info()}),sv,c.el,out);
  let st;const reset=()=>{st={x1:60,x2:420,t:0,hit:false,u1:0,u2:0,wait:0}};
  const calc=()=>{const {m1,m2,v1,v2}=c.v;const u1=mode?(m1*v1+m2*v2)/(m1+m2):((m1-m2)*v1+2*m2*v2)/(m1+m2),u2=mode?u1:((m2-m1)*v2+2*m1*v1)/(m1+m2);return {u1,u2}};
  function info(){const {m1,m2,v1,v2}=c.v,{u1,u2}=calc(),p=m1*v1+m2*v2,pp=m1*u1+m2*u2,e0=.5*m1*v1*v1+.5*m2*v2*v2,e1=.5*m1*u1*u1+.5*m2*u2*u2;
    out.innerHTML=`<span>${L2('до','до')}: p = <b>${fmt(p,1)}</b> ${L2('кг·м/с','кг·м/с')}</span><span>${L2('после','кейін')}: p' = <b>${fmt(pp,1)}</b></span><span>u₁ = ${fmt(u1,2)}, u₂ = ${fmt(u2,2)} ${L2('м/с','м/с')}</span><span>E<sub>k</sub>: ${fmt(e0,1)} → <b>${fmt(e1,1)}</b> ${L2('Дж','Дж')}${mode?' ('+L2('потеряно','жоғалды')+' '+fmt(e0-e1,1)+')':''}</span>`}
  reset();info();
  loop(host,dt=>{const {m1,m2,v1,v2}=c.v,w1=26+m1*8,w2=26+m2*8,sc=40;
    if(st.wait>0){st.wait-=dt;if(st.wait<=0)reset()}else{ if(!st.hit){st.x1+=v1*sc*dt;st.x2+=v2*sc*dt;if(st.x1+w1>=st.x2){st.hit=true;const u=calc();st.u1=u.u1;st.u2=u.u2;const ov=(st.x1+w1-st.x2)/2;st.x1-=ov;st.x2+=ov;if(mode){st.u2=st.u1}}}else{st.x1+=st.u1*sc*dt;st.x2+=st.u2*sc*dt;if(mode){st.x2=st.x1+w1}}
      if(st.x1<-40||st.x2>600||st.x2+w2<-10||st.x1>600)st.wait=.8}
    let s=`<line x1="0" y1="150" x2="560" y2="150" class="ax" style="stroke-width:3"/>`;
    s+=`<rect x="${st.x1}" y="${150-30}" width="${w1}" height="26" rx="4" class="f1"/><text x="${st.x1+w1/2}" y="${150-12}" text-anchor="middle" style="font-weight:700" fill="#fff">${m1}</text>`;
    const x2=mode&&st.hit?st.x1+w1:st.x2;s+=`<rect x="${x2}" y="${150-30}" width="${w2}" height="26" rx="4" class="f2"/><text x="${x2+w2/2}" y="${150-12}" text-anchor="middle" style="font-weight:700" fill="#fff">${m2}</text>`;
    s+=`<circle cx="${st.x1+w1*.3}" cy="146" r="4" class="fi"/><circle cx="${st.x1+w1*.7}" cy="146" r="4" class="fi"/><circle cx="${x2+w2*.3}" cy="146" r="4" class="fi"/><circle cx="${x2+w2*.7}" cy="146" r="4" class="fi"/>`;
    const va=st.hit?st.u1:v1,vb=st.hit?st.u2:v2;if(Math.abs(va)>.05)s+=arrow(st.x1+w1/2,100,st.x1+w1/2+va*14,100,'s1',3);if(Math.abs(vb)>.05)s+=arrow(x2+w2/2,100,x2+w2/2+vb*14,100,'s2',3);
    s+=`<text x="12" y="24" class="t2">${st.hit?L2('ПОСЛЕ удара','соққыдан КЕЙІН'):L2('ДО удара','соққыға ДЕЙІН')}</text>`;
    const {m1:a1,m2:a2}=c.v,pu=st.hit?[st.u1,st.u2]:[v1,v2],pt=a1*pu[0]+a2*pu[1];
    s+=`<text x="300" y="210" class="t2">p₁ = ${fmt(a1*pu[0],1)}   p₂ = ${fmt(a2*pu[1],1)}   p₁+p₂ = ${fmt(pt,1)}</text>`;
    sv.innerHTML=S(560,240,s)})};

/* ===== 18 energy ===== */
VIZ.energy=host=>{const sv=mk('div'),out=mk('div','out');
  const c=ctls([{k:'h',n:['начальная высота h','бастапқы биіктік h'],min:.5,max:3,step:.5,val:2,u:L2('м','м')},{k:'mu',n:['трение','үйкеліс'],min:0,max:.6,step:.05,val:0,dec:2}],reset);host.append(sv,c.el,out);
  const kk=.35,g=9.81;let x=0,vx=0,E0=0,hh=0;
  function reset(){const h=c.v.h;hh=h;x=-Math.sqrt(2*h/kk);vx=0;E0=g*h}
  const Y=x=>.5*kk*x*x;
  reset();
  loop(host,dt=>{const {mu}=c.v;for(let i=0;i<8;i++){const d=dt/8,sl=kk*x,a=-g*sl/(1+sl*sl)-mu*vx*2;vx+=a*d;x+=vx*d}
    const y=Y(x),ek=.5*(vx*vx)*(1+Math.pow(kk*x,2)),ep=g*y,tot=E0,q=Math.max(0,tot-ek-ep);
    const px=u=>280+u*55,py=u=>260-u*60;let s='';const tp=[];for(let i=-30;i<=30;i++){const u=i/10*1.2;tp.push([px(u),py(Y(u))])}
    s+=pl(tp,'s4')+`<circle cx="${px(x)}" cy="${py(y)-9}" r="9" class="f2"/>`;
    s+=`<line x1="${px(-3)}" y1="${py(hh)}" x2="${px(3)}" y2="${py(hh)}" class="gr dash"/><text x="${px(-3)+4}" y="${py(hh)-5}" class="t3">h</text>`;
    s+=bars(420,30,150,150,[{l:'Eп',v:ep/(g*3),c:'f1'},{l:'Eк',v:ek/(g*3),c:'f2'},{l:'Q',v:q/(g*3),c:'f3'}]).replace(/<text x="(\S+)" y="(\S+)" text-anchor="middle" class="t2">/g,'<text x="$1" y="$2" text-anchor="middle" class="t2">');
    s+=`<text x="12" y="22" class="t2">${L2('Скатывание по желобу: Eп ⇄ Eк','Науа бойымен сырғу: Eп ⇄ Eк')}</text><text x="420" y="22" class="t2">${L2('Энергия, Дж/кг','Энергия, Дж/кг')}</text>`;
    sv.innerHTML=S(600,300,s);
    out.innerHTML=`<span>E<sub>п</sub>+E<sub>к</sub> = <b>${fmt(ep+ek,1)}</b> ${L2('Дж/кг','Дж/кг')}</span><span>${L2('перешло в тепло','жылуға айналды')} Q = <b>${fmt(q,1)}</b></span>`})};

/* ===== 19/20 oscillations ===== */
VIZ.osc=(host,mode0)=>{const sv=mk('div'),out=mk('div','out'),ctl=mk('div');let mode=mode0||0,t0=performance.now()/1000,c;
  const build=()=>{ctl.innerHTML='';c=ctls(mode===0?[{k:'m',n:['масса m','масса m'],min:.1,max:2,step:.1,val:.5,u:L2('кг','кг')},{k:'k',n:['жёсткость k','қатаңдық k'],min:10,max:100,step:5,val:40,u:L2('Н/м','Н/м')},{k:'A',n:['амплитуда A','амплитуда A'],min:2,max:10,step:1,val:8,u:L2('см','см')}]:[{k:'l',n:['длина l','ұзындық l'],min:.2,max:2,step:.1,val:1,u:L2('м','м')},{k:'A',n:['угол отклонения','ауытқу бұрышы'],min:3,max:25,step:1,val:12,u:'°'}],()=>{t0=performance.now()/1000});ctl.append(c.el);t0=performance.now()/1000};
  host.append(tabs([['Пружинный маятник','Серіппелі маятник'],['Математический маятник','Математикалық маятник']],i=>{mode=i;build()},mode),sv,ctl,out);build();
  loop(host,(dt,tt)=>{const v=c.v,T=mode===0?2*Math.PI*Math.sqrt(v.m/v.k):2*Math.PI*Math.sqrt(v.l/9.81),w=2*Math.PI/T,t=tt-t0,ph=Math.cos(w*t),sn=-Math.sin(w*t);
    let s='';
    if(mode===0){const eq=130,xm=eq+ph*v.A*5.5;let z=`M20,110`;const n=12,x1=xm-30;for(let i=1;i<=n;i++){z+=` L${20+(x1-20)*(i-.5)/n},${i%2?96:124}`}z+=` L${x1},110`;
      s+=`<rect x="8" y="80" width="12" height="60" class="fl"/><line x1="8" y1="140" x2="250" y2="140" class="ax"/><path d="${z}" class="s1"/><rect x="${xm-30}" y="86" width="52" height="48" rx="6" class="f2"/><line x1="${eq-8}" y1="70" x2="${eq-8}" y2="150" class="gr dash"/><text x="${eq-8}" y="64" text-anchor="middle" class="t3">x = 0</text>`}
    else{const L=v.l*80,th=v.A*D2R*ph,px=120,py=20,bx=px+L*Math.sin(th),by=py+L*Math.cos(th);s+=`<line x1="60" y1="20" x2="180" y2="20" class="ax" style="stroke-width:5"/><line x1="${px}" y1="${py}" x2="${px}" y2="${py+L+10}" class="gr dash"/><line x1="${px}" y1="${py}" x2="${bx}" y2="${by}" class="s1"/><circle cx="${bx}" cy="${by}" r="13" class="f2"/>`}
    const gx0=280,gx1=620,gy=110,amp=70;let tr=[];for(let i=0;i<=120;i++){const tt2=i/120*3;tr.push([gx0+(gx1-gx0)*i/120,gy-amp*Math.cos(w*tt2)])}
    const tc=t%3;s+=AX(gx0,gx1,gy-90,gy+90).replace(`y1="${gy+90}" x2="${gx1}" y2="${gy+90}"`,`y1="${gy}" x2="${gx1}" y2="${gy}"`).replace(`y1="${gy+90}" x2="${gx1}"`,`y1="${gy}" x2="${gx1}"`);
    s+=`<line x1="${gx0}" y1="${gy}" x2="${gx1}" y2="${gy}" class="ax"/>`+pl(tr,'s1')+`<line x1="${gx0+(gx1-gx0)*tc/3}" y1="${gy-90}" x2="${gx0+(gx1-gx0)*tc/3}" y2="${gy+90}" class="gr"/><circle cx="${gx0+(gx1-gx0)*tc/3}" cy="${gy-amp*ph}" r="6" class="f3"/><text x="${gx1}" y="${gy+16}" text-anchor="end" class="t3">t, ${L2('с','с')}</text><text x="${gx0+6}" y="${gy-94}" class="t3">x</text>`;
    for(let i=1;i<=3;i++)s+=`<text x="${gx0+(gx1-gx0)*i/3}" y="${gy+16}" text-anchor="middle" class="t3">${i}</text>`;
    s+=`<line x1="${gx0}" y1="${gy-amp}" x2="${gx0+(gx1-gx0)*T/3}" y2="${gy-amp}" class="s3 dash" opacity="0"/>`;
    const bx=300;s+=bars(bx,200,200,70,[{l:L2('Eп','Eп'),v:ph*ph,c:'f1'},{l:L2('Eк','Eк'),v:sn*sn,c:'f2'}]).replace(/y="(\d+)" text-anchor="middle" class="t2"/g,'y="$1" text-anchor="middle" class="t2"');
    s+=`<text x="${bx+210}" y="250" class="t2">x(t) = A·cos ωt</text>`;
    sv.innerHTML=S(640,300,s);
    out.innerHTML=mode===0?`<span>T = 2π√(m/k) = <b>${fmt(T,2)}</b> ${L2('с','с')}</span><span>ν = <b>${fmt(1/T,2)}</b> ${L2('Гц','Гц')}</span><span>ω = <b>${fmt(w,2)}</b> ${L2('рад/с','рад/с')}</span>`:`<span>T = 2π√(l/g) = <b>${fmt(T,2)}</b> ${L2('с','с')}</span><span>ν = <b>${fmt(1/T,2)}</b> ${L2('Гц','Гц')}</span><span>${L2('T не зависит от m и A','T m мен A-ға тәуелсіз')}</span>`})};

/* ===== 22 resonance ===== */
VIZ.resonance=host=>{const sv=mk('div'),out=mk('div','out');
  const c=ctls([{k:'r',n:['частота вынуждающей силы ν/ν₀','мәжбүр етуші күш жиілігі ν/ν₀'],min:.2,max:2,step:.05,val:.6,dec:2},{k:'z',n:['затухание ζ','өшу ζ'],min:.05,max:.5,step:.05,val:.1,dec:2}],()=>{});host.append(sv,c.el,out);
  const A=(r,z)=>1/Math.sqrt(Math.pow(1-r*r,2)+Math.pow(2*z*r,2));
  loop(host,(dt,t)=>{const {r,z}=c.v,Am=A(r,z),ym=Math.min(10,1/(2*Math.sqrt(1-z*z)/1)/z*z*1)||1,top=Math.max(2,Math.min(10,1/(2*c.v.z))*1.15);
    const x0=250,x1=620,y0=20,y1=260,X=u=>x0+(x1-x0)*(u-.2)/1.8,Y=a=>y1-(y1-y0)*Math.min(a,top)/top;let pts=[];for(let i=0;i<=120;i++){const u=.2+1.8*i/120;pts.push([X(u),Y(A(u,z))])}
    let s=AX(x0,x1,y0,y1)+pl(pts,'s1')+`<line x1="${X(1)}" y1="${y0}" x2="${X(1)}" y2="${y1}" class="gr dash"/><text x="${X(1)}" y="${y1+16}" text-anchor="middle" class="t3">ν₀</text><circle cx="${X(r)}" cy="${Y(Am)}" r="8" class="f3"/><text x="${x1}" y="${y1+32}" text-anchor="end" class="t2">ν/ν₀</text><text x="${x0+4}" y="${y0-4}" class="t2">${L2('амплитуда A','амплитуда A')}</text>`;
    const ph=2*Math.PI*r*0.8*t,amp=Math.min(60,Am/top*70),py=150+amp*Math.sin(ph-Math.atan2(2*z*r,1-r*r)),dr=-12*Math.sin(ph);
    s+=`<rect x="40" y="${50+dr}" width="120" height="8" class="f4"/><path d="M100,${58+dr} l-12,10 l24,12 l-24,12 l24,12 l-24,12 l12,8 L100,${py-18}" class="s1" style="stroke-width:2"/><rect x="72" y="${py-18}" width="56" height="36" rx="6" class="f2"/><text x="100" y="285" text-anchor="middle" class="t3">${L2('привод и груз','жетек пен жүк')}</text>`;
    sv.innerHTML=S(640,300,s);out.innerHTML=`<span>ν/ν₀ = ${fmt(r,2)}</span><span>A/A<sub>0</sub> = <b>${fmt(Am,1)}</b></span><span>${Math.abs(r-1)<.12?L2('РЕЗОНАНС: амплитуда максимальна','РЕЗОНАНС: амплитуда ең үлкен'):''}</span>`})};

/* ===== 23 LC circuit ===== */
VIZ.lc=host=>{const sv=mk('div'),out=mk('div','out');
  const c=ctls([{k:'L',n:['индуктивность L','индуктивтілік L'],min:1,max:100,step:1,val:25,u:L2('мГн','мГн')},{k:'C',n:['ёмкость C','сыйымдылық C'],min:1,max:100,step:1,val:25,u:L2('мкФ','мкФ')}],()=>{});host.append(sv,c.el,out);
  loop(host,(dt,t)=>{const {L,C}=c.v,T=0.1987*Math.sqrt(L*C),Tv=3,ph=2*Math.PI*((t%Tv)/Tv),q=Math.cos(ph),i=-Math.sin(ph);

    s+=`<line x1="10" y1="95" x2="50" y2="95" class="ax" style="stroke-width:4"/><line x1="10" y1="115" x2="50" y2="115" class="ax" style="stroke-width:4"/>`;
    s+=`<text x="58" y="92" style="font-size:16px;font-weight:700" fill="${q>0?'var(--c3)':'var(--c1)'}">${q>.05?'+':q<-.05?'−':''}</text><text x="58" y="124" style="font-size:16px;font-weight:700" fill="${q>0?'var(--c1)':'var(--c3)'}">${q>.05?'−':q<-.05?'+':''}</text>`;
    let coil=`M110,50`;for(let k=0;k<4;k++)coil+=` a15,15 0 0 1 15,0`;s+=`<path d="${coil}" class="s2" style="stroke-width:3.5" transform="translate(0,0)"/><text x="140" y="38" text-anchor="middle" class="t2">L</text><text x="82" y="108" class="t2">C</text>`;
    if(Math.abs(i)>.1)s+=arrow(150,222,150+(i>0?1:-1)*Math.abs(i)*50,222,'s3',3)+`<text x="150" y="244" class="t3">I</text>`;
    const gx0=290,gx1=620,gy=120;let q1=[],i1=[];for(let k=0;k<=120;k++){const a=2*Math.PI*2*k/120;q1.push([gx0+(gx1-gx0)*k/120,gy-70*Math.cos(a)]);i1.push([gx0+(gx1-gx0)*k/120,gy+70*Math.sin(a)])}

/* ===== 24 waves ===== */
VIZ.wave=host=>{const sv=mk('div'),out=mk('div','out');let mode=0;
  const c=ctls([{k:'lam',n:['длина волны λ','толқын ұзындығы λ'],min:3,max:20,step:1,val:10,u:L2('см','см')},{k:'f',n:['частота ν','жиілік ν'],min:.5,max:3,step:.5,val:1,u:L2('Гц','Гц'),dec:1}],()=>{});
  host.append(tabs([['Поперечная','Көлденең'],['Продольная','Бойлық']],i=>mode=i),sv,c.el,out);
  loop(host,(dt,t)=>{const {lam,f}=c.v,k=14,Lp=lam*k;let s='';
    if(mode===0){let p=[];for(let x=20;x<=620;x+=3)p.push([x,110-45*Math.sin(2*Math.PI*((x-20)/Lp-f*t))]);
      s+=`<line x1="20" y1="110" x2="620" y2="110" class="gr dash"/>`+pl(p,'s1');const cr=110-45*Math.sin(2*Math.PI*(120/Lp-f*t));s+=`<circle cx="140" cy="${cr}" r="7" class="f3"/>`;
      let pk=0;for(let x=20;x<420;x+=1){const a=Math.sin(2*Math.PI*((x-20)/Lp-f*t));if(a>.998){pk=x;break}}
      if(pk&&pk+Lp<620)s+=`<line x1="${pk}" y1="40" x2="${pk+Lp}" y2="40" class="s2"/><text x="${pk+Lp/2}" y="32" text-anchor="middle" class="t2" fill="var(--c2)">λ</text>`}
    else{for(let r=0;r<5;r++)for(let x0=20;x0<=620;x0+=Lp/6){const x=x0+8*Math.sin(2*Math.PI*((x0-20)/Lp-f*t))*1.2+0;s+=`<circle cx="${x}" cy="${60+r*24}" r="4.2" class="${r===2&&Math.abs(x0-140)<Lp/12?'f3':'f1'}" opacity=".85"/>`}}
    s+=`<text x="20" y="220" class="t2">${mode===0?L2('частица среды колеблется ⟂ направлению распространения','орта бөлшегі таралу бағытына ⟂ тербеледі'):L2('частицы колеблются вдоль направления распространения','бөлшектер таралу бағытымен тербеледі')}</text>`;
    sv.innerHTML=S(640,240,s);out.innerHTML=`<span>T = 1/ν = <b>${fmt(1/f,2)}</b> ${L2('с','с')}</span><span>υ = λ·ν = <b>${fmt(lam*f,1)}</b> ${L2('см/с','см/с')}</span>`})};

/* ===== 25 sound ===== */
VIZ.sound=host=>{const sv=mk('div'),out=mk('div','out');let ac=null,osc=null,gn=null,on=false;
  const c=ctls([{k:'f',n:['частота ν','жиілік ν'],min:100,max:2000,step:50,val:440,u:L2('Гц','Гц')},{k:'A',n:['громкость (амплитуда)','дыбыс қаттылығы (амплитуда)'],min:.1,max:1,step:.1,val:.6,dec:1},{k:'T',n:['температура воздуха','ауа температурасы'],min:-20,max:40,step:5,val:20,u:'°C'},{k:'t',n:['время до эха t','жаңғырыққа дейінгі уақыт t'],min:.1,max:2,step:.1,val:.5,u:L2('с','с'),dec:1}],()=>{if(gn){gn.gain.value=.15*c.v.A;osc.frequency.value=c.v.f}});
  const btn=mk('button','btn pri',L2('▶ Включить звук','▶ Дыбысты қосу'));
  btn.onclick=()=>{try{if(!on){ac=ac||new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();gn=ac.createGain();osc.frequency.value=c.v.f;gn.gain.value=.15*c.v.A;osc.connect(gn).connect(ac.destination);osc.start();on=true;btn.textContent=L2('■ Выключить','■ Өшіру')}else{osc.stop();on=false;btn.textContent=L2('▶ Включить звук','▶ Дыбысты қосу')}}catch(e){}};
  host.append(btn,sv,c.el,out);
  loop(host,(dt,t)=>{if(!host.isConnected&&on){try{osc.stop()}catch(e){}on=false}const {f,A,T,t:te}=c.v,v=331+.6*T,lam=v/f;let p=[];for(let i=0;i<=300;i++){const x=i/300;p.push([20+x*600,100-70*A*Math.sin(2*Math.PI*(x*5*f/440-t*1.2))])}
    let s=`<line x1="20" y1="100" x2="620" y2="100" class="gr"/>`+pl(p,'s1')+`<text x="20" y="22" class="t2">${L2('Осциллограмма (масштаб условный)','Осциллограмма (шартты масштаб)')}</text>`;
    s+=`<text x="20" y="210" style="font-size:18px;font-weight:700">${L2('Эхо','Жаңғырық')}: s = υ·t/2 = ${fmt(v,0)}·${fmt(te,1)}/2 = ${fmt(v*te/2,0)} ${L2('м','м')}</text>`;
    s+=`<rect x="20" y="226" width="${Math.min(600,v*te/2/340*300)}" height="14" rx="4" class="f2"/>`;
    sv.innerHTML=S(640,260,s);out.innerHTML=`<span>υ ≈ 331 + 0,6·t = <b>${fmt(v,0)}</b> ${L2('м/с','м/с')}</span><span>λ = υ/ν = <b>${fmt(lam,2)}</b> ${L2('м','м')}</span><span>T = <b>${fmt(1000/f,2)}</b> ${L2('мс','мс')}</span>`})};

/* ===== 26 EM spectrum ===== */
VIZ.spectrum=host=>{const sv=mk('div'),out=mk('div','out');
  const c=ctls([{k:'e',n:['lg λ (λ в метрах)','lg λ (λ метрмен)'],min:-14,max:4,step:.1,val:-6.3,dec:1}],draw);host.append(sv,c.el,out);
  const B=[[-14,-11,'γ','γ-излучение','γ-сәулелену','онкология, стерилизация','онкология, зарарсыздандыру','f4'],[-11,-8,'X','рентген','рентген','медицинская диагностика','медициналық диагностика','f3'],[-8,-6.4,'УФ','ультрафиолет','ультракүлгін','дезинфекция, загар','дезинфекция, күю','f4'],[-6.4,-5.9,'👁','видимый свет','көрінетін жарық','зрение','көру','f2'],[-5.9,-3,'ИК','инфракрасное','инфрақызыл','пульты, тепловизоры','пульттер, тепловизорлар','f3'],[-3,-1,'мкВ','микроволны','микротолқындар','печь, Wi-Fi, радар','пеш, Wi-Fi, радар','f1'],[-1,4,'Рад','радиоволны','радиотолқындар','радио, ТВ, связь','радио, ТД, байланыс','f1']];
  function draw(){const e=c.v.e,lam=Math.pow(10,e),f=3e8/lam,E=6.626e-34*f/1.602e-19,X=u=>20+(u+14)/18*600;let s='';
    s+=`<defs><linearGradient id="vis" x1="0" x2="1"><stop offset="0" stop-color="#7a2cff"/><stop offset=".2" stop-color="#2a5cff"/><stop offset=".4" stop-color="#1fb85a"/><stop offset=".6" stop-color="#f3dc1d"/><stop offset=".8" stop-color="#f08a1d"/><stop offset="1" stop-color="#e02b2b"/></linearGradient></defs>`;
    B.forEach(b=>{const w=X(b[1])-X(b[0]);s+=b[2]==='👁'?`<rect x="${X(b[0])}" y="80" width="${w}" height="52" fill="url(#vis)"/>`:`<rect x="${X(b[0])}" y="80" width="${w}" height="52" class="${b[7]}" opacity=".35"/>`;s+=`<rect x="${X(b[0])}" y="80" width="${w}" height="52" class="gr" style="stroke:var(--ink3)"/>`;
      s+=`<text x="${X(b[0])+w/2}" y="${b[2]==='👁'?150:110}" text-anchor="middle" style="font-weight:700;font-size:${w<40?11:13}px">${b[2]==='👁'?'':b[2]}</text>`});
    for(let k=-14;k<=4;k+=2)s+=`<text x="${X(k)}" y="170" text-anchor="middle" class="t3">10${sup(k).replace('⁻','⁻')}</text>`;
    s+=`<text x="20" y="188" class="t3">λ, ${L2('м','м')} →</text><text x="620" y="60" text-anchor="end" class="t3">${L2('частота ν уменьшается →','жиілік ν азаяды →')}</text><text x="20" y="60" class="t3">← ${L2('энергия фотона растёт','фотон энергиясы өседі')}</text>`;
    s+=`<line x1="${X(e)}" y1="70" x2="${X(e)}" y2="140" class="s3" style="stroke-width:3.5"/>`;
    const bd=B.find(b=>e>=b[0]&&e<=b[1])||B[6];
    s+=`<text x="20" y="226" style="font-size:20px;font-weight:700">${L2(bd[3],bd[4])} — ${L2(bd[5],bd[6])}</text>`;
    sv.innerHTML=S(640,250,s);out.innerHTML=`<span>λ = <b>${sci(lam,2)}</b> ${L2('м','м')}</span><span>ν = c/λ = <b>${sci(f,2)}</b> ${L2('Гц','Гц')}</span><span>E = hν = <b>${E>1e4?sci(E,2):fmt(E,E<.01?5:2)}</b> ${L2('эВ','эВ')}</span><span>c = 3·10⁸ ${L2('м/с','м/с')}</span>`}
  draw()};

/* ===== 27 blackbody + photoeffect ===== */
VIZ.photo=host=>{const sv=mk('div'),ctl=mk('div'),out=mk('div','out');let mode=0,c,metal=1;
  const MET=[['Cs',1.95],['Na',2.3],['Zn',4.3],['Pt',5.65]];
  const build=()=>{ctl.innerHTML='';c=ctls(mode===0?[{k:'T',n:['температура тела T','дене температурасы T'],min:3000,max:8000,step:500,val:5500,u:'K'}]:[{k:'nu',n:['частота света ν','жарық жиілігі ν'],min:2,max:14,step:.5,val:8,u:'·10¹⁴ '+L2('Гц','Гц'),dec:1},{k:'I',n:['интенсивность','қарқындылық'],min:1,max:10,step:1,val:5}],()=>{});ctl.append(c.el);
    if(mode===1){const t=tabs(MET.map(m=>[m[0]+' (A = '+m[1]+' эВ)',m[0]+' (A = '+m[1]+' эВ)']),i=>metal=i,metal);ctl.prepend(t)}};
  host.append(tabs([['Тепловое излучение','Жылулық сәулелену'],['Фотоэффект','Фотоэффект']],i=>{mode=i;build()}),sv,ctl,out);build();
  let el=[];
  loop(host,(dt,t)=>{let s='';
    if(mode===0){const T=c.v.T,x0=50,x1=620,y0=20,y1=250,pk=2.898e-3/T*1e9,pl2=l=>{const L=l*1e-9;return 1/(Math.pow(L,5)*(Math.exp(1.4388e-2/(L*T))-1))};const ref=pl2(2.898e-3/8000*1e9),X=l=>x0+(x1-x0)*(l-100)/2900;
      s+=`<rect x="${X(380)}" y="${y0}" width="${X(750)-X(380)}" height="${y1-y0}" fill="url(#vis2)" opacity=".28"/><defs><linearGradient id="vis2" x1="0" x2="1"><stop offset="0" stop-color="#7a2cff"/><stop offset=".25" stop-color="#2a5cff"/><stop offset=".5" stop-color="#1fb85a"/><stop offset=".75" stop-color="#f3dc1d"/><stop offset="1" stop-color="#e02b2b"/></linearGradient></defs>`+AX(x0,x1,y0,y1);
      [3000,5500,8000].forEach((TT,ix)=>{});let p=[];for(let l=100;l<=3000;l+=20)p.push([X(l),y1-(y1-y0-10)*pl2(l)/ref*(T===8000?1:1)*0.7]);
      const pm=Math.max(...p.map(q=>y1-q[1]));p=p.map(q=>[q[0],y1-(y1-q[1])/pm*(y1-y0-20)*Math.pow(T/8000,2)]);
      s+=pl(p,'s3')+`<line x1="${X(pk)}" y1="${y0}" x2="${X(pk)}" y2="${y1}" class="s2 dash"/><text x="${X(pk)+6}" y="${y0+14}" class="t2" fill="var(--c2)">λmax = ${fmt(pk,0)} ${L2('нм','нм')}</text><text x="${x1}" y="${y1+30}" text-anchor="end" class="t2">λ, ${L2('нм','нм')}</text><text x="${x0+4}" y="${y0-4}" class="t2">${L2('спектральная плотность излучения','сәулелену спектрлік тығыздығы')}</text>`;
      for(let l=500;l<=3000;l+=500)s+=`<text x="${X(l)}" y="${y1+16}" text-anchor="middle" class="t3">${l}</text>`;
      sv.innerHTML=S(640,290,s);out.innerHTML=`<span>λ<sub>max</sub>·T = b = 2,9·10⁻³ м·К</span><span>λ<sub>max</sub> = <b>${fmt(pk,0)}</b> ${L2('нм','нм')}</span><span>${L2('Планк','Планк')}: E = h·ν, h = 6,63·10⁻³⁴ Дж·с</span>`}
    else{const {nu,I}=c.v,A=MET[metal][1],Eph=4.136e-15*nu*1e14,Ek=Eph-A,nu0=A/4.136e-15/1e14,x0=360,x1=620,y0=20,y1=210,X=u=>x0+(x1-x0)*(u-2)/12,Y=e=>y1-(y1-y0)*(e+0)/(Math.max(2,4.136e-15*14e14-1.95)),ym=4.136e-15*14e14-1.95;
      if(Ek>0&&Math.random()<dt*I*4)el.push({x:150,y:150,vx:40+Ek*30,vy:-40-Math.random()*60,life:0});el.forEach(e=>{e.life+=dt;e.x+=e.vx*dt;e.y+=e.vy*dt});el=el.filter(e=>e.life<1.4);
      s+=`<rect x="40" y="150" width="200" height="22" class="fl" stroke="var(--ink3)"/><text x="140" y="190" text-anchor="middle" class="t2">${MET[metal][0]}</text>`;
      for(let i=0;i<Math.min(5,Math.ceil(I/2));i++){const x=60+i*34,ph=(t*1.5+i*.31)%1;s+=`<path d="M${x-20},${20+ph*30} q4,-6 8,0 t8,0 t8,0 t8,0" class="s2" opacity=".0"/>`+arrow(x-30,18+ph*28,x,18+ph*28+Math.min(100,100)*.9*ph*0+60-ph*0,'s2',2)}
      s+=`<text x="20" y="110" class="t2" fill="var(--c2)">hν</text>`;el.forEach(e=>{s+=`<circle cx="${e.x}" cy="${e.y}" r="5" class="f1"/><text x="${e.x}" y="${e.y+3.5}" text-anchor="middle" style="font-size:9px;fill:#fff">e</text>`});
      s+=AX(x0,x1,y0,y1)+`<line x1="${X(nu0)}" y1="${y1}" x2="${X(14)}" y2="${Y(4.136e-15*14e14-A)}" class="s1"/><line x1="${x0}" y1="${y1}" x2="${X(nu0)}" y2="${y1}" class="s3"/><circle cx="${X(nu)}" cy="${Ek>0?Y(Ek):y1}" r="7" class="f3"/><line x1="${X(nu0)}" y1="${y1-8}" x2="${X(nu0)}" y2="${y1+8}" class="s2"/><text x="${X(nu0)}" y="${y1+22}" text-anchor="middle" class="t2" fill="var(--c2)">ν<tspan dy="4" font-size="9">кр</tspan></text><text x="${x1}" y="${y1+34}" text-anchor="end" class="t2">ν, 10¹⁴ ${L2('Гц','Гц')}</text><text x="${x0+4}" y="${y0-4}" class="t2">E<tspan dy="4" font-size="9">к</tspan>, ${L2('эВ','эВ')}</text>`;
      sv.innerHTML=S(640,260,s);out.innerHTML=`<span>E = hν = <b>${fmt(Eph,2)}</b> ${L2('эВ','эВ')}</span><span>A = ${fmt(A,2)} ${L2('эВ','эВ')}</span><span>E<sub>к</sub> = hν − A = <b>${fmt(Math.max(0,Ek),2)}</b> ${L2('эВ','эВ')}</span><span><b>${Ek>0?L2('фотоэффект есть','фотоэффект бар'):L2('фотоэффекта нет (hν < A)','фотоэффект жоқ (hν < A)')}</b></span><span>${L2('Интенсивность ↑ → число электронов ↑, но Eк не меняется','Қарқындылық ↑ → электрондар саны ↑, Eк өзгермейді')}</span>`}})};

/* ===== 28 X-ray ===== */
VIZ.xray=host=>{const sv=mk('div'),ctl=mk('div'),out=mk('div','out');let mode=0,c;
  const build=()=>{ctl.innerHTML='';c=ctls(mode===0?[{k:'U',n:['напряжение на трубке U','түтіктегі кернеу U'],min:20,max:120,step:5,val:60,u:L2('кВ','кВ')}]:[{k:'x',n:['толщина слоя x','қабат қалыңдығы x'],min:0,max:5,step:.1,val:2,u:L2('см','см'),dec:1}],()=>{});ctl.append(c.el)};
  host.append(tabs([['Рентгеновская трубка','Рентген түтігі'],['Поглощение','Жұтылу']],i=>{mode=i;build()}),sv,ctl,out);build();
  loop(host,()=>{let s='';
    if(mode===0){const U=c.v.U,lmin=1.24/U,x0=50,x1=620,y0=20,y1=240,X=l=>x0+(x1-x0)*(l-0)/0.15,f=l=>l>lmin?(l/lmin-1)/(l*l)*lmin*lmin:0;let p=[];const mx=Math.max(...Array.from({length:150},(_,i)=>f(i*.001+.0001)));for(let l=.0;l<=0.15;l+=.001)p.push([X(l),y1-(y1-y0-20)*f(l)/mx*(U/120)]);
      s+=AX(x0,x1,y0,y1)+pl(p,'s1');if(U>69.5)s+=`<line x1="${X(.0209)}" y1="${y1}" x2="${X(.0209)}" y2="${y1-170}" class="s3"/><text x="${X(.0209)+4}" y="${y0+40}" class="t2" fill="var(--c3)">${L2('характеристич. линия W','W сипаттамалық сызығы')}</text>`;

    else{const x=c.v.x,M=[[L2('мягкие ткани','жұмсақ тіндер','')||'',0.2,'f1','s1'],[L2('кость','сүйек'),0.6,'f2','s2'],[L2('свинец','қорғасын'),55,'f3','s3']];const x0=50,x1=420,y0=20,y1=240,X=u=>x0+(x1-x0)*u/5,Y=I=>y1-(y1-y0)*I;s+=AX(x0,x1,y0,y1);

/* ===== 29 Rutherford ===== */
VIZ.rutherford=host=>{const sv=mk('div'),out=mk('div','out');let mode=0;
  const c=ctls([{k:'Z',n:['заряд ядра Z','ядро заряды Z'],min:2,max:100,step:1,val:79}],draw);
  host.append(tabs([['Резерфорд: ядерная модель','Резерфорд: ядролық модель'],['Томсон: «пудинг с изюмом»','Томсон: «мейіз бөлкесі»']],i=>{mode=i;draw()}),sv,c.el,out);
  function draw(){const cx=330,cy=150,Z=c.v.Z;let s='',big=0,n=0;
    s+=`<rect x="${cx-8}" y="10" width="16" height="280" class="fl" opacity=".35"/>`;
    for(let b=-120;b<=120;b+=14){if(b===0&&mode===0)continue;n++;let x=20,y=cy+b,vx=250,vy=0,pts=[[x,y]];
      if(mode===0){const K=4747*Z;for(let i=0;i<4000;i++){const dt=.0015,dx=x-cx,dy=y-cy,r2=dx*dx+dy*dy+4,r=Math.sqrt(r2),a=K/(r2*r);vx+=a*dx*dt;vy+=a*dy*dt;x+=vx*dt;y+=vy*dt;if(i%12===0)pts.push([x,y]);if(x<0||x>640||y<0||y>300)break}pts.push([x,y]);const ang=Math.atan2(vy,vx)/D2R;if(Math.abs(ang)>90)big++;
        s+=pl(pts,Math.abs(ang)>90?'s3':'s1')}
      else{const a=b/120*0.6;pts.push([cx,y+a*0]);const xe=620;pts.push([xe,y+b*0.01+(b/120)*3]);s+=pl([[20,y],[cx,y],[xe,y+b*.01]],'s1')}}
    s+=mode===0?`<circle cx="${cx}" cy="${cy}" r="5" class="f2"/><text x="${cx+10}" y="${cy-8}" class="t2">+Ze</text>`:`<circle cx="${cx}" cy="${cy}" r="${48}" class="a2"/><text x="${cx+4}" y="${cy-54}" text-anchor="middle" class="t2">${L2('положительный «пудинг» + электроны','оң «қамыр» + электрондар')}</text>`;
    s+=`<text x="20" y="22" class="t2">α →</text>`;sv.innerHTML=S(640,300,s);
    out.innerHTML=mode===0?`<span>${L2('отклонены на >90°','>90° бұрышқа ауытқыды')}: <b>${big}</b> ${L2('из','/')} ${n}</span><span>${L2('r<sub>яд</sub> ~ 10⁻¹⁵ м, r<sub>атома</sub> ~ 10⁻¹⁰ м','r<sub>ядро</sub> ~ 10⁻¹⁵ м, r<sub>атом</sub> ~ 10⁻¹⁰ м')}</span>`:`<span>${L2('по модели Томсона α-частицы почти не отклоняются','Томсон моделі бойынша α-бөлшектер дерлік ауытқымайды')}</span><span>${L2('Опыт Резерфорда: примерно 1 из 8000 назад — модель неверна','Резерфорд тәжірибесі: шамамен 8000-ның 1-і кері — модель қате')}</span>`}
  draw()};
