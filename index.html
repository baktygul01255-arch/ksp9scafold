/* ===== 31 radioactive decay ===== */
VIZ.decay=host=>{const sv=mk('div'),out=mk('div','out'),eq=mk('div');const N0=128;let alive,hist,A=238,Z=92,chain;
  const reset=()=>{alive=Array(N0).fill(1);hist=[N0];draw()};
  const step=()=>{alive=alive.map(a=>a&&Math.random()<.5?1:0);hist.push(alive.reduce((a,b)=>a+b,0));draw()};
  const bar=mk('div','tabs'),b1=mk('button','',L2('Бросок монет (прошёл 1 период T½)','Тиын лақтыру (1 период T½ өтті)')),b2=mk('button','',L2('Заново','Қайтадан'));bar.append(b1,b2);b1.onclick=step;b2.onclick=reset;
  const chb=mk('div','tabs'),ba=mk('button','','α'),bb=mk('button','','β⁻'),br=mk('button','',L2('сброс','қайта'));chb.append(ba,bb,br);
  const sym=(z,a)=>`${sup(a)}${sub(z)}${SYM[z]||'?'}`;
  const rc=()=>{chain=[[92,238]];Z=92;A=238;eqd()};
  const eqd=()=>{eq.innerHTML=`<div class="ans" style="font-size:1.1em">${L2('Цепочка распада','Ыдырау тізбегі')}: ${chain.map(c=>sym(c[0],c[1])).join(' → ')}</div><div class="meta" style="font-size:.8em">α: A − 4, Z − 2 · β⁻: A та же, Z + 1 · ${L2('закон сохранения заряда и числа нуклонов','заряд пен нуклон санының сақталу заңы')}</div>`};
  ba.onclick=()=>{if(Z>80){Z-=2;A-=4;chain.push([Z,A]);eqd()}};bb.onclick=()=>{if(Z<92){Z+=1;chain.push([Z,A]);eqd()}};br.onclick=rc;
  host.append(bar,sv,out,mk('h2','',L2('Уравнение ядерного распада: начните с урана-238','Ядролық ыдырау теңдеуі: уран-238-ден бастаңыз')),chb,eq);rc();
  function draw(){let s='';for(let i=0;i<N0;i++){const r=Math.floor(i/16),cc=i%16;s+=`<circle cx="${24+cc*17}" cy="${20+r*17}" r="6.5" class="${alive[i]?'f1':'gr'}" ${alive[i]?'':'stroke-dasharray="3 2"'}/>`}
    const x0=330,x1=620,y0=16,y1=150;s+=AX(x0,x1,y0,y1);let p=[];for(let t=0;t<=7;t+=.1)p.push([x0+(x1-x0)*t/7,y1-(y1-y0)*Math.pow(.5,t)]);s+=pl(p,'s2 dash');hist.forEach((h,t)=>{s+=`<circle cx="${x0+(x1-x0)*t/7}" cy="${y1-(y1-y0)*h/N0}" r="5" class="f3"/>`});
    for(let t=0;t<=7;t++)s+=`<text x="${x0+(x1-x0)*t/7}" y="${y1+14}" text-anchor="middle" class="t3">${t}</text>`;s+=`<text x="${x1}" y="${y1+30}" text-anchor="end" class="t2">t / T½</text><text x="${x0+4}" y="${y0-3}" class="t2">N</text>`;
    sv.innerHTML=S(640,185,s);const t=hist.length-1;out.innerHTML=`<span>t = ${t}·T½</span><span>N = <b>${hist[t]}</b> (${L2('опыт','тәжірибе')})</span><span>N = N₀·2<sup>−t/T½</sup> = <b>${fmt(N0*Math.pow(.5,t),1)}</b> (${L2('закон','заң')})</span>`}
  reset()};

        if(pass>0)s+=arrow(350,y,350+Math.max(40,260*pass),y,r[1]==='f3'?'s3':r[1]==='f2'?'s2':'s1',2.4);s+=`<text x="${360+ (pass>0?260*pass:0)}" y="${y+5}" class="t2">${pass>0?fmt(pass*100,0)+' %':L2('остановлено','тоқтады')}</text>`});
      sv.innerHTML=S(640,260,s);out.innerHTML=`<span>${L2('Поглотитель','Жұтқыш')}: <b>${L2(...AB[ab][0])}</b></span><span>α — ${L2('лист бумаги','қағаз парағы')}; β — ${L2('алюминий','алюминий')}; γ — ${L2('свинец, бетон','қорғасын, бетон')}</span>`}

      s+=`<text x="20" y="90" class="t2">${L2('Доза за время работы','Жұмыс уақытындағы доза')}: <tspan style="font-size:24px;font-weight:800">${fmt(D,D<10?2:0)} ${L2('мкЗв','мкЗв')}</tspan></text>`;
      s+=`<rect x="20" y="110" width="600" height="22" rx="6" class="fl"/><rect x="20" y="110" width="${Math.min(600,Math.log10(1+D)/3*600)}" height="22" rx="6" class="${D<10?'f1':D<200?'f2':'f3'}"/>`;

const DATA={"lessons":[{"n":1,"q":1,"sec":"1A","topic":["Механическое движение. Векторы и действия над ними, проекция вектора на координатные оси","Механикалық қозғалыс. Векторлар және оларға амалдар қолдану. Вектордың координаталар осьтеріндегі проекциялары"],"goals":[["объяснят на примерах понятия «материальная точка», «система отсчёта», «относительность движения»;","выполнят сложение и вычитание векторов и найдут проекции вектора на оси;","решат задачу на сложение векторов и проекции, оформив решение по алгоритму."],["материялық нүкте, санақ жүйесі, қозғалыстың салыстырмалылығы ұғымдарын мысалдармен түсіндіреді;","векторларды қосу, азайту амалдарын орындап, вектордың осьтердегі проекцияларын табады;","векторларды қосуға және проекцияға есепті алгоритм бойынша шығарады."]],"hook":["Пассажир в поезде спокойно сидит, а для наблюдателя на перроне он мчится со скоростью 20 м/с. Кто прав?","Пойызда отырған жолаушы тыныш отыр, ал перрондағы бақылаушы үшін ол 20 м/с жылдамдықпен жүріп барады. Кім дұрыс?"],"qs":[["Что такое тело отсчёта и зачем оно нужно?","Можно ли считать самолёт материальной точкой при перелёте Астана – Павлодар? А при посадке?","Как задать положение точки на плоскости?"],["Санақ денесі деген не және ол не үшін қажет?","Астана – Павлодар рейсінде ұшақты материялық нүкте деп санауға бола ма? Қонған кезде ше?","Нүктенің жазықтықтағы орнын қалай беруге болады?"]],"explore":["Группы получают клетчатое поле с маршрутом «корпус – столовая – спортзал» из трёх векторов перемещения. Строят суммарный вектор правилом многоугольника, измеряют его модуль и проекции на оси X и Y (по желанию – проверка в симуляции PhET «Векторы»).","Топтар «оқу корпусы – асхана – спортзал» бағытындағы үш орын ауыстыру векторы салынған торлы өрісті алады. Көпбұрыш ережесімен қосынды векторды салады, оның модулін және X пен Y осьтеріндегі проекцияларын өлшейді (қалауы бойынша PhET «Векторлар» симуляциясында тексереді)."],"find":["модуль суммы векторов не равен сумме модулей; проекция зависит от направления оси","векторлар қосындысының модулі модульдер қосындысына тең емес; проекция ось бағытына тәуелді"],"key":["Сумма векторов находится по правилу треугольника/многоугольника; проекция a_x = a·cosα, a_y = a·sinα; относительность движения: движение зависит от выбора системы отсчёта.","Векторлардың қосындысы үшбұрыш/көпбұрыш ережесімен табылады; проекция a_x = a·cosα, a_y = a·sinα; қозғалыс санақ жүйесін таңдауға тәуелді."],"life":["навигация, маршрут по карте, движение пассажира в транспорте","навигация, картадағы бағыт, көліктегі жолаушының қозғалысы"],"res":["клетчатые поля с маршрутом, линейки, транспортиры, PhET «Векторы»","маршруты бар торлы өрістер, сызғыштар, транспортирлер, PhET «Векторлар»"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Вектор a = 3 ед. направлен вдоль оси X, вектор b = 4 ед. – вдоль оси Y. Найдите модуль суммы a + b.","a векторы 3 бірлік X осі бойымен, b векторы 4 бірлік Y осі бойымен бағытталған. a + b қосындысының модулін табыңыз."],"h":["Опора: нарисуйте векторы под прямым углом, используйте теорему Пифагора.","Тірек: векторларды тік бұрыш жасай сызып, Пифагор теоремасын қолданыңыз."],"a":["|a + b| = √(3² + 4²) = 5 ед.","|a + b| = √(3² + 4²) = 5 бірлік"]},{"t":["Мальчик прошёл 6 м на восток, затем 8 м на север. Найдите путь и модуль перемещения.","Бала шығысқа қарай 6 м, содан кейін солтүстікке қарай 8 м жүрді. Жолды және орын ауыстыру модулін табыңыз."],"h":["Подсказка: путь – сумма длин участков, перемещение – вектор из начала в конец.","Кеңес: жол – учаскелер ұзындықтарының қосындысы, орын ауыстыру – бастан соңға жүргізілген вектор."],"a":["Путь 14 м; перемещение √(36 + 64) = 10 м","Жол 14 м; орын ауыстыру √(36 + 64) = 10 м"]},{"t":["Вектор a модулем 10 ед. направлен под углом 30° к оси X. Найдите проекции a_x и a_y.","Модулі 10 бірлік a векторы X осіне 30° бұрышпен бағытталған. a_x және a_y проекцияларын табыңыз."],"h":["Без подсказок. Сделайте рисунок.","Кеңессіз. Сызба жасаңыз."],"a":["a_x = 10·cos30° ≈ 8,7 ед.; a_y = 10·sin30° = 5 ед.","a_x = 10·cos30° ≈ 8,7 бірлік; a_y = 10·sin30° = 5 бірлік"]}]},{"n":2,"q":1,"sec":"1A","topic":["Прямолинейное равнопеременное движение, ускорение. Скорость и перемещение при равноускоренном движении","Түзусызықты теңайнымалы қозғалыс, үдеу. Түзусызықты теңайнымалы қозғалыс кезіндегі жылдамдық және орын ауыстыру"],"goals":[["определят по графику v(t) ускорение и перемещение;","запишут формулы скорости и перемещения при равноускоренном движении;","применят формулы при решении задач не менее чем на 3 из 4 дескрипторов."],["v(t) графигі бойынша үдеу мен орын ауыстыруды анықтайды;","теңүдемелі қозғалыстағы жылдамдық пен орын ауыстыру формулаларын жазады;","формулаларды есеп шығаруда 4 дескриптордың кемінде 3-еуі бойынша қолданады."]],"hook":["Спортивный автомобиль разгоняется до 100 км/ч за 5 секунд. Как это «измерить» одним числом?","Спорткөлік 5 секундта 100 км/сағ жылдамдыққа дейін үдейді. Мұны бір санмен қалай «өлшеуге» болады?"],"qs":[["Чем отличается равномерное движение от равноускоренного?","Что показывает наклон графика скорости?","Как найти путь по графику скорости?"],["Бірқалыпты қозғалыс теңүдемелі қозғалыстан несімен ерекшеленеді?","Жылдамдық графигінің көлбеулігі нені көрсетеді?","Жылдамдық графигі бойынша жолды қалай табуға болады?"]],"explore":["Каждая группа получает три карточки с графиками v(t) разных движений (разгон, торможение, равномерное). По наклону находят ускорение, по площади под графиком – перемещение; результаты проверяют в симуляции PhET «Человечек» (The Moving Man).","Әр топ әртүрлі қозғалыстардың (үдеу, тежелу, бірқалыпты) v(t) графиктері бар үш картаны алады. Көлбеуі бойынша үдеуді, график астындағы аудан бойынша орын ауыстыруды табады; нәтижені PhET «Қозғалыстағы адам» (The Moving Man) симуляциясында тексереді."],"find":["ускорение – наклон графика v(t), перемещение – площадь под графиком","үдеу – v(t) графигінің көлбеуі, орын ауыстыру – график астындағы аудан"],"key":["a = (v − v₀)/t; v = v₀ + at; s = v₀t + at²/2.","a = (v − v₀)/t; v = v₀ + at; s = v₀t + at²/2."],"life":["разгон и торможение транспорта, лифт, метро","көліктің үдеуі мен тежелуі, лифт, метро"],"res":["карточки с графиками, PhET «Человечек», линейки","графиктері бар карталар, PhET «Қозғалыстағы адам», сызғыштар"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Тело начинает движение из состояния покоя с ускорением 2 м/с². Найдите скорость через 5 с.","Дене тыныштық күйден 2 м/с² үдеумен қозғала бастады. 5 с кейінгі жылдамдықты табыңыз."],"h":["Алгоритм: Дано → v = v₀ + at → подстановка → ответ.","Алгоритм: Берілгені → v = v₀ + at → қою → жауап."],"a":["v = 0 + 2·5 = 10 м/с","v = 0 + 2·5 = 10 м/с"]},{"t":["Автомобиль, имея скорость 10 м/с, разгоняется с ускорением 0,5 м/с² в течение 20 с. Найдите конечную скорость и перемещение.","Жылдамдығы 10 м/с автокөлік 20 с бойы 0,5 м/с² үдеумен үдейді. Соңғы жылдамдықты және орын ауыстыруды табыңыз."],"h":["Подсказка: сначала v, затем s = v₀t + at²/2.","Кеңес: алдымен v, одан кейін s = v₀t + at²/2."],"a":["v = 20 м/с; s = 10·20 + 0,5·400/2 = 300 м","v = 20 м/с; s = 10·20 + 0,5·400/2 = 300 м"]},{"t":["Поезд, двигаясь со скоростью 20 м/с, тормозит и останавливается за 5 с. Найдите ускорение и тормозной путь.","20 м/с жылдамдықпен келе жатқан пойыз тежеліп, 5 с-та тоқтайды. Үдеуді және тежелу жолын табыңыз."],"h":["Без подсказок. Учтите знак ускорения.","Кеңессіз. Үдеу таңбасын ескеріңіз."],"a":["a = (0 − 20)/5 = −4 м/с²; s = (20 + 0)/2·5 = 50 м","a = (0 − 20)/5 = −4 м/с²; s = (20 + 0)/2·5 = 50 м"]}]},{"n":3,"q":1,"sec":"1A","lab":1,"topic":["Лабораторная работа №1 «Определение ускорения тела при равноускоренном движении»","Зертханалық жұмыс №1 «Теңүдемелі қозғалыс кезіндегі дененің үдеуін анықтау»"],"goals":[["экспериментально определят ускорение тела, скатывающегося по наклонной плоскости, по формуле a = 2s/t²;","построят и объяснят график зависимости перемещения от квадрата времени;","проанализируют факторы, влияющие на результат, и предложат способы улучшения опыта."],["көлбеу жазықтықпен домалайтын дененің үдеуін a = 2s/t² формуласы бойынша тәжірибе жүзінде анықтайды;","орын ауыстырудың уақыт квадратына тәуелділік графигін тұрғызып, түсіндіреді;","нәтижеге әсер ететін факторларды талдап, тәжірибені жақсарту жолдарын ұсынады."]],"hook":["Шарик скатывается с горки всё быстрее. А можно ли узнать его ускорение, имея только линейку и секундомер?","Шарик төбешіктен барған сайын тез домалайды. Тек сызғыш пен секундомер арқылы оның үдеуін білуге бола ма?"],"qs":[["По какой формуле находят перемещение при равноускоренном движении из состояния покоя?","Какие приборы нужны для измерения s и t?","Какие причины могут исказить результат?"],["Тыныштық күйден теңүдемелі қозғалғанда орын ауыстыру қай формуламен табылады?","s және t өлшеуге қандай құралдар қажет?","Нәтижені қандай себептер бұрмалауы мүмкін?"]],"explore":["Роли: экспериментатор, хронометрист, регистратор, аналитик. Группа собирает наклонный желоб, измеряет время скатывания шарика (тележки) на 4 разных расстояниях s (по 3 замера), вычисляет a = 2s/t² и среднее значение. По желанию – проверка в симуляции. Педагог показывает первый замер («Я делаю»), затем группы работают по карте-подсказке.","Рөлдер: тәжірибеші, хронометршы, тіркеуші, талдаушы. Топ көлбеу науаны жинап, шариктің (арбаның) 4 түрлі s қашықтығындағы домалау уақытын өлшейді (әрқайсысында 3 өлшем), a = 2s/t² есептеп, орташа мәнін табады. Қалауы бойынша симуляциямен тексереді. Педагог бірінші өлшемді көрсетеді («Мен істеймін»), одан кейін топтар тірек картасымен жұмыс істейді."],"find":["s прямо пропорционально t²; ускорение постоянно и зависит от угла наклона","s мен t² тура пропорционал; үдеу тұрақты және көлбеу бұрышына тәуелді"],"key":["a = 2s/t²; график s(t²) – прямая, наклон равен a/2.","a = 2s/t²; s(t²) графигі – түзу, көлбеуі a/2-ге тең."],"life":["скатывание грузов, горнолыжный спуск, аттракцион «горка»","жүктің сырғуы, тау шаңғысымен түсу, «төбешік» аттракционы"],"res":["наклонный желоб, шарик/тележка, секундомер, измерительная лента, штатив","көлбеу науа, шарик/арба, секундомер, өлшеуіш лента, штатив"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Шарик прошёл по желобу s = 1 м за t = 2 с из состояния покоя. Найдите ускорение.","Шарик тыныштық күйден науамен s = 1 м жолды t = 2 с-та өтті. Үдеуін табыңыз."],"h":["Алгоритм: a = 2s/t² → подстановка → ответ.","Алгоритм: a = 2s/t² → қою → жауап."],"a":["a = 2·1/4 = 0,5 м/с²","a = 2·1/4 = 0,5 м/с²"]},{"t":["По результатам опыта s = 0,8 м, среднее время t = 1,6 с. Найдите a и сравните с ожидаемым значением 0,6 м/с².","Тәжірибе нәтижесі бойынша s = 0,8 м, орташа уақыт t = 1,6 с. a-ны табып, күтілетін 0,6 м/с² мәнімен салыстырыңыз."],"h":["Подсказка: найдите a и относительную разницу.","Кеңес: a-ны және салыстырмалы айырмашылықты табыңыз."],"a":["a = 2·0,8/2,56 ≈ 0,63 м/с²; отличие ≈ 4 %","a = 2·0,8/2,56 ≈ 0,63 м/с²; айырмашылығы ≈ 4 %"]},{"t":["График зависимости s от t² – прямая через точки (0; 0) и (4 с²; 2 м). Найдите ускорение. Назовите две причины погрешности.","s-тің t²-қа тәуелділік графигі – (0; 0) және (4 с²; 2 м) нүктелері арқылы өтетін түзу. Үдеуді табыңыз. Қателіктің екі себебін атаңыз."],"h":["Без подсказок.","Кеңессіз."],"a":["Наклон = 0,5 = a/2 → a = 1 м/с². Причины: реакция при включении секундомера, трение, неточность измерения s","Көлбеуі = 0,5 = a/2 → a = 1 м/с². Себептері: секундомерді қосу реакциясы, үйкеліс, s өлшеу дәлсіздігі"]}]},{"n":4,"q":1,"sec":"1A","lab":1,"topic":["Свободное падение тел, ускорение свободного падения. Лабораторная работа №2 «Изучение движения тела, брошенного горизонтально»","Дененің еркін түсуі, еркін түсу үдеуі. Зертханалық жұмыс №2 «Горизонталь лақтырылған дененің қозғалысын зерделеу»"],"goals":[["опишут свободное падение с помощью кинематических уравнений;","определят дальность полёта и начальную скорость тела, брошенного горизонтально, и построят траекторию;","применят уравнения для решения задач не менее чем на 3 из 4 дескрипторов."],["еркін түсуді теңайнымалы қозғалыстың кинематикалық теңдеулерімен сипаттайды;","горизонталь лақтырылған дененің ұшу қашықтығын, бастапқы жылдамдығын анықтап, траекториясын салады;","теңдеулерді есеп шығаруда 4 дескриптордың кемінде 3-еуі бойынша қолданады."]],"hook":["Одновременно роняем мяч и бросаем горизонтально второй. Какой упадёт раньше?","Бір мезгілде бір добты тастап, екіншісін горизонталь лақтырамыз. Қайсысы бұрын түседі?"],"qs":[["Какое ускорение имеют тела при свободном падении?","Из каких двух движений складывается бросок горизонтально?","От чего зависит время падения?"],["Еркін түсу кезінде денелердің үдеуі қандай?","Горизонталь лақтыру қандай екі қозғалыстан құралады?","Түсу уақыты неге тәуелді?"]],"explore":["Группы запускают шарик по желобу со стола (высота h), измеряют дальность l падения на лист копировальной бумаги, вычисляют время падения t = √(2h/g) и начальную скорость v₀ = l/t. Строят траекторию по точкам (или проверяют в симуляции PhET «Движение снаряда»).","Топтар шарикті үстел жиегінен науамен жібереді (биіктік h), көшірме қағазға түсу қашықтығын l өлшейді, түсу уақытын t = √(2h/g) және бастапқы жылдамдықты v₀ = l/t есептейді. Траекторияны нүктелер бойынша салады (немесе PhET «Снаряд қозғалысы» симуляциясында тексереді)."],"find":["время падения не зависит от v₀; по горизонтали движение равномерное, по вертикали – равноускоренное","түсу уақыты v₀-ге тәуелсіз; горизонталь бойынша қозғалыс бірқалыпты, вертикаль бойынша – теңүдемелі"],"key":["h = gt²/2; l = v₀t; v = √(v₀² + (gt)²); траектория – парабола.","h = gt²/2; l = v₀t; v = √(v₀² + (gt)²); траектория – парабола."],"life":["струя воды из шланга, бросок мяча, падение груза с вертолёта","түтіктен ағатын су ағыны, доп лақтыру, тікұшақтан жүк тастау"],"res":["желоб, шарик, копировальная бумага, линейка, PhET «Движение снаряда»","науа, шарик, көшірме қағаз, сызғыш, PhET «Снаряд қозғалысы»"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Тело падает с высоты 20 м б plore":["Станции опытов: 1) монета на карточке над стаканом – резкий щелчок; 2) тележка с грузом и без груза на столе, резкий и плавный рывок нити; 3) шарик на столе в движущейся тележке (симуляция/видео). Группы фиксируют наблюдения и формулируют, при каких условиях скорость тела не меняется.","Тәжірибе станциялары: 1) стақан үстіндегі карточкадағы теңге – күрт шертпе; 2) үстелдегі жүгі бар және жүгі жоқ арба, жіпті күрт және баяу тарту; 3) қозғалыстағы арбадағы шарик (симуляция/бейне). Топтар бақылауларды жазып, дене жылдамдығы қандай жағдайда өзгермейтінін тұжырымдайды."],"find":["при отсутствии внешних воздействий (или их компенсации) скорость тела не меняется; чем больше масса, тем сильнее инертность","сыртқы әсер болмағанда (немесе олар теңестірілгенде) дене жылдамдығы өзгермейді; масса неғұрлым үлкен болса, инерттілік соғұрлым күшті"],"key":["Существуют системы отсчёта (инерциальные), в которых тело сохраняет покой или равномерное прямолинейное движение, если действия других тел скомпенсированы.","Басқа денелердің әсері теңестірілсе, дене тыныштықта немесе түзусызықты бірқалыпты қозғалыста болатын санақ жүйелері (инерциялық) бар."],"life":["ремни безопасности, поворот транспорта, перевозка рояля и инструментов","қауіпсіздік белдігі, көліктің бұрылуы, рояль мен аспаптарды тасымалдау"],"res":["карточки, монеты, стаканы, тележки, грузы, видеоролик","карточкалар, теңгелер, стақандар, арбалар, жүктер, бейнеролик"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Автомобиль едет равномерно по прямой. Сила тяги двигателя 800 Н. Чему равна сила сопротивления?","Автокөлік түзу бойымен бірқалыпты қозғалады. Қозғалтқыш тарту күші 800 Н. Кедергі күші неге тең?"],"h":["Опора: равномерное движение → силы скомпенсированы.","Тірек: бірқалыпты қозғалыс → күштер теңестірілген."],"a":["800 Н","800 Н"]},{"t":["Какие системы отсчёта инерциальны: поезд, равномерно идущий по прямой; поезд на повороте?","Қандай санақ жүйелері инерциялық: түзу бойымен бірқалыпты жүрген пойыз; бұрылыстағы пойыз?"],"h":["Подсказка: есть ли ускорение у системы?","Кеңес: жүйенің үдеуі бар ма?"],"a":["Первая – инерциальна, вторая (на повороте) – нет","Біріншісі – инерциялық, екіншісі (бұрылыста) – жоқ"]},{"t":["Тело движется равномерно под действием трёх сил: F₁ = 3 Н на восток, F₂ = 4 Н на север и F₃. Найдите F₃ и её направление.","Дене F₁ = 3 Н шығысқа, F₂ = 4 Н солтүстікке және F₃ үш күштің әсерінен бірқалыпты қозғалады. F₃ мәнін және бағытын табыңыз."],"h":["Без подсказок. Сделайте рисунок.","Кеңессіз. Сызба жасаңыз."],"a":["F₃ = 5 Н, направлена на юго-запад (противоположно равнодействующей F₁ и F₂)","F₃ = 5 Н, оңтүстік-батысқа қарай (F₁ мен F₂ тең әсерлі күшіне қарама-қарсы)"]}]},{"n":10,"q":2,"sec":"2A","topic":["Силы в механике","Механикадағы күштер"],"goals":[["объяснят природу силы тяжести, силы упругости и силы трения;","определят силы по формулам F = mg, F = kx, F = μN;","решат задачи на силы в механике в 3 из 4 заданий."],["ауырлық күшінің, серпімділік күшінің және үйкеліс күшінің табиғатын түсіндіреді;","күштерді F = mg, F = kx, F = μN формулаларымен анықтайды;","механикадағы күштерге есептерді 4 тапсырманың 3-еуінде шығарады."]],"hook":["Почему гвоздь трудно вытащить из доски, а лыжи скользят легко? О каких силах идёт речь?","Шегені тақтайдан неге қиын суырады, ал шаңғы неге оңай сырғиды? Бұл қандай күштер?"],"qs":[["Какие виды сил вы знаете?","Что общего у силы упругости и силы трения?","В чём отличие массы от силы тяжести?"],["Қандай күш түрлерін білесіздер?","Серпімділік күші мен үйкеліс күшінің ортақтығы неде?","Массаның ауырлық күшінен айырмашылығы неде?"]],"explore":["Станции: 1) пружина и грузы – измеряют удлинение x при разных F и находят жёсткость k; 2) брусок на динамометре – определяют силу трения скольжения на разных поверхностях и при разной массе; 3) груз на динамометре – сравнивают mg и показание. Результаты фиксируют в таблице, строят график F(x).","Станциялар: 1) серіппе мен жүктер – әртүрлі F кезінде ұзаруды x өлшеп, қатаңдықты k табады; 2) динамометрдегі білеуше – әртүрлі беттер мен массада сырғанау үйкеліс күшін анықтайды; 3) динамометрдегі жүк – mg пен көрсеткішті салыстырады. Нәтижені кестеге жазып, F(x) графигін салады."],"find":["F_упр пропорциональна удлинению; F_тр пропорциональна силе нормальной реакции; F_т пропорциональна массе","F_серп ұзаруға пропорционал; F_үйк нормаль реакция күшіне пропорционал; F_ауыр массаға пропорционал"],"key":["F_т = mg; F_упр = kx (закон Гука); F_тр = μN.","F_ауыр = mg; F_серп = kx (Гук заңы); F_үйк = μN."],"life":["пружины в инструментах и амортизаторах, тормоза, обувь и лыжи","аспаптар мен амортизаторлардағы серіппелер, тежегіштер, аяқкиім мен шаңғы"],"res":["пружины, динамометры, бруски, набор грузов, линейки","серіппелер, динамометрлер, білеушелер, жүктер жиынтығы, сызғыштар"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Найдите силу тяжести, действующую на тело массой 3 кг (g = 10 м/с²).","Массасы 3 кг денеге әсер ететін ауырлық күшін табыңыз (g = 10 м/с²)."],"h":["Алгоритм: F = mg.","Алгоритм: F = mg."],"a":["F = 30 Н","F = 30 Н"]},{"t":["Пружину жёсткостью 200 Н/м растянули на 5 см. Найдите силу упругости.","Қатаңдығы 200 Н/м серіппені 5 см-ге созды. Серпімділік күшін табыңыз."],"h":["Подсказка: переведите 5 см в метры.","Кеңес: 5 см-ді метрге аударыңыз."],"a":["F = 200·0,05 = 10 Н","F = 200·0,05 = 10 Н"]},{"t":["Брусок массой 2 кг равномерно тянут по столу, μ = 0,3. Найдите силу трения и необходимую горизонтальную силу.","Массасы 2 кг білеушені үстелмен бірқалыпты тартады, μ = 0,3. Үйкеліс күшін және қажет көлденең күшті табыңыз."],"h":["Без подсказок.","Кеңессіз."],"a":["F_тр = 0,3·2·10 = 6 Н; тянуть нужно с F = 6 Н","F_үйк = 0,3·2·10 = 6 Н; тарту күші F = 6 Н"]}]},{"n":11,"q":2,"sec":"2A","topic":["Второй закон Ньютона. Масса","Ньютонның екінші заңы. Масса"],"goals":[["сформулируют второй закон Ньютона и запишут его формулой a = ΣF/m;","по данным эксперимента в симуляции установят зависимость ускорения от силы (m = const) и от массы (F = const);","применят закон при решении задач выбранного уровня, выразив результат в единицах СИ, не менее чем на 3 из 4 дескрипторов."],["Ньютонның екінші заңын тұжырымдап, a = ΣF/m формуласымен жазады;","симуляциядағы тәжірибе деректері бойынша үдеудің күшке (m = const) және массаға (F = const) тәуелділігін анықтайды;","заңды таңдалған деңгейдегі есептерді шығаруда қолданып, нәтижені СИ бірліктерімен көрсетеді (4 дескриптордың кемінде 3-еуі бойынша)."]],"hook":["Грузчики двигают рояль и несут скрипку. Одну и ту же силу прикладываем к лёгкому и тяжёлому предмету. Что изменится?","Жүк тасушылар роялді жылжытып, скрипканы көтеріп барады. Жеңіл және ауыр затқа бірдей күш түсіреміз. Не өзгереді?"],"qs":[["Что такое инерция и чем измеряется инертность тела?","Как, по-вашему, изменится ускорение, если силу увеличить вдвое?","Почему гружёную тележку разогнать труднее, чем пустую?"],["Инерция деген не және дененің инерттілігі немен өлшенеді?","Күшті екі есе арттырсақ, үдеу қалай өзгереді деп ойлайсыз?","Жүк тиелген арбаны босқа қарағанда үдету неге қиын?"]],"explore":["Роли: экспериментатор (управляет симуляцией), регистратор, аналитик, спикер. Симуляция PhET «Силы и движение: основы» (трение отключено). Опыт 1: m = const, F = 50; 100; 150; 200 Н – измеряют a. Опыт 2: F = const, масса меняется – измеряют a. Вычисляют F/a и a·m. Педагог показывает первое измерение («Я делаю»).","Рөлдер: тәжірибеші (симуляцияны басқарады), тіркеуші, талдаушы, спикер. PhET «Күштер мен қозғалыс: негіздер» симуляциясы (үйкеліс өшірілген). 1-тәжірибе: m = const, F = 50; 100; 150; 200 Н – a өлшейді. 2-тәжірибе: F = const, масса өзгереді – a өлшейді. F/a және a·m есептейді. Педагог бірінші өлшемді көрсетеді («Мен істеймін»)."],"find":["a пропорционально F и обратно пропорционально m","a F-ке тура пропорционал және m-ге кері пропорционал"],"key":["Ускорение тела прямо пропорционально равнодействующей сил и обратно пропорционально массе: a = ΣF/m; 1 Н = 1 кг·м/с²; направление a совпадает с направлением ΣF.","Дененің үдеуі тең әсерлі күшке тура пропорционал, массаға кері пропорционал: a = ΣF/m; 1 Н = 1 кг·м/с²; a бағыты ΣF бағытымен бағыттас."],"life":["разгон автомобиля и лифта, спорт; почему рояль сдвинуть труднее, чем скрипку","көлік пен лифттің үдеуі, спорт; роялді сырғыту скрипкадан неге қиын"],"res":["ноутбуки/планшеты, PhET «Силы и движение: основы», карты-подсказки А/Б/В","ноутбуктер/планшеттер, PhET «Күштер мен қозғалыс: негіздер», А/Б/В тірек карталары"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Тело массой 2 кг движется под действием силы 10 Н. Найдите ускорение.","Массасы 2 кг дене 10 Н күштің әсерінен қозғалады. Үдеуін табыңыз."],"h":["Алгоритм: Дано → a = F/m → подстановка → ответ.","Алгоритм: Берілгені → a = F/m → қою → жауап."],"a":["a = 10/2 = 5 м/с²","a = 10/2 = 5 м/с²"]},{"t":["Автомобиль массой 1 т, трогаясь с места, за 10 с набирает скорость 20 м/с. Найдите равнодействующую силу.","Массасы 1 т автокөлік орнынан қозғалып, 10 с-та 20 м/с жылдамдыққа жетеді. Тең әсерлі күшті табыңыз."],"h":["Подсказка: a = (v − v₀)/t; F = ma; массу в кг.","Кеңес: a = (v − v₀)/t; F = ma; массаны кг-ға аударыңыз."],"a":["a = 2 м/с²; F = 2000 Н","a = 2 м/с²; F = 2000 Н"]},{"t":["Брусок массой 5 кг тянут по горизонтали силой 30 Н, сила трения 10 Н. Найдите ускорение, скорость через 4 с и путь за это время.","Массасы 5 кг білеушені көлденең 30 Н күшпен тартады, үйкеліс күші 10 Н. Үдеуін, 4 с кейінгі жылдамдығын және осы уақыттағы жолын табыңыз."],"h":["Без подсказок. Сделайте рисунок сил.","Кеңессіз. Күштер сызбасын салыңыз."],"a":["ΣF = 20 Н; a = 4 м/с²; v = 16 м/с; s = 32 м","ΣF = 20 Н; a = 4 м/с²; v = 16 м/с; s = 32 м"]}]},{"n":12,"q":2,"sec":"2A","sop":"СОР №3","topic":["Третий закон Ньютона","Ньютонның үшінші заңы"],"goals":[["сформулируют третий закон Ньютона и назовут свойства сил взаимодействия;","на опыте с динамометрами докажут равенство сил действия и противодействия;","применят закон при решении задач в 3 из 4 заданий."],["Ньютонның үшінші заңын тұжырымдап, әрекеттесу күштерінің қасиеттерін атайды;","динамометрлермен тәжірибеде әрекет пен қарсы әрекет күштерінің теңдігін дәлелдейді;","заңды есеп шығаруда 4 тапсырманың 3-еуінде қолданады."]],"hook":["Конькобежцы толкают друг друга и разъезжаются в разные стороны. Почему «отъезжает» и тот, кто толкал?","Сырғанақшылар бірін-бірі итеріп, әртүрлі жаққа кетеді. Итерген адам да неге кері кетеді?"],"qs":[["Что такое взаимодействие тел?","Приложены ли силы взаимодействия к одному телу?","Почему при ударе ногой по мячу больно и ноге?"],["Денелердің әрекеттесуі деген не?","Әрекеттесу күштері бір денеге түсірілген бе?","Допты теуіп қалғанда аяқ неге ауырады?"]],"explore":["Пары динамометров: два динамометра сцепляют крючками, один тянут, второй держат (затем оба движутся); записывают показания. Тележки с пружиной-«стреляющей»: сравнивают пути разъезда при разных массах. Вывод записывают в таблице «Что одинаково / что различно» для сил F₁₂ и F₂₁.","Динамометр жұптары: екі динамометрді ілмектерімен ілестіреді, біреуін тартып, екіншісін ұстайды (сонан соң екеуі де қозғалады); көрсеткіштерді жазады. «Атылатын» серіппелі арбалар: әртүрлі массада алшақтау жолдарын салыстырады. Қорытындыны F₁₂ және F₂₁ күштері үшін «Не бірдей / не әртүрлі» кестесіне жазады."],"find":["силы равны по модулю, противоположны по направлению, одной природы и приложены к разным телам","күштер модулі бойынша тең, бағыты қарама-қарсы, табиғаты бірдей және әртүрлі денелерге түсірілген"],"key":["F₁₂ = −F₂₁; силы действия и противодействия не уравновешивают друг друга, так как приложены к разным телам.","F₁₂ = −F₂₁; әрекет және қарсы әрекет күштері әртүрлі денелерге түсірілгендіктен бірін-бірі теңестірмейді."],"life":["отдача при выстреле, плавание, ходьба, ракеты","оқ атқандағы кері тебу, жүзу, жүру, зымырандар"],"res":["динамометры, тележки, пружины, таблицы для записи","динамометрлер, арбалар, серіппелер, жазу кестелері"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Земля притягивает яблоко с силой 2 Н. С какой силой яблоко притягивает Землю?","Жер алманы 2 Н күшпен тартады. Алма Жерді қандай күшпен тартады?"],"h":["Опора: третий закон Ньютона.","Тірек: Ньютонның үшінші заңы."],"a":["2 Н","2 Н"]},{"t":["Два конькобежца массами 50 кг и 70 кг отталкиваются. Ускорение первого 1,4 м/с². Найдите ускорение второго.","Массалары 50 кг және 70 кг екі сырғанақшы бірін-бірі итереді. Біріншісінің үдеуі 1,4 м/с². Екіншісінің үдеуін табыңыз."],"h":["Подсказка: F = m₁a₁; a₂ = F/m₂.","Кеңес: F = m₁a₁; a₂ = F/m₂."],"a":["F = 70 Н; a₂ = 1 м/с²","F = 70 Н; a₂ = 1 м/с²"]},{"t":["Бруски массами 2 кг и 3 кг лежат на гладком столе. К первому приложена сила 10 Н, он толкает второй. Найдите ускорение и силу, с которой первый действует на второй.","Массалары 2 кг және 3 кг білеушелер тегіс үстелде жатыр. Біріншісіне 10 Н күш түсірілген, ол екіншісін итереді. Үдеуді және бірінші білеушенің екіншісіне әсер ету күшін табыңыз."],"h":["Без подсказок.","Кеңессіз."],"a":["a = 10/5 = 2 м/с²; F = 3·2 = 6 Н","a = 10/5 = 2 м/с²; F = 3·2 = 6 Н"]}]},{"n":13,"q":2,"sec":"2A","topic":["Закон всемирного тяготения","Бүкіләлемдік тартылыс заңы"],"goals":[["сформулируют закон всемирного тяготения и запишут формулу F = Gm₁m₂/r²;","установят в симуляции зависимость силы тяготения от масс и расстояния;","применят закон при решении задач в 3 из 4 заданий."],["бүкіләлемдік тартылыс заңын тұжырымдап, F = Gm₁m₂/r² формуласын жазады;","симуляцияда тартылыс күшінің массаларға және қашықтыққа тәуелділігін анықтайды;","заңды есеп шығаруда 4 тапсырманың 3-еуінде қолданады."]],"hook":["Почему Луна не падает на Землю и не улетает в космос?","Ай неге Жерге құламайды және ғарышқа ұшып кетпейді?"],"qs":[["Какая сила удерживает Луну на орбите?","Зависит ли сила тяжести от массы планеты?","Одинаково ли вы весите на Земле и на Луне?"],["Айды орбитада қандай күш ұстап тұр?","Ауырлық күші планета массасына тәуелді ме?","Жерде және Айда салмағыңыз бірдей ме?"]],"explore":["В симуляции PhET «Гравитационная сила» (Gravity Force Lab) группы меняют m₁, m₂ и расстояние r, записывают F: сначала при удвоении одной массы, затем при удвоении расстояния. Находят, как меняется F, и записывают вывод.","PhET «Тартылыс күші» (Gravity Force Lab) симуляциясында топтар m₁, m₂ және r қашықтығын өзгертіп, F мәнін жазады: алдымен бір массаны екі есе арттырғанда, содан кейін қашықтықты екі есе арттырғанда. F қалай өзгеретінін табады және қорытынды жазады."],"find":["F пропорциональна m₁m₂ и обратно пропорциональна r²","F m₁m₂-ге пропорционал және r²-қа кері пропорционал"],"key":["F = G·m₁m₂/r²; G = 6,67·10⁻¹¹ Н·м²/кг²; g = GM/R².","F = G·m₁m₂/r²; G = 6,67·10⁻¹¹ Н·м²/кг²; g = GM/R²."],"life":["приливы, спутники, вес на других планетах","толқын-тасқындар, серіктер, басқа планеталардағы салмақ"],"res":["ноутбуки/планшеты, PhET Gravity Force Lab, карты-подсказки","ноутбуктер/планшеттер, PhET Gravity Force Lab, тірек карталары"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Как изменится сила притяжения двух тел, если расстояние между ними увеличить вдвое?","Екі дененің арақашықтығын екі есе арттырса, тартылыс күші қалай өзгереді?"],"h":["Опора: F ~ 1/r².","Тірек: F ~ 1/r²."],"a":["Уменьшится в 4 раза","4 есе азаяды"]},{"t":["Два тела массой по 100 кг находятся на расстоянии 1 м. Найдите силу притяжения (G = 6,67·10⁻¹¹ Н·м²/кг²).","Массасы 100 кг екі дене бір-бірінен 1 м қашықтықта. Тартылыс күшін табыңыз (G = 6,67·10⁻¹¹ Н·м²/кг²)."],"h":["Подсказка: F = G·m₁m₂/r².","Кеңес: F = G·m₁m₂/r²."],"a":["F ≈ 6,7·10⁻⁷ Н","F ≈ 6,7·10⁻⁷ Н"]},{"t":["Во сколько раз ускорение свободного падения на высоте, равной радиусу Земли над поверхностью, меньше, чем у поверхности? Найдите его (g = 10 м/с²).","Жер бетінен Жер радиусына тең биіктікте еркін түсу үдеуі бетіндегіден неше есе аз? Оны табыңыз (g = 10 м/с²)."],"h":["Без подсказок. r = 2R.","Кеңессіз. r = 2R."],"a":["В 4 раза; g′ = 2,5 м/с²","4 есе; g′ = 2,5 м/с²"]}]},{"n":14,"q":2,"sec":"2A","topic":["Вес тела, невесомость","Дененің салмағы, салмақсыздық"],"goals":[["различат силу тяжести и вес тела;","определят вес тела, движущегося с ускорением;","объяснят состояние невесомости и решат задачи в 3 из 4 заданий."],["ауырлық күші мен дене салмағын ажыратады;","үдеумен қозғалатын дененің салмағын анықтайды;","салмақсыздық күйін түсіндіріп, есептерді 4 тапсырманың 3-еуінде шығарады."]],"hook":["В лифте, который резко поехал вверх, вы чувствуете себя «тяжелее», а при спуске – «легче». Что изменилось: масса или вес?","Лифт күрт жоғары көтерілгенде өзіңізді «ауыр», төмен түскенде «жеңіл» сезінесіз. Не өзгерді: масса ма, салмақ па?"],"qs":[["Чем вес отличается от силы тяжести?","К чему приложен вес тела?","Почему космонавты на орбите «парят»?"],["Салмақтың ауырлық күшінен айырмашылығы неде?","Дене салмағы неге түсірілген?","Ғарышкерлер орбитада неге «қалқиды»?"]],"explore":["Модель лифта: груз на динамометре (или смартфон с датчиком) поднимают и опускают сначала равномерно, затем с ускорением вверх и вниз; записывают показания и сравнивают с mg. Видео невесомости на МКС и «падающий» стаканчик с отверстием, из которого перестаёт течь вода.","Лифт моделі: динамометрдегі жүкті (немесе датчигі бар смартфонды) алдымен бірқалыпты, содан кейін жоғары және төмен үдеумен көтеріп-түсіреді; көрсеткіштерді жазып, mg-мен салыстырады. ХҒС-тағы салмақсыздық бейнесі және су ағуын тоқтататын тесігі бар «құлайтын» стақанша."],"find":["вес больше mg при ускорении вверх, меньше mg при ускорении вниз; при a = g вес равен нулю","жоғары үдеу кезінде салмақ mg-дан көп, төмен үдеу кезінде mg-дан аз; a = g болғанда салмақ нөлге тең"],"key":["P = m(g + a) при ускорении вверх; P = m(g − a) при ускорении вниз; при свободном падении P = 0 (невесомость).","P = m(g + a) жоғары үдеу кезінде; P = m(g − a) төмен үдеу кезінде; еркін түсу кезінде P = 0 (салмақсыздық)."],"life":["лифт, аттракционы, космические полёты, перегрузки","лифт, аттракциондар, ғарыш ұшулары, аса жүктемелер"],"res":["динамометры, грузы, смартфоны, видео, стаканчик с отверстием","динамометрлер, жүктер, смартфондар, бейне, тесігі бар стақанша"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Найдите вес человека массой 60 кг в покоящемся лифте (g = 10 м/с²).","Тыныш тұрған лифтідегі массасы 60 кг адамның салмағын табыңыз (g = 10 м/с²)."],"h":["Опора: P = mg.","Тірек: P = mg."],"a":["P = 600 Н","P = 600 Н"]},{"t":["Лифт поднимается с ускорением 2 м/с². Найдите вес человека массой 60 кг.","Лифт 2 м/с² үдеумен көтеріледі. Массасы 60 кг адамның салмағын табыңыз."],"h":["Подсказка: P = m(g + a).","Кеңес: P = m(g + a)."],"a":["P = 60·12 = 720 Н","P = 60·12 = 720 Н"]},{"t":["Лифт опускается с ускорением 2 м/с². Найдите вес того же человека. Чему равен вес при свободном падении лифта?","Лифт 2 м/с² үдеумен төмен түседі. Сол адамның салмағын табыңыз. Лифт еркін түскенде салмақ неге тең?"],"h":["Без подсказок.","Кеңессіз."],"a":["P = 60·8 = 480 Н; при свободном падении P = 0","P = 60·8 = 480 Н; еркін түскенде P = 0"]}]},{"n":15,"q":2,"sec":"2A","sop":"СОР №4","topic":["Движение тела под действием силы тяжести","Денелердің ауырлық күшінің әрекетінен қозғалуы"],"goals":[["опишут движение тела, брошенного вертикально и горизонтально, в поле тяжести;","рассчитают время, высоту и дальность полёта;","применят уравнения кинематики и законы Ньютона в 3 из 4 заданий."],["ауырлық өрісінде тік және горизонталь лақтырылған дененің қозғалысын сипаттайды;","ұшу уақытын, биіктігін және қашықтығын есептейді;","кинематика теңдеулері мен Ньютон заңдарын 4 тапсырманың 3-еуінде қолданады."]],"hook":["Мяч подбросили вверх. В верхней точке скорость равна нулю – значит, и ускорение нулевое?","Допты жоғары лақтырды. Жоғарғы нүктеде жылдамдық нөлге тең – демек, үдеу де нөл ме?"],"qs":[["С каким ускорением движется тело, брошенное вверх?","Что происходит со скоростью на подъёме и при спуске?","От чего зависит дальность полёта?"],["Жоғары лақтырылған дене қандай үдеумен қозғалады?","Көтерілгенде және түскенде жылдамдық қалай өзгереді?","Ұшу қашықтығы неге тәуелді?"]],"explore":["В симуляции PhET «Движение снаряда» группы запускают тело вертикально и под углом, фиксируют время подъёма, максимальную высоту и дальность при разных v₀ и углах. Сравнивают с расчётом по формулам и находят, при каком угле дальность максимальна (без сопротивления воздуха).","PhET «Снаряд қозғалысы» симуляциясында топтар денені тік және бұрыш жасай жібереді, әртүрлі v₀ мен бұрыштарда көтерілу уақытын, ең үлкен биіктік пен қашықтықты тіркейді. Формулалармен есептеуді салыстырып, қай бұрышта қашықтық ең үлкен болатынын анықтайды (ауа кедергісінсіз)."],"find":["ускорение всегда g и направлено вниз; время подъёма равно времени спуска; наибольшая дальность – при угле 45°","үдеу әрқашан g және төмен бағытталған; көтерілу уақыты түсу уақытына тең; ең үлкен қашықтық – 45° бұрышта"],"key":["Вверх: v = v₀ − gt; h_max = v₀²/2g; t_полёта = 2v₀/g. Горизонтально: l = v₀t, h = gt²/2.","Жоғары: v = v₀ − gt; h_max = v₀²/2g; t_ұшу = 2v₀/g. Горизонталь: l = v₀t, h = gt²/2."],"life":["спорт (баскетбол, толкание ядра), струя воды, прыжки","спорт (баскетбол, ядро итеру), су ағыны, секіру"],"res":["ноутбуки/планшеты, PhET «Движение снаряда», линейки","ноутбуктер/планшеттер, PhET «Снаряд қозғалысы», сызғыштар"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Тело брошено вертикально вверх со скоростью 20 м/с. Найдите время подъёма и максимальную высоту (g = 10 м/с²).","Дене тік жоғары 20 м/с жылдамдықпен лақтырылды. Көтерілу уақытын және ең үлкен биіктікті табыңыз (g = 10 м/с²)."],"h":["Алгоритм: t = v₀/g; h = v₀²/2g.","Алгоритм: t = v₀/g; h = v₀²/2g."],"a":["t = 2 с; h = 20 м","t = 2 с; h = 20 м"]},{"t":["Камень брошен вертикально вверх со скоростью 30 м/с. Найдите максимальную высоту и полное время полёта.","Тас тік жоғары 30 м/с жылдамдықпен лақтырылды. Ең үлкен биіктікті және толық ұшу уақытын табыңыз."],"h":["Подсказка: время полёта = 2·время подъёма.","Кеңес: ұшу уақыты = 2·көтерілу уақыты."],"a":["h = 45 м; t = 6 с","h = 45 м; t = 6 с"]},{"t":["Тело брошено горизонтально со скоростью 15 м/с с высоты 20 м. Найдите время, дальность и скорость при падении.","Дене 20 м биіктіктен 15 м/с жылдамдықпен горизонталь лақтырылды. Уақытты, қашықтықты және түсу жылдамдығын табыңыз."],"h":["Без подсказок.","Кеңессіз."],"a":["t = 2 с; l = 30 м; v = √(15² + 20²) = 25 м/с","t = 2 с; l = 30 м; v = √(15² + 20²) = 25 м/с"]}]},{"n":16,"q":2,"sec":"2A","topic":["Движение искусственных спутников Земли","Жердің жасанды серіктерінің қозғалысы"],"goals":[["выведут формулу первой космической скорости и вычислят её для Земли;","сравнят орбиты космических аппаратов (низкая, геостационарная);","применят формулу в задачах в 3 из 4 заданий."],["бірінші ғарыштық жылдамдық формуласын қорытып, Жер үшін есептейді;","ғарыш аппараттарының орбиталарын (төмен, геотұрақты) салыстырады;","формуланы есептерде 4 тапсырманың 3-еуінде қолданады."]],"hook":["Космодром Байконур – старт к МКС. Почему спутник не падает на Землю, хотя на него действует тяготение?","Байқоңыр ғарыш айлағы – ХҒС-қа ұшу басталатын орын. Серікке тартылыс күші әсер етсе де, ол неге Жерге құламайды?"],"qs":[["Что такое искусственный спутник Земли?","Какая сила сообщает спутнику центростремительное ускорение?","Чем геостационарная орбита отличается от низкой?"],["Жердің жасанды серігі деген не?","Серікке центрге тартқыш үдеуді қандай күш береді?","Геотұрақты орбита төмен орбитадан немен ерекшеленеді?"]],"explore":["В симуляции PhET «Гравитация и орбиты» (Gravity and Orbits) группы меняют начальную скорость спутника и наблюдают: падение, эллипс, круговая орбита, уход в космос. Находят скорость круговой орбиты, сравнивают с расчётом v₁ = √(gR), заполняют таблицу «Низкая / геостационарная орбита» (высота, период, применение).","PhET «Гравитация және орбиталар» (Gravity and Orbits) симуляциясында топтар серіктің бастапқы жылдамдығын өзгертіп, құлауды, эллипсті, дөңгелек орбитаны, ғарышқа кетуді бақылайды. Дөңгелек орбита жылдамдығын тауып, v₁  (Radio Waves) – сравнение с механическими волнами.","1-станция: диапазон карточкаларын (радио, аса жоғары жиілік, инфрақызыл, көрінетін, ультракүлгін, рентген, гамма) толқын ұзындығы мен жиілігі бойынша қолданылуымен бірге сұрыптау. 2-станция: призма немесе компакт-диск – дисперсияны бақылау, түстер реті. 3-станция: PhET «Радиотолқындар және электромагниттік өрістер» (Radio Waves) – механикалық толқындармен салыстыру."],"find":["с ростом частоты длина волны уменьшается, энергия фотона растёт; белый свет раскладывается в спектр","жиілік артқан сайын толқын ұзындығы азаяды, фотон энергиясы өседі; ақ жарық спектрге жіктеледі"],"key":["c = λν = 3·10⁸ м/с; ЭМ волны поперечны, распространяются в вакууме; дисперсия – зависимость показателя преломления от частоты.","c = λν = 3·10⁸ м/с; ЭМ толқындар көлденең, вакуумда таралады; дисперсия – сыну көрсеткішінің жиілікке тәуелділігі."],"life":["радио, Wi-Fi, мобильная связь, медицина, радар","радио, Wi-Fi, ұялы байланыс, медицина, радар"],"res":["карточки диапазонов, призма/CD, PhET Radio Waves","диапазон карточкалары, призма/CD, PhET Radio Waves"],"comp":["l.6","l.8","d.2"],"meth":["lab","coop"],"tasks":[{"t":["Найдите длину радиоволны частотой 100 МГц (c = 3·10⁸ м/с).","Жиілігі 100 МГц радиотолқынның ұзындығын табыңыз (c = 3·10⁸ м/с)."],"h":["Алгоритм: λ = c/ν.","Алгоритм: λ = c/ν."],"a":["λ = 3 м","λ = 3 м"]},{"t":["Найдите частоту оранжевого света с длиной волны 600 нм.","Толқын ұзындығы 600 нм қызғылт сары жарықтың жиілігін табыңыз."],"h":["Подсказка: 600 нм = 6·10⁻⁷ м.","Кеңес: 600 нм = 6·10⁻⁷ м."],"a":["ν = 3·10⁸/6·10⁻⁷ = 5·10¹⁴ Гц","ν = 3·10⁸/6·10⁻⁷ = 5·10¹⁴ Гц"]},{"t":["Радиолокатор получил отражённый сигнал через 2 мс. Найдите расстояние до цели.","Радиолокатор шағылған сигналды 2 мс-тан кейін алды. Нысанға дейінгі қашықтықты табыңыз."],"h":["Без подсказок.","Кеңессіз."],"a":["s = 3·10⁸·2·10⁻³/2 = 3·10⁵ м = 300 км","s = 3·10⁸·2·10⁻³/2 = 3·10⁵ м = 300 км"]}]},{"n":27,"q":4,"sec":"4A","topic":["Тепловое излучение. Гипот ET «Альфа-ыдырау» – ядроның ыдырауы."],"find":["почти все α-частицы проходят, некоторые отклоняются на большие углы → в атоме есть малое массивное положительное ядро","α-бөлшектердің дерлік барлығы өтіп кетеді, кейбіреулері үлкен бұрышқа ауытқиды → атомда кіші, массасы үлкен, оң зарядты ядро бар"],"key":["α – ядра гелия ⁴₂He; β – электроны (позитроны); γ – ЭМ излучение; планетарная модель Резерфорда: ядро + электроны.","α – гелий ядролары ⁴₂He; β – электрондар (позитрондар); γ – ЭМ сәуле; Резерфордтың планетарлық моделі: ядро + электрондар."],"life":["радиометры, дозиметры, медицина, датировка по изотопам","радиометрлер, дозиметрлер, медицина, изотоптар бойынша жасын анықтау"],"res":["ноутбуки/планшеты, PhET Rutherford Scattering, карточки-схемы","ноутбуктер/планшеттер, PhET Rutherford Scattering, схема-карточкалар"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Что представляет собой α-частица, чему равен её заряд?","α-бөлшек дегеніміз не, оның заряды неге тең?"],"h":["Опора: ⁴₂He.","Тірек: ⁴₂He."],"a":["Ядро гелия, 2 протона + 2 нейтрона; заряд +2e","Гелий ядросы, 2 протон + 2 нейтрон; заряды +2e"]},{"t":["Что показал опыт Резерфорда и какой вывод о строении атома сделан?","Резерфорд тәжірибесі нені көрсетті және атом құрылысы туралы қандай қорытынды жасалды?"],"h":["Подсказка: большинство частиц проходит, малая часть отклоняется.","Кеңес: бөлшектердің көпшілігі өтеді, аз бөлігі ауытқиды."],"a":["Атом почти пустой; в центре малое положительное ядро с основной массой","Атом дерлік бос; ортасында массасының көбі шоғырланған кіші оң ядро бар"]},{"t":["Дефект массы ядра 0,03 а.е.м. Найдите энергию связи (1 а.е.м. ≈ 931,5 МэВ).","Ядро масса ақауы 0,03 а.м.б. Байланыс энергиясын табыңыз (1 а.м.б. ≈ 931,5 МэВ)."],"h":["Без подсказок. E = Δm·931,5.","Кеңессіз. E = Δm·931,5."],"a":["E ≈ 28 МэВ","E ≈ 28 МэВ"]}]},{"n":30,"q":4,"sec":"4B","topic":["Ядерное взаимодействие, ядерные силы. Дефект масс, энергия связи атомных ядер","Ядролық өзара әрекеттесу, ядро  ыдырау периоды деген не?","Ядролық реакцияларда не сақталады?"]],"explore":["Модель распада: каждый «атом» – монета (по 64 на группу). Бросают монеты, «распавшиеся» (орёл) убирают; считают оставшихся по раундам, строят график N(t), находят «период полураспада». Затем решают уравнения ядерных реакций, подбирая недостающие Z и A. Дополнительно: PhET «Игра о радиоактивном датировании».","Ыдырау моделі: әр «атом» – тиын (топқа 64-тен). Тиындарды лақтырып, «ыдыраған» (елтаңба) тиындарды алып тастайды; қалғандарды раундтар бойынша санап, N(t) графигін салып, «жартылай ыдырау периодын» табады. Содан кейін жетпейтін Z және A мәндерін таңдап, ядролық реакция теңдеулерін шешеді. Қосымша: PhET «Радиоактивті жас анықтау ойыны»."],"find":["число нераспавшихся ядер убывает по закону с постоянным периодом: за каждый период остаётся половина; распад – вероятностный","ыдырамаған ядролар саны тұрақты периодпен азаяды: әр периодта жартысы қалады; ыдырау – ықтималдық сипатты"],"key":["N = N₀·2^(−t/T); в реакциях сохраняются суммы Z и A.","N = N₀·2^(−t/T); реакцияларда Z және A қосындылары сақталады."],"life":["радиоуглеродный анализ, медицина, датировка артефактов","радиокөміртекті талдау, медицина, жәдігерлердің жасын анықтау"],"res":["монеты (по 64 на группу), карточки реакций, PhET Radioactive Dating Game","тиындар (топқа 64-тен), реакция карточкалары, PhET Radioactive Dating Game"],"comp":["l.6","l.8","g.9"],"meth":["lab","coop"],"tasks":[{"t":["Допишите реакцию: ²³⁸₉₂U → ? + ⁴₂He.","Реакцияны аяқтаңыз: ²³⁸₉₂U → ? + ⁴₂He."],"h":["Опора: сумма A и Z сохраняется.","Тірек: A және Z қосындысы сақталады."],"a":["²³⁴₉₀Th (A = 234, Z = 90)","²³⁴₉₀Th (A = 234, Z = 90)"]},{"t":["Допишите реакцию: ¹⁴₇N + ⁴₂He → ¹⁷₈O + ?","Реакцияны аяқтаңыз: ¹⁴₇N + ⁴₂He → ¹⁷₈O + ?"],"h":["Подсказка: найдите A и Z недостающей частицы.","Кеңес: жетпейтін бөлшектің A және Z мәндерін табыңыз."],"a":["¹₁H – протон","¹₁H – протон"]},{"t":["Период полураспада йода-131 равен 8 суток. Какая доля ядер останется через нологии из карточек.","Карточкалардағы кез келген технологияның бір артықшылығы мен бір қаупін атаңыз."],"h":["Опора: шаблон «польза – риск – решение».","Тірек: «пайда – қауіп – шешім» үлгісі."],"a":["Примерный ответ: солнечные панели – чистая энергия / производство и утилизация панелей","Шамамен: күн панельдері – таза энергия / панельдерді өндіру және кәдеге жарату"]},{"t":["Лампа накаливания 60 Вт горит 5 ч в день, светодиодная 8 Вт – столько же. Найдите экономию энергии за 30 дней.","Қыздыру шамы 60 Вт күніне 5 сағат жанады, жарық диодты 8 Вт – сонша уақыт. 30 күнде энергия үнемін табыңыз."],"h":["Подсказка: E = P·t; переведите в кВт·ч.","Кеңес: E = P·t; кВт·сағ-қа аударыңыз."],"a":["9 кВт·ч − 1,2 кВт·ч = 7,8 кВт·ч","9 кВт·сағ − 1,2 кВт·сағ = 7,8 кВт·сағ"]},{"t":["Выберите позицию по вопросу о роли ядерной энергетики и приведите 3 аргумента с учётом экологии и безопасности.","Ядролық энергетиканың рөлі туралы мәселе бойынша ұстаным таңдап, экология мен қауіпсіздікті ескеріп, 3 дәлел келтіріңіз."],"h":["Без подсказок.","Кеңессіз."],"a":["Оценивается по критериям: чёткая позиция, 3 аргумента, учёт рисков","Критерийлер бойынша бағаланады: нақты ұстаным, 3 дәлел, қауіптерді ескеру"]}]}],"st":{"1":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Пассажир в поезде спокойно сидит, а для наблюдателя на перроне он мчится со скоростью 20 м/с. Кто прав?»","Задаёт три учебных вопроса:","- Что такое тело отсчёта и зачем оно нужно?","- Можно ли считать самолёт материальной точкой при перелёте Астана – Павлодар? А при посадке?","- Как задать положение точки на плоскости?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Группы получают клетчатое поле с маршрутом «корпус – столовая – спортзал» из трёх векторов перемещения. Строят суммарный вектор правилом многоугольника, измеряют его модуль и проекции на оси X и Y (по желанию – проверка в симуляции PhET «Векторы»).","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: модуль суммы векторов не равен сумме модулей; проекция зависит от направления оси."],["клетчатые поля с маршрутом, линейки, транспортиры, PhET «Векторы»"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: Сумма векторов находится по правилу треугольника/многоугольника; проекция a_x = a·cosα, a_y = a·sinα; относительность движения: движение зависит от выбора системы отсчёта.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Пойызда отырған жолаушы тыныш отыр, ал перрондағы бақылаушы үшін ол 20 м/с жылдамдықпен жүріп барады. Кім дұрыс?»","Үш оқу сұрағын қояды:","- Санақ денесі деген не және ол не үшін қажет?","- Астана – Павлодар рейсінде ұшақты материялық нүкте деп санауға бола ма? Қонған кезде ше?","- Нүктенің жазықтықтағы орнын қалай беруге болады?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Топтар «оқу корпусы – асхана – спортзал» бағытындағы үш орын ауыстыру векторы салынған торлы өрісті алады. Көпбұрыш ережесімен қосынды векторды салады, оның модулін және X пен Y осьтеріндегі проекцияларын өлшейді (қалауы бойынша PhET «Векторлар» симуляциясында тексереді).","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: векторлар қосындысының модулі модульдер қосындысына тең емес; проекция ось бағытына тәуелді."],["маршруты бар торлы өрістер, сызғыштар, транспортирлер, PhET «Векторлар»"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: Векторлардың қосындысы үшбұрыш/көпбұрыш ережесімен табылады; проекция a_x = a·cosα, a_y = a·sinα; қозғалыс санақ жүйесін таңдауға тәуелді.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"2":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Спортивный автомобиль разгоняется до 100 км/ч за 5 секунд. Как это «измерить» одним числом?»","Задаёт три учебных вопроса:","- Чем отличается равномерное движение от равноускоренного?","- Что показывает наклон графика скорости?","- Как найти путь по графику скорости?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Исследование**","(15 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Каждая группа получает три карточки с графиками v(t) разных движений (разгон, торможение, равномерное). По наклону находят ускорение, по площади под графиком – перемещение; результаты проверяют в симуляции PhET «Человечек» (The Moving Man).","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: ускорение – наклон графика v(t), перемещение – площадь под графиком."],["карточки с графиками, PhET «Человечек», линейки"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: a = (v − v₀)/t; v = v₀ + at; s = v₀t + at²/2.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(12 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Спорткөлік 5 секундта 100 км/сағ жылдамдыққа дейін үдейді. Мұны бір санмен қалай «өлшеуге» болады?»","Үш оқу сұрағын қояды:","- Бірқалыпты қозғалыс теңүдемелі қозғалыстан несімен ерекшеленеді?","- Жылдамдық графигінің көлбеулігі нені көрсетеді?","- Жылдамдық графигі бойынша жолды қалай табуға болады?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зерттеу**","(15 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Әр топ әртүрлі қозғалыстардың (үдеу, тежелу, бірқалыпты) v(t) графиктері бар үш картаны алады. Көлбеуі бойынша үдеуді, график астындағы аудан бойынша орын ауыстыруды табады; нәтижені PhET «Қозғалыстағы адам» (The Moving Man) симуляциясында тексереді.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: үдеу – v(t) графигінің көлбеуі, орын ауыстыру – график астындағы аудан."],["графиктері бар карталар, PhET «Қозғалыстағы адам», сызғыштар"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: a = (v − v₀)/t; v = v₀ + at; s = v₀t + at²/2.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(12 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"3":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Шарик скатывается с горки всё быстрее. А можно ли узнать его ускорение, имея только линейку и секундомер?»","Задаёт три учебных вопроса:","- По какой формуле находят перемещение при равноускоренном движении из состояния покоя?","- Какие приборы нужны для измерения s и t?","- Какие причины могут исказить результат?","Просит показать карточку-«светофор» (уверенность в теме). Формирует группы по 4 человека с разным уровнем подготовки."],["Отвечают на вопросы, высказывают гипотезы.","Записывают прогноз (гипотезу) по теме урока.","Показывают «светофор»."],["**Диагностическое оценивание.** Метод: «Учебные вопросы».","Дескрипторы: обучающийся","- отвечает на вопросы по ранее изученному;","- выдвигает гипотезу (прогноз) по теме урока."],["Слайд с триггером","Карточки «светофор»"]],[["**Постановка цели**","(3 мин)"],["Предлагает сопоставить прогнозы с темой урока и сформулировать цель. Даёт речевые опоры (скаффолд): «Я смогу объяснить…», «Я смогу рассчитать…», «Я выясню, как…». Знакомит с критериями успеха (цели урока)."],["Формулируют тему и цель урока с использованием речевых опор.","Записывают критерии успеха."],["**Формативное оценивание.** Метод: «Наблюдение».","Дескриптор: формулирует цель с глаголом действия (выяснить, установить, рассчитать)."],["Слайд с критериями успеха","Речевые опоры"]],[["**Середина урока**","**Выполнение лабораторной работы / исследование**","(20 мин)"],["Распределяет роли в группе: экспериментатор, регистратор, аналитик, спикер.","**«Я делаю»:** показывает первый шаг исследования. **«Мы делаем»:** группы работают по карте-подсказке (А – алгоритм и образец; Б – вопросы-подсказки; В – самостоятельный план).","Роли: экспериментатор, хронометрист, регистратор, аналитик. Группа собирает наклонный желоб, измеряет время скатывания шарика (тележки) на 4 разных расстояниях s (по 3 замера), вычисляет a = 2s/t² и среднее значение. По желанию – проверка в симуляции. Педагог показывает первый замер («Я делаю»), затем группы работают по карте-подсказке.","Вместо готовых ответов задаёт наводящие вопросы."],["Работают в группах по ролям, фиксируют данные (наблюдения).","Обсуждают результаты и формулируют вывод."],["**Формативное оценивание.** Метод: «Наблюдение» (чек-лист).","Дескрипторы: обучающийся","- выполняет свою роль в группе;","- фиксирует данные (наблюдения) полно и точно;","- формулирует вывод: s прямо пропорционально t²; ускорение постоянно и зависит от угла наклона."],["наклонный желоб, шарик/тележка, секундомер, измерительная лента, штатив"]],[["**Обобщение**","**Формулирование вывода**","(5 мин)"],["Организует краткие отчёты спикеров (по 30 секунд), сопоставляет выводы групп. Вместе с классом формулирует: a = 2s/t²; график s(t²) – прямая, наклон равен a/2.","Организует «две звезды и одно пожелание» между группами."],["Спикеры представляют выводы.","Записывают формулировку и формулы в опорный конспект.","Дают сверстникам обратную связь."],["**Формативное оценивание.** Метод: «Обратная связь от сверстников».","Дескрипторы: обучающийся","- формулирует вывод (закон) правильно;","- записывает необходимые формулы;","- даёт обратную связь: две удачные позиции и пожелание."],["Слайд","Опорный конспект","Стикеры"]],[["**Применение**","**Решение задач по уровням**","(7 мин)"],["Предлагает задания трёх уровней (таблица заданий в конце плана). Уровень выбирается по «светофору» и результатам исследования: А – с алгоритмом, Б – с подсказкой, В – без опоры.","Организует «станцию проверки» с ключом: при расхождении ответа – подсказка и исправление, затем переход на следующий уровень (постепенное снятие опоры).","Консультирует обучающихся, работающих на уровне А."],["Выполняют задание выбранного уровня, оформляя «Дано – Формула – Решение – Ответ».","Сверяют ответ с ключом, исправляют ошибки, переходят на следующий уровень."],["**Формативное оценивание.** Метод: «Наблюдение», самопроверка по ключу.","Дескрипторы (по 1 баллу, максимум 4): обучающийся","- верно записывает условие и выбирает формулу (тезис);","- выполняет вычисления (рассуждение) без ошибок;","- записывает ответ с единицей измерения (выводом);","- проверяет результат по ключу и исправляет ошибки."],["Таблица заданий","Ключ ответов","Калькуляторы"]],[["**Конец урока**","**Рефлексия**","(5 мин)"],["Возвращает обучающихся к прогнозам начала урока: «Что подтвердилось?» Предлагает заполнить лист самоанализа и снова показать «светофор».","Комментирует работу групп, отмечает прогресс. Домашнее задание на выбор уровня: прочитать параграф учебника по теме урока; решить 3 задачи (А, Б или В) из таблицы заданий либо придумать пример из жизни по теме."],["Сравнивают прогноз с выводом, заполняют лист самоанализа.","Показывают «светофор».","Записывают домашнее задание."],["**Самоанализ.**","Дескрипторы: обучающийся","- называет, что получилось хорошо;","- определяет, что требует улучшения;","- указывает следующий шаг в обучении."],["Лист самоанализа","Дневник"]]],[[["**Сабақтың басы**","**Білімді жаңғырту. Бастапқы деңгейді диагностикалау**","(5 мин)"],["Оқушылармен амандасады, жұмысты ұйымдастырады. Эмоциялық триггер: «Шарик төбешіктен барған сайын тез домалайды. Тек сызғыш пен секундомер арқылы оның үдеуін білуге бола ма?»","Үш оқу сұрағын қояды:","- Тыныштық күйден теңүдемелі қозғалғанда орын ауыстыру қай формуламен табылады?","- s және t өлшеуге қандай құралдар қажет?","- Нәтижені қандай себептер бұрмалауы мүмкін?","«Бағдаршам» карточкасын көрсетуді сұрайды (тақырыпқа сенімділік). Дайындық деңгейі әртүрлі 4 адамнан топтар құрады."],["Сұрақтарға жауап береді, болжам айтады.","Сабақ тақырыбы бойынша болжамды (гипотезаны) жазады.","«Бағдаршамды» көрсетеді."],["**Диагностикалық бағалау.** Әдіс: «Оқу сұрақтары».","Дескрипторлар: оқушы","- бұрын өтілген материал бойынша сұрақтарға жауап береді;","- сабақ тақырыбы бойынша гипотеза (болжам) айтады."],["Триггері бар слайд","«Бағдаршам» карточкалары"]],[["**Мақсат қою**","(3 мин)"],["Болжамдарды сабақ тақырыбымен салыстырып, мақсатты тұжырымдауды ұсынады. Сөйлеу тіректерін береді (скаффолд): «Мен түсіндіре аламын…», «Мен есептей аламын…», «Мен анықтаймын…». Табыс критерийлерімен (сабақ мақсаттары) таныстырады."],["Сөйлеу тіректерін пайдаланып, сабақ тақырыбы мен мақсатын тұжырымдайды.","Табыс критерийлерін жазады."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау».","Дескриптор: мақсатты әрекет етістігімен тұжырымдайды (анықтау, орнату, есептеу)."],["Табыс критерийлері слайды","Сөйлеу тіректері"]],[["**Сабақтың ортасы**","**Зертханалық жұмысты орындау / зерттеу**","(20 мин)"],["Топта рөлдерді бөледі: тәжірибеші, тіркеуші, талдаушы, спикер.","**«Мен істеймін»:** зерттеудің бірінші қадамын көрсетеді. **«Біз істейміз»:** топтар тірек картасымен жұмыс істейді (А – алгоритм және үлгі; Б – кеңес-сұрақтар; В – өз бетінше жоспар).","Рөлдер: тәжірибеші, хронометршы, тіркеуші, талдаушы. Топ көлбеу науаны жинап, шариктің (арбаның) 4 түрлі s қашықтығындағы домалау уақытын өлшейді (әрқайсысында 3 өлшем), a = 2s/t² есептеп, орташа мәнін табады. Қалауы бойынша симуляциямен тексереді. Педагог бірінші өлшемді көрсетеді («Мен істеймін»), одан кейін топтар тірек картасымен жұмыс істейді.","Дайын жауаптардың орнына жетелеуші сұрақтар қояды."],["Топта рөлдер бойынша жұмыс істейді, деректерді (бақылауларды) тіркейді.","Нәтижелерді талқылап, қорытынды жасайды."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау» (чек-парақ).","Дескрипторлар: оқушы","- топтағы өз рөлін орындайды;","- деректерді (бақылауларды) толық әрі дәл тіркейді;","- қорытынды жасайды: s мен t² тура пропорционал; үдеу тұрақты және көлбеу бұрышына тәуелді."],["көлбеу науа, шарик/арба, секундомер, өлшеуіш лента, штатив"]],[["**Жинақтау**","**Қорытындыны тұжырымдау**","(5 мин)"],["Спикерлердің қысқа есептерін (30 секундтан) ұйымдастырып, топтардың қорытындыларын салыстырады. Сыныппен бірге тұжырымдайды: a = 2s/t²; s(t²) графигі – түзу, көлбеуі a/2-ге тең.","Топтар арасында «екі жұлдыз және бір тілек» ұйымдастырады."],["Спикерлер қорытындыларды таныстырады.","Тұжырымдама мен формулаларды тірек конспектіге жазады.","Құрдастарына кері байланыс береді."],["**Қалыптастырушы бағалау.** Әдіс: «Құрдастардың кері байланысы».","Дескрипторлар: оқушы","- қорытындыны (заңды) дұрыс тұжырымдайды;","- қажетті формулаларды жазады;","- кері байланыс береді: екі жақсы тұс және тілек."],["Слайд","Тірек конспект","Стикерлер"]],[["**Қолдану**","**Есептерді деңгейлер бойынша шығару**","(7 мин)"],["Үш деңгейдегі тапсырмаларды ұсынады (жоспар соңындағы тапсырмалар кестесі). Деңгей «бағдаршам» мен зерттеу нәтижесі бойынша таңдалады: А – алгоритммен, Б – кеңеспен, В – тіректісіз.","Кілті бар «тексеру станциясын» ұйымдастырады: жауап сәйкес келмесе – кеңес және түзету, содан кейін келесі деңгейге өту (тіректі біртіндеп алу).","А деңгейінде жұмыс істейтін оқушыларға кеңес береді."],["Таңдалған деңгейдегі тапсырманы «Берілгені – Формула – Шешуі – Жауабы» түрінде рәсімдеп орындайды.","Жауабын кілтпен тексеріп, қателерді түзетеді, келесі деңгейге өтеді."],["**Қалыптастырушы бағалау.** Әдіс: «Бақылау», кілт бойынша өзін-өзі тексеру.","Дескрипторлар (1 баллдан, ең көбі 4): оқушы","- шартты дұрыс жазып, формуланы (тезисті) таңдайды;","- есептеуді (пайымдауды) қатесіз орындайды;","- жауабын өлшем бірлігімен (қорытындымен) жазады;","- нәтижені кілтпен тексеріп, қателерді түзетеді."],["Тапсырмалар кестесі","Жауап кілті","Калькуляторлар"]],[["**Сабақтың соңы**","**Рефлексия**","(5 мин)"],["Оқушыларды сабақ басындағы болжамдарға қайтарады: «Не расталды?» Өзін-өзі талдау парағын толтыруды және «бағдаршамды» қайта көрсетуді ұсынады.","Топтардың жұмысына пікір айтып, прогресті атап өтеді. Деңгей таңдауымен үй тапсырмасы: сабақ тақырыбы бойынша оқулық тармағын оқу; тапсырмалар кестесінен 3 есеп (А, Б немесе В) шығару не тақырып бойынша өмірден мысал ойлап табу."],["Болжамды қорытындымен салыстырады, өзін-өзі талдау парағын толтырады.","«Бағдаршамды» көрсетеді.","Үй тапсырмасын жазады."],["**Өзін-өзі талдау.**","Дескрипторлар: оқушы","- не жақсы шыққанын атайды;","- нені жақсарту керегін анықтайды;","- оқудағы келесі қадамды көрсетеді."],["Өзін-өзі талдау парағы","Күнделік"]]]],"4":[[[["**Начало урока**","**Актуализация знаний. Диагностика исходного уровня**","(5 мин)"],["Приветствует обучающихся, организует работу. Эмоциональный триггер: «Одновременно роняем мяч и бросаем горизонтально второй. Какой упадёт раньше?»","Задаёт три учебных вопроса:","- Какое ускорение имеют тела при свободном падении?","- Из каких двух движений складывается бросок горизонтально?","- От чего зависит время па
